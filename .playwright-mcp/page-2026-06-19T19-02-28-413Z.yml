    - heading "Pointers in Zig" [level=1] [ref=e3]
    - paragraph [ref=e4]:
      - text: This post is going to explain how pointers, arrays, and slices work in Zig, without depending on knowledge of other languages that use pointers. If you're trying to learn Zig and your only programming experience is in a language with managed memory, this is for you. If you're struggling to understand pointers in C, this might help. If you're coming from C or C++ and just want to know the differences, you might be better off reading the official documentation for
      - link "arrays" [ref=e5] [cursor=pointer]:
        - /url: https://ziglang.org/documentation/master/#Arrays
      - text: ","
      - link "slices" [ref=e6] [cursor=pointer]:
        - /url: https://ziglang.org/documentation/master/#Slices
      - text: ", and"
      - link "pointers" [ref=e7] [cursor=pointer]:
        - /url: https://ziglang.org/documentation/master/#Pointers
      - text: .
      - link "Ziglearn" [ref=e8] [cursor=pointer]:
        - /url: https://ziglearn.org/chapter-1/#pointers
      - text: is another good resource.
    - heading "Memory" [level=1] [ref=e9]
