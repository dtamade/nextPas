    - paragraph [ref=e317]:
      - text: The slicing syntax
      - code [ref=e318]: orders[0..]
      - text: says to take a slice of the orders array, starting at index 0 and going to the end. We could get just "off" by slicing
      - code [ref=e319]: orders[5..8]
      - text: out of the array instead.
    - heading "const" [level=1] [ref=e320]
    - paragraph [ref=e321]:
      - text: I've sprinkled the
      - code [ref=e322]: const
      - text: keyword through this post without really explaining what it does. This is the part where that changes. Whenever you see
      - code [ref=e323]: const
      - text: in a Zig type, it means that whatever comes next can't be changed. So a slice of
      - code [ref=e324]: u8
      - text: s declared as
      - code [ref=e325]: "[]const u8"
      - text: ", means that the slice itself can change, but the"
      - code [ref=e326]: u8
      - text: s to which it points can't. Here's some code with the "whatever comes next" in bold.
    - generic [ref=e327]: "var orders: [18]u8 = [_]u8{ 'T', 'a', 'k', 'e', ' ', 'o', 'f', 'f', ' ', 'e', 'v', 'e', 'r', 'y', ' ', 'z', 'i', 'g', }; var slice: []const u8 = orders[0..]; slice = orders[5..8]; // Legal slice[0] = 'X'; // error: cannot assign to constant const slice2: []u8 = orders[0..]; slice2[0] = 'X'; // Legal slice2 = orders[5..8]; // error: cannot assign to constant"
    - paragraph [ref=e328]:
      - text: So values declared
      - code [ref=e329]: var
      - text: can change, even if they point to things that can't, and values declared
      - code [ref=e330]: const
      - text: can't, even if they point to things that can. This is important for...
    - heading "Function Parameters" [level=1] [ref=e331]
    - paragraph [ref=e332]:
      - text: Function parameters in Zig are always implicitly
      - code [ref=e333]: const
      - text: . There's no way to make them
      - code [ref=e334]: var
      - text: ". Consider the following 3 tests:"
    - generic [ref=e335]: "fn times2(a: u32) u32 { return a * 2; } test \"use function\" { var a: u32 = 3; const b = times2(a); } test \"inline\" { const a: u32 = 3; const b: u32 = a * 2; } test \"var\" { var a: u32 = 3; a = a * 2; b = a; }"
    - paragraph [ref=e336]:
      - text: The first two tests are equivalent, because
      - code [ref=e337]: a
      - text: is
      - code [ref=e338]: const
      - text: when it's multiplied by two. The third example is defferent. It modifies the value of
      - code [ref=e339]: a
      - text: in place before assigning it to
      - code [ref=e340]: b
      - text: . Note that the
      - code [ref=e341]: const
      - text: keyword doesn't appear at all in the definition of
      - code [ref=e342]: times2
      - text: ", but if we had tried to do"
      - code [ref=e343]: a = a * 2; return a;
      - text: in that function, the compiler would have spat out
      - code [ref=e344]: "error: cannot assign to constant"
      - text: . That's what "function parameters in Zig are always implicitly
      - code [ref=e345]: const
      - text: "\" means."
    - paragraph [ref=e346]:
      - text: Limiting the language to pure functions seems nice, but sometimes you need a function to modify its arguments in place. For example, let's write a function to reverse an array of
      - code [ref=e347]: u8
      - text: s. It will have to take the array's length as a comptime parameter, since arrays lengths must be known at compile time.
    - generic [ref=e348]: "fn reverse(comptime L: usize, array: [L]u8) [L]u8 { var out: [L]u8 = undefined; for (array) |elem, idx| { out[L - idx - 1] = elem; } return out; }"
    - paragraph [ref=e349]: This function has some problems. First is that it doubles the amount of memory required by the array. Even if we're never going to use the un-reversed version of the array again, it's still there, unmodified. The other major issue is that we have to know the array's length at compile time. That means no reversing dynamically allocated memory for us. We can get around both of these by switching from an array-reverser to a slice-reverser.
    - paragraph [ref=e350]:
      - text: Instead of accepting and returning
      - code [ref=e351]: "[L]u8"
      - text: ", it can just accept a"
      - code [ref=e352]: "[]u8"
      - text: ", reverse the slice in place, and return"
      - code [ref=e353]: void
      - text: . Let's look at the standard library's implementation of
      - code [ref=e354]: std.mem.reverse
      - text: .
    - generic [ref=e355]: "pub fn swap(comptime T: type, a: *T, b: *T) void { const tmp = a.*; a.* = b.*; b.* = tmp; } pub fn reverse(comptime T: type, items: []T) void { var i: usize = 0; const end = items.len / 2; while (i < end) : (i += 1) { swap(T, &items[i], &items[items.len - i - 1]); } }"
    - paragraph [ref=e356]:
      - text: This has an extra
      - code [ref=e357]: T
      - text: parameter to make it generic across slices of any type, but it's still pretty straightforward. We walk up to the midpoint of the slice, swapping each element with its pair on the other side of the midpoint. No extra memory required, and no chance of failure. Since
      - code [ref=e358]: swap
      - text: can't modify its parameters directly, it takes a pair of pointers and swaps the values they point to.
    - paragraph [ref=e359]:
      - text: Let's do one more memory layout example that uses
