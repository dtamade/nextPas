    - paragraph [ref=e65]:
      - text: This chunk of memory has the number 11 at address 8. Any value stored in memory takes up some number of contiguous bytes. That number varies depending on the type, but no matter how large it is, a value's address is the lowest-numbered address it occupies. So a 4-byte
      - code [ref=e66]: u32
      - text: value that occupies addresses 8 through 11 would be said to be at address 8.
    - paragraph [ref=e67]:
      - text: Using the table above as an example, if we have a
      - code [ref=e68]: u16
      - text: "stored at address 0, we know that it consists of two bytes: 3 and 12 (0x03 and 0x0c in hex). Depending on the machine's endianness (the order in which bytes are interpreted), that means our"
      - code [ref=e69]: u16
      - text: is either 3,075 (0x0c03) or 780 (0x030c). Every value that's stored in memory works like this.
    - heading "Arrays" [level=1] [ref=e70]
    - paragraph [ref=e71]:
      - text: Sometimes we want to store several values of the same type. For example, a sequence of characters to make the string "Take off every zig" needs to live in memory somehow. We could store each of those letters as ASCII in its own
      - code [ref=e72]: u8
      - text: and feed them in sequence to an output function to print the string, but computers are supposed to do work for us, not the other way around.
    - paragraph [ref=e73]:
      - text: Instead, we can store them all in order next to each other in memory, and feed the whole chunk to a print function. This bunch of adjacent values that are all the same type is called an array. Arrays in Zig are defined by their length and the type of value that they hold, with the length in
      - code [ref=e74]: "[square brackets]"
      - text: right before the type. So "Take off every zig" is an
      - code [ref=e75]: "[18]u8"
      - text: or, if we know that nobody will ever modify its contents, we can declare it
      - code [ref=e76]: const
      - text: ". Here it is laid out in memory, at address 51236:"
