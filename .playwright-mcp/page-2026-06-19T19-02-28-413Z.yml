    - paragraph [ref=e189]:
      - text: "The code included one more new thing: dereferencing. The value of"
      - code [ref=e190]: ptr
      - text: is 128, but we don't particularly care what its value is; we want to know the value of the thing it points to. To ask Zig for the value pointed to by a pointer, we use the derefrence operator
      - code [ref=e191]: .*
      - text: . This is the inverse of the address-of operator (
      - code [ref=e192]: "&"
      - text: ).
    - paragraph [ref=e193]:
      - text: This kind of pointer (
      - code [ref=e194]: "*T"
      - text: where T is a type) only refers to exactly one item at a time. There is another kind of pointer in Zig,
      - code [ref=e195]: "[*]T"
      - text: . This is called an unknown-length pointer, and it points to an arbitrary number of values. Using our
      - code [ref=e196]: orders
      - text: "array from the last section, we can get a pointer to its elements with this code:"
    - generic [ref=e197]: "var orders: [18]u8 = [_]u8{ 'T', 'a', 'k', 'e', ' ', 'o', 'f', 'f', ' ', 'e', 'v', 'e', 'r', 'y', ' ', 'z', 'i', 'g', }; var order_ptr: [*]u8 = &orders;"
    - paragraph [ref=e198]:
      - text: This lets us address individual elements of the array, like
      - code [ref=e199]: order_ptr[3]
      - text: ", which would have the value"
      - code [ref=e200]: "'e'"
      - text: . Unfortunately, this also lets us ask for
      - code [ref=e201]: order_ptr[100]
      - text: and Zig will happily tell us whatever is 100 bytes away from
      - code [ref=e202]: order_ptr
      - text: in memory, even though it's not part of
      - code [ref=e203]: orders
      - text: . This can lead to errors that are difficult to detect and fix. The problem here is that unknown-length pointers don't have known lengths (surprise) so access through them can't be checked to ensure that it doesn't go past the end of the array.
    - heading "Slices" [level=1] [ref=e204]
    - paragraph [ref=e205]:
      - text: "Slices solve this problem. You can get a slice from an array with the slicing syntax:"
      - code [ref=e206]: array[start..end]
      - text: where
      - code [ref=e207]: start
      - text: is the index of the first element that will be in the slice and
      - code [ref=e208]: end
      - text: is the index 1 past the last element. The
      - code [ref=e209]: end
      - text: parameter can be left off if you want to take the rest of the array, so
      - code [ref=e210]: array[0..]
      - text: is a slice comprising all the elements in
      - code [ref=e211]: array
      - text: and
      - code [ref=e212]: array[0..10]
      - text: is the first 10 elements.
    - paragraph [ref=e213]: You can think of a slice like a struct with an unknown-length pointer and a length.
    - generic [ref=e214]: "fn Slice(comptime T: type) type { return struct { ptr: [*]T, len: usize, }; }"
    - paragraph [ref=e215]:
      - text: Zig comes with some extra syntax support for slices, so the type
      - code [ref=e216]: Slice(u8)
      - text: is referred to as
      - code [ref=e217]: "[]u8"
      - text: and the 3rd element of a slice named
      - code [ref=e218]: slice
      - text: is
      - code [ref=e219]: slice[2]
      - text: . Raw unknown-length pointers are best avoided in Zig; slices are much safer and easier to use. Going back to our trusty
      - code [ref=e220]: orders
      - text: example, here's some code and associated memory layout with a slice.
    - generic [ref=e221]: "var orders: [18]u8 = [_]u8{ 'T', 'a', 'k', 'e', ' ', 'o', 'f', 'f', ' ', 'e', 'v', 'e', 'r', 'y', ' ', 'z', 'i', 'g', }; var slice: []const u8 = orders[0..];"
