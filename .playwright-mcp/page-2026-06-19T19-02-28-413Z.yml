    - paragraph [ref=e137]:
      - text: That chunk of memory from 51236 to 51253
      - emphasis [ref=e138]: is
      - text: the array. We can create an array just like it, taking advantage of Zig's array literal length inference syntax (
      - code [ref=e139]: "[_]T"
      - text: "), with the following Zig code:"
    - generic [ref=e140]: "var orders: [18]u8 = [_]u8{ 'T', 'a', 'k', 'e', ' ', 'o', 'f', 'f', ' ', 'e', 'v', 'e', 'r', 'y', ' ', 'z', 'i', 'g', };"
    - paragraph [ref=e141]:
      - text: That's what arrays look like in memory and how to define them. If we wanted to write a function that could accept any 18-byte sequence but promises not to change its contents, it would start with something like
      - code [ref=e142]: "fn look(array: [18]u8) void"
      - text: .
    - heading "Pointers" [level=1] [ref=e143]
    - paragraph [ref=e144]:
      - text: A pointer is a value that holds the address of another value. In Zig, you can get the address of any value by using the address-of operator
      - code [ref=e145]: "&"
      - text: . The type of a pointer is an asterisk (
      - code [ref=e146]: "*"
      - text: ) before the type of the value to which it points. So a
      - code [ref=e147]: "*u8"
      - text: points to a
      - code [ref=e148]: u8
      - text: . Here's a little bit of sample Zig code, along with its associated memory. We'll use a machine with 8-bit pointers so we don't have to worry about endianness.
    - generic [ref=e149]: "var num: u8 = 12; const ptr: *u8 = &num; std.testing.expectEqual(ptr.*, num);"
    - table "A u8 and its pointer" [ref=e150]:
