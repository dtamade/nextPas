          - heading "Slices" [level=1] [ref=e39]
          - paragraph [ref=e40]:
            - text: Slices can be thought of many-item pointers (
            - code [ref=e41]: "[*]T"
            - text: ) with a length (
            - code [ref=e42]: usize
            - text: ). These use the syntax
            - code [ref=e43]: "[]T"
            - text: . Slices are easier to use safely and more convinient than many-item pointers, as they store the valid length of the buffer with them. Slices are sometimes referred to as "fat pointers" as they're typically double the size of a normal pointer. Slices are the most common way to pass around buffers in Zig.
          - group [ref=e45]:
            - generic "Coming from Go? ▼" [ref=e46]:
              - generic [ref=e48]:
                - img [ref=e50]
                - text: Coming from Go?
              - generic [ref=e71]: ▼
          - paragraph [ref=e72]:
            - text: Unlike many-item pointers,
            - code [ref=e73]: for
            - text: loops work on slices.
          - paragraph [ref=e74]:
            - text: The syntax
            - code [ref=e75]: x[n..m]
            - text: is used to create a slice from an array, an operation known as
            - strong [ref=e76]: slicing
            - text: . This creates a "slice" - a view into the array consisting of a pointer and a length. Slicing includes the first element (
            - code [ref=e77]: "n"
            - text: ), but excludes the last element (
            - code [ref=e78]: m
            - text: ).
          - paragraph [ref=e79]:
            - text: In this example, a
            - code [ref=e80]: const
            - text: slice is used in the
            - code [ref=e81]: total
            - text: function as it doesn't write to the slice's buffer.
          - generic [ref=e83]:
            - code [ref=e85]:
              - generic [ref=e86]: "fn total(values: []const u8) usize {"
              - generic [ref=e87]: "var sum: usize = 0;"
              - generic [ref=e88]: for (values) |v| sum += v;
              - generic [ref=e89]: return sum;
              - generic [ref=e90]: "}"
              - generic [ref=e91]: "test \"slices\" {"
              - generic [ref=e92]: "const array = [_]u8{ 1, 2, 3, 4, 5 };"
              - generic [ref=e93]: const slice = array[0..3];
              - generic [ref=e94]: try expect(total(slice) == 6);
              - generic [ref=e95]: "}"
            - button "Copy code to clipboard" [ref=e97] [cursor=pointer]:
              - generic [ref=e98]:
                - img [ref=e99]
                - img [ref=e101]
          - paragraph [ref=e103]:
            - text: When these
            - code [ref=e104]: "n"
            - text: and
            - code [ref=e105]: m
            - text: values are both known at compile time, slicing will actually produce a pointer to an array. This is not an issue as a pointer to an array i.e.
            - code [ref=e106]: "*[N]T"
            - text: will coerce to a slice -
            - code [ref=e107]: "[]T"
            - text: .
          - generic [ref=e109]:
            - code [ref=e111]:
              - generic [ref=e112]: "test \"slices 2\" {"
              - generic [ref=e113]: "const array = [_]u8{ 1, 2, 3, 4, 5 };"
              - generic [ref=e114]: const slice = array[0..3];
              - generic [ref=e115]: try expect(@TypeOf(slice) == *const [3]u8);
              - generic [ref=e116]: "}"
            - button "Copy code to clipboard" [ref=e118] [cursor=pointer]:
              - generic [ref=e119]:
                - img [ref=e120]
                - img [ref=e122]
          - paragraph [ref=e124]:
            - text: The syntax
            - code [ref=e125]: x[n..]
            - text: can also be used when you want to slice to the end.
          - generic [ref=e127]:
            - code [ref=e129]:
              - generic [ref=e130]: "test \"slices 3\" {"
