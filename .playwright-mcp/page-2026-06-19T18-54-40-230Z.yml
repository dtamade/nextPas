      - heading "Detecting Test Build" [level=3] [ref=e1493]:
        - link "Detecting Test Build" [ref=e1494] [cursor=pointer]:
          - /url: "#toc-Detecting-Test-Build"
      - paragraph [ref=e1495]:
        - text: Use the
        - link "compile variable" [ref=e1496] [cursor=pointer]:
          - /url: "#Compile-Variables"
        - code [ref=e1497]: "@import(\"builtin\").is_test"
        - text: "to detect a test build:"
      - figure "testing_detect_test.zig" [ref=e1498]:
        - generic [ref=e1499]: testing_detect_test.zig
        - code [ref=e1501]: "const std = @import(\"std\"); const builtin = @import(\"builtin\"); const expect = std.testing.expect; test \"builtin.is_test\" { try expect(isATest()); } fn isATest() bool { return builtin.is_test; }"
