      - heading "Test Output and Logging" [level=3] [ref=e1506]:
        - link "Test Output and Logging" [ref=e1507] [cursor=pointer]:
          - /url: "#toc-Test-Output-and-Logging"
      - paragraph [ref=e1508]: The default test runner and the Zig Standard Library's testing namespace output messages to standard error.
      - heading "The Testing Namespace" [level=3] [ref=e1509]:
        - link "The Testing Namespace" [ref=e1510] [cursor=pointer]:
          - /url: "#toc-The-Testing-Namespace"
      - paragraph [ref=e1511]:
        - text: The Zig Standard Library's
        - code [ref=e1512]: testing
        - text: namespace contains useful functions to help you create tests. In addition to the
        - code [ref=e1513]: expect
        - text: "function, this document uses a couple of more functions as exemplified here:"
      - figure "testing_namespace.zig" [ref=e1514]:
        - generic [ref=e1515]: testing_namespace.zig
        - code [ref=e1517]: "const std = @import(\"std\"); test \"expectEqual demo\" { const expected: i32 = 42; const actual = 42; // The first argument to `expectEqual` is the known, expected, result. // The second argument is the result of some expression. // The actual's type is casted to the type of expected. try std.testing.expectEqual(expected, actual); } test \"expectError demo\" { const expected_error = error.DemoError; const actual_error_union: anyerror!void = error.DemoError; // `expectError` will fail when the actual error is different than // the expected error. try std.testing.expectError(expected_error, actual_error_union); }"
