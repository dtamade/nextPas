      - figure "compiler_generated_function.zig" [ref=e5094]:
        - generic [ref=e5095]: compiler_generated_function.zig
        - code [ref=e5097]: "fn max(a: bool, b: bool) bool { { return a or b; } }"
      - paragraph [ref=e5098]: All the code that dealt with compile-time known values is eliminated and we are left with only the necessary run-time code to accomplish the task.
      - paragraph [ref=e5099]:
        - text: This works the same way for
        - code [ref=e5100]: switch
        - text: expressions - they are implicitly inlined when the target expression is compile-time known.
      - heading "Compile-Time Variables" [level=4] [ref=e5101]:
        - link "Compile-Time Variables" [ref=e5102] [cursor=pointer]:
          - /url: "#toc-Compile-Time-Variables"
      - paragraph [ref=e5103]:
        - text: In Zig, the programmer can label variables as
        - code [ref=e5104]: comptime
        - text: . This guarantees to the compiler that every load and store of the variable is performed at compile-time. Any violation of this results in a compile error.
      - paragraph [ref=e5105]:
        - text: This combined with the fact that we can
        - code [ref=e5106]: inline
        - text: loops allows us to write a function which is partially evaluated at compile-time and partially at run-time.
      - paragraph [ref=e5107]: "For example:"
      - figure "test_comptime_evaluation.zig" [ref=e5108]:
        - generic [ref=e5109]: test_comptime_evaluation.zig
        - code [ref=e5111]: "const expectEqual = @import(\"std\").testing.expectEqual; const CmdFn = struct { name: []const u8, func: fn (i32) i32, }; const cmd_fns = [_]CmdFn{ CmdFn{ .name = \"one\", .func = one }, CmdFn{ .name = \"two\", .func = two }, CmdFn{ .name = \"three\", .func = three }, }; fn one(value: i32) i32 { return value + 1; } fn two(value: i32) i32 { return value + 2; } fn three(value: i32) i32 { return value + 3; } fn performFn(comptime prefix_char: u8, start_value: i32) i32 { var result: i32 = start_value; comptime var i = 0; inline while (i < cmd_fns.len) : (i += 1) { if (cmd_fns[i].name[0] == prefix_char) { result = cmd_fns[i].func(result); } } return result; } test \"perform fn\" { try expectEqual(6, performFn('t', 1)); try expectEqual(1, performFn('o', 0)); try expectEqual(99, performFn('w', 99)); }"
      - figure "Shell" [ref=e5112]:
        - generic [ref=e5113]: Shell
        - generic [ref=e5115]: $ zig test test_comptime_evaluation.zig 1/1 test_comptime_evaluation.test.perform fn...OK All 1 tests passed.
      - paragraph [ref=e5116]:
        - text: This example is a bit contrived, because the compile-time evaluation component is unnecessary; this code would work fine if it was all done at run-time. But it does end up generating different code. In this example, the function
        - code [ref=e5117]: performFn
        - text: is generated three different times, for the different values of
        - code [ref=e5118]: prefix_char
        - text: "provided:"
      - figure "performFn_1" [ref=e5119]:
        - generic [ref=e5120]: performFn_1
        - code [ref=e5122]: "// From the line: // expect(performFn('t', 1) == 6); fn performFn(start_value: i32) i32 { var result: i32 = start_value; result = two(result); result = three(result); return result; }"
      - figure "performFn_2" [ref=e5123]:
        - generic [ref=e5124]: performFn_2
        - code [ref=e5126]: "// From the line: // expect(performFn('o', 0) == 1); fn performFn(start_value: i32) i32 { var result: i32 = start_value; result = one(result); return result; }"
      - figure "performFn_3" [ref=e5127]:
        - generic [ref=e5128]: performFn_3
        - code [ref=e5130]: "// From the line: // expect(performFn('w', 99) == 99); fn performFn(start_value: i32) i32 { var result: i32 = start_value; _ = &result; return result; }"
      - paragraph [ref=e5131]:
        - text: Note that this happens even in a debug build. This is not a way to write more optimized code, but it is a way to make sure that what
        - emphasis [ref=e5132]: should
        - text: happen at compile-time,
        - emphasis [ref=e5133]: does
        - text: happen at compile-time. This catches more errors and allows expressiveness that in other languages requires using macros, generated code, or a preprocessor to accomplish.
      - heading "Compile-Time Expressions" [level=4] [ref=e5134]:
        - link "Compile-Time Expressions" [ref=e5135] [cursor=pointer]:
          - /url: "#toc-Compile-Time-Expressions"
      - paragraph [ref=e5136]:
        - text: In Zig, it matters whether a given expression is known at compile-time or run-time. A programmer can use a
        - code [ref=e5137]: comptime
        - text: "expression to guarantee that the expression will be evaluated at compile-time. If this cannot be accomplished, the compiler will emit an error. For example:"
      - figure "test_comptime_call_extern_function.zig" [ref=e5138]:
        - generic [ref=e5139]: test_comptime_call_extern_function.zig
        - code [ref=e5141]: "extern fn exit() noreturn; test \"foo\" { comptime { exit(); } }"
      - figure "Shell" [ref=e5142]:
        - generic [ref=e5143]: Shell
        - generic [ref=e5145]: "$ zig test test_comptime_call_extern_function.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_comptime_call_extern_function.zig:5:13: error: comptime call of extern function exit(); ~~~~^~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_comptime_call_extern_function.zig:4:5: note: 'comptime' keyword forces comptime evaluation comptime { ^~~~~~~~"
      - paragraph [ref=e5146]:
        - text: It doesn't make sense that a program could call
        - code [ref=e5147]: exit()
        - text: (or any other external function) at compile-time, so this is a compile error. However, a
        - code [ref=e5148]: comptime
        - text: expression does much more than sometimes cause a compile error.
      - paragraph [ref=e5149]:
        - text: Within a
        - code [ref=e5150]: comptime
        - text: "expression:"
      - list [ref=e5151]:
        - listitem [ref=e5152]:
          - text: All variables are
          - code [ref=e5153]: comptime
          - text: variables.
        - listitem [ref=e5154]:
          - text: All
          - code [ref=e5155]: if
          - text: ","
          - code [ref=e5156]: while
          - text: ","
          - code [ref=e5157]: for
          - text: ", and"
          - code [ref=e5158]: switch
          - text: expressions are evaluated at compile-time, or emit a compile error if this is not possible.
        - listitem [ref=e5159]:
          - text: All
          - code [ref=e5160]: return
          - text: and
          - code [ref=e5161]: try
          - text: expressions are invalid (unless the function itself is called at compile-time).
        - listitem [ref=e5162]: All code with runtime side effects or depending on runtime values emits a compile error.
        - listitem [ref=e5163]: All function calls cause the compiler to interpret the function at compile-time, emitting a compile error if the function tries to do something that has global runtime side effects.
      - paragraph [ref=e5164]: This means that a programmer can create a function which is called both at compile-time and run-time, with no modification to the function required.
      - paragraph [ref=e5165]: "Let's look at an example:"
      - figure "test_fibonacci_recursion.zig" [ref=e5166]:
        - generic [ref=e5167]: test_fibonacci_recursion.zig
        - code [ref=e5169]: "const expectEqual = @import(\"std\").testing.expectEqual; fn fibonacci(index: u32) u32 { if (index < 2) return index; return fibonacci(index - 1) + fibonacci(index - 2); } test \"fibonacci\" { // test fibonacci at run-time try expectEqual(13, fibonacci(7)); // test fibonacci at compile-time try comptime expectEqual(13, fibonacci(7)); }"
      - figure "Shell" [ref=e5170]:
        - generic [ref=e5171]: Shell
        - generic [ref=e5173]: $ zig test test_fibonacci_recursion.zig 1/1 test_fibonacci_recursion.test.fibonacci...OK All 1 tests passed.
      - paragraph [ref=e5174]: "Imagine if we had forgotten the base case of the recursive function and tried to run the tests:"
      - figure "test_fibonacci_comptime_overflow.zig" [ref=e5175]:
        - generic [ref=e5176]: test_fibonacci_comptime_overflow.zig
        - code [ref=e5178]: "const expectEqual = @import(\"std\").testing.expectEqual; fn fibonacci(index: u32) u32 { //if (index < 2) return index; return fibonacci(index - 1) + fibonacci(index - 2); } test \"fibonacci\" { try comptime expectEqual(13, fibonacci(7)); }"
      - figure "Shell" [ref=e5179]:
        - generic [ref=e5180]: Shell
        - generic [ref=e5182]: "$ zig test test_fibonacci_comptime_overflow.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_fibonacci_comptime_overflow.zig:5:28: error: overflow of integer type 'u32' with value '-1' return fibonacci(index - 1) + fibonacci(index - 2); ~~~~~~^~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_fibonacci_comptime_overflow.zig:5:21: note: called at comptime here (7 times) return fibonacci(index - 1) + fibonacci(index - 2); ~~~~~~~~~^~~~~~~~~~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_fibonacci_comptime_overflow.zig:9:43: note: called at comptime here try comptime expectEqual(13, fibonacci(7)); ~~~~~~~~~^~~"
      - paragraph [ref=e5183]: The compiler produces an error which is a stack trace from trying to evaluate the function at compile-time.
      - paragraph [ref=e5184]:
        - text: Luckily, we used an unsigned integer, and so when we tried to subtract 1 from 0, it triggered
        - link "Illegal Behavior" [ref=e5185] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: ", which is always a compile error if the compiler knows it happened. But what would have happened if we used a signed integer?"
      - figure "fibonacci_comptime_infinite_recursion.zig" [ref=e5186]:
        - generic [ref=e5187]: fibonacci_comptime_infinite_recursion.zig
        - code [ref=e5189]: "const assert = @import(\"std\").debug.assert; fn fibonacci(index: i32) i32 { //if (index < 2) return index; return fibonacci(index - 1) + fibonacci(index - 2); } test \"fibonacci\" { try comptime assert(fibonacci(7) == 13); }"
      - paragraph [ref=e5190]:
        - text: The compiler is supposed to notice that evaluating this function at compile-time took more than 1000 branches, and thus emits an error and gives up. If the programmer wants to increase the budget for compile-time computation, they can use a built-in function called
        - link "@setEvalBranchQuota" [ref=e5191] [cursor=pointer]:
          - /url: "#setEvalBranchQuota"
        - text: to change the default number 1000 to something else.
      - paragraph [ref=e5192]:
        - text: However, there is a
        - link "design flaw in the compiler" [ref=e5193] [cursor=pointer]:
          - /url: https://github.com/ziglang/zig/issues/13724
        - text: causing it to stack overflow instead of having the proper behavior here. I'm terribly sorry about that. I hope to get this resolved before the next release.
      - paragraph [ref=e5194]:
        - text: What if we fix the base case, but put the wrong value in the
        - code [ref=e5195]: expect
        - text: line?
      - figure "test_fibonacci_comptime_unreachable.zig" [ref=e5196]:
        - generic [ref=e5197]: test_fibonacci_comptime_unreachable.zig
        - code [ref=e5199]: "const assert = @import(\"std\").debug.assert; fn fibonacci(index: i32) i32 { if (index < 2) return index; return fibonacci(index - 1) + fibonacci(index - 2); } test \"fibonacci\" { try comptime assert(fibonacci(7) == 99999); }"
      - figure "Shell" [ref=e5200]:
        - generic [ref=e5201]: Shell
        - generic [ref=e5203]: "$ zig test test_fibonacci_comptime_unreachable.zig /home/ci/work/zig-bootstrap/out/host/lib/zig/std/debug.zig:429:14: error: reached unreachable code if (!ok) unreachable; // assertion failure ^~~~~~~~~~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_fibonacci_comptime_unreachable.zig:9:24: note: called at comptime here try comptime assert(fibonacci(7) == 99999); ~~~~~~^~~~~~~~~~~~~~~~~~~~~~~"
      - paragraph [ref=e5204]:
        - text: At
        - link "Namespace" [ref=e5205] [cursor=pointer]:
          - /url: "#Namespace"
        - text: level (outside of any function), all expressions are implicitly
        - code [ref=e5206]: comptime
        - text: "expressions. This means that we can use functions to initialize complex constant data. For example:"
      - figure "test_namespace-level_comptime_expressions.zig" [ref=e5207]:
        - generic [ref=e5208]: test_namespace-level_comptime_expressions.zig
        - code [ref=e5210]: "const first_25_primes = firstNPrimes(25); const sum_of_first_25_primes = sum(&first_25_primes); fn firstNPrimes(comptime n: usize) [n]i32 { var prime_list: [n]i32 = undefined; var next_index: usize = 0; var test_number: i32 = 2; while (next_index < prime_list.len) : (test_number += 1) { var test_prime_index: usize = 0; var is_prime = true; while (test_prime_index < next_index) : (test_prime_index += 1) { if (test_number % prime_list[test_prime_index] == 0) { is_prime = false; break; } } if (is_prime) { prime_list[next_index] = test_number; next_index += 1; } } return prime_list; } fn sum(numbers: []const i32) i32 { var result: i32 = 0; for (numbers) |x| { result += x; } return result; } test \"variable values\" { try @import(\"std\").testing.expectEqual(1060, sum_of_first_25_primes); }"
      - figure "Shell" [ref=e5211]:
        - generic [ref=e5212]: Shell
        - generic [ref=e5214]: $ zig test test_namespace-level_comptime_expressions.zig 1/1 test_namespace-level_comptime_expressions.test.variable values...OK All 1 tests passed.
      - paragraph [ref=e5215]: "When we compile this program, Zig generates the constants with the answer pre-computed. Here are the lines from the generated LLVM IR:"
      - code [ref=e5217]: "@0 = internal unnamed_addr constant [25 x i32] [i32 2, i32 3, i32 5, i32 7, i32 11, i32 13, i32 17, i32 19, i32 23, i32 29, i32 31, i32 37, i32 41, i32 43, i32 47, i32 53, i32 59, i32 61, i32 67, i32 71, i32 73, i32 79, i32 83, i32 89, i32 97] @1 = internal unnamed_addr constant i32 1060"
      - paragraph [ref=e5218]:
        - text: Note that we did not have to do anything special with the syntax of these functions. For example, we could call the
        - code [ref=e5219]: sum
        - text: function as is with a slice of numbers whose length and values were only known at run-time.
      - heading "Generic Data Structures" [level=3] [ref=e5220]:
        - link "Generic Data Structures" [ref=e5221] [cursor=pointer]:
          - /url: "#toc-Generic-Data-Structures"
      - paragraph [ref=e5222]: Zig uses comptime capabilities to implement generic data structures without introducing any special-case syntax.
      - paragraph [ref=e5223]:
        - text: Here is an example of a generic
        - code [ref=e5224]: List
        - text: data structure.
      - figure "generic_data_structure.zig" [ref=e5225]:
        - generic [ref=e5226]: generic_data_structure.zig
        - code [ref=e5228]: "fn List(comptime T: type) type { return struct { items: []T, len: usize, }; } // The generic List data structure can be instantiated by passing in a type: var buffer: [10]i32 = undefined; var list = List(i32){ .items = &buffer, .len = 0, };"
      - paragraph [ref=e5229]:
        - text: That's it. It's a function that returns an anonymous
        - code [ref=e5230]: struct
        - text: . For the purposes of error messages and debugging, Zig infers the name
        - code [ref=e5231]: "\"List(i32)\""
        - text: from the function name and parameters invoked when creating the anonymous struct.
      - paragraph [ref=e5232]: To explicitly give a type a name, we assign it to a constant.
      - figure "anonymous_struct_name.zig" [ref=e5233]:
        - generic [ref=e5234]: anonymous_struct_name.zig
        - code [ref=e5236]: "const Node = struct { next: ?*Node, name: []const u8, }; var node_a = Node{ .next = null, .name = \"Node A\", }; var node_b = Node{ .next = &node_a, .name = \"Node B\", };"
      - paragraph [ref=e5237]:
        - text: In this example, the
        - code [ref=e5238]: Node
        - text: struct refers to itself. This works because all top level declarations are order-independent. As long as the compiler can determine the size of the struct, it is free to refer to itself. In this case,
        - code [ref=e5239]: Node
        - text: refers to itself as a pointer, which has a well-defined size at compile time, so it works fine.
      - 'heading "Case Study: print in Zig" [level=3] [ref=e5240]':
        - 'link "Case Study: print in Zig" [ref=e5241] [cursor=pointer]':
          - /url: "#toc-Case-Study-print-in-Zig"
      - paragraph [ref=e5242]:
        - text: Putting all of this together, let's see how
        - code [ref=e5243]: print
        - text: works in Zig.
      - figure "print.zig" [ref=e5244]:
        - generic [ref=e5245]: print.zig
        - code [ref=e5247]: "const print = @import(\"std\").debug.print; const a_number: i32 = 1234; const a_string = \"foobar\"; pub fn main() void { print(\"here is a string: '{s}' here is a number: {}\\n\", .{ a_string, a_number }); }"
      - figure "Shell" [ref=e5248]:
        - generic [ref=e5249]: Shell
        - generic [ref=e5251]: "$ zig build-exe print.zig $ ./print here is a string: 'foobar' here is a number: 1234"
      - paragraph [ref=e5252]: "Let's crack open the implementation of this and see how it works:"
      - figure "poc_print_fn.zig" [ref=e5253]:
        - generic [ref=e5254]: poc_print_fn.zig
        - code [ref=e5256]: "const Writer = struct { /// Calls print and then flushes the buffer. pub fn print(self: *Writer, comptime format: []const u8, args: anytype) anyerror!void { const State = enum { start, open_brace, close_brace, }; comptime var start_index: usize = 0; comptime var state = State.start; comptime var next_arg: usize = 0; inline for (format, 0..) |c, i| { switch (state) { State.start => switch (c) { '{' => { if (start_index < i) try self.write(format[start_index..i]); state = State.open_brace; }, '}' => { if (start_index < i) try self.write(format[start_index..i]); state = State.close_brace; }, else => {}, }, State.open_brace => switch (c) { '{' => { state = State.start; start_index = i; }, '}' => { try self.printValue(args[next_arg]); next_arg += 1; state = State.start; start_index = i + 1; }, 's' => { continue; }, else => @compileError(\"Unknown format character: \" ++ [1]u8{c}), }, State.close_brace => switch (c) { '}' => { state = State.start; start_index = i; }, else => @compileError(\"Single '}' encountered in format string\"), }, } } comptime { if (args.len != next_arg) { @compileError(\"Unused arguments\"); } if (state != State.start) { @compileError(\"Incomplete format string: \" ++ format); } } if (start_index < format.len) { try self.write(format[start_index..format.len]); } try self.flush(); } fn write(self: *Writer, value: []const u8) !void { _ = self; _ = value; } pub fn printValue(self: *Writer, value: anytype) !void { _ = self; _ = value; } fn flush(self: *Writer) !void { _ = self; } };"
      - paragraph [ref=e5257]: This is a proof of concept implementation; the actual function in the standard library has more formatting capabilities.
      - paragraph [ref=e5258]: Note that this is not hard-coded into the Zig compiler; this is userland code in the standard library.
      - paragraph [ref=e5259]: "When this function is analyzed from our example code above, Zig partially evaluates the function and emits a function that actually looks like this:"
      - figure "Emitted print Function" [ref=e5260]:
        - generic [ref=e5261]: Emitted print Function
        - code [ref=e5263]: "pub fn print(self: *Writer, arg0: []const u8, arg1: i32) !void { try self.write(\"here is a string: '\"); try self.printValue(arg0); try self.write(\"' here is a number: \"); try self.printValue(arg1); try self.write(\"\\n\"); try self.flush(); }"
      - paragraph [ref=e5264]:
        - code [ref=e5265]: printValue
        - text: "is a function that takes a parameter of any type, and does different things depending on the type:"
      - figure "poc_printValue_fn.zig" [ref=e5266]:
        - generic [ref=e5267]: poc_printValue_fn.zig
        - code [ref=e5269]: "const Writer = struct { pub fn printValue(self: *Writer, value: anytype) !void { switch (@typeInfo(@TypeOf(value))) { .int => { return self.writeInt(value); }, .float => { return self.writeFloat(value); }, .pointer => { return self.write(value); }, else => { @compileError(\"Unable to print type '\" ++ @typeName(@TypeOf(value)) ++ \"'\"); }, } } fn write(self: *Writer, value: []const u8) !void { _ = self; _ = value; } fn writeInt(self: *Writer, value: anytype) !void { _ = self; _ = value; } fn writeFloat(self: *Writer, value: anytype) !void { _ = self; _ = value; } };"
      - paragraph [ref=e5270]:
        - text: And now, what happens if we give too many arguments to
        - code [ref=e5271]: print
        - text: "?"
      - figure "test_print_too_many_args.zig" [ref=e5272]:
        - generic [ref=e5273]: test_print_too_many_args.zig
        - code [ref=e5275]: "const print = @import(\"std\").debug.print; const a_number: i32 = 1234; const a_string = \"foobar\"; test \"print too many arguments\" { print(\"here is a string: '{s}' here is a number: {}\\n\", .{ a_string, a_number, a_number, }); }"
      - figure "Shell" [ref=e5276]:
        - generic [ref=e5277]: Shell
        - generic [ref=e5279]: "$ zig test test_print_too_many_args.zig /home/ci/work/zig-bootstrap/out/host/lib/zig/std/Io/Writer.zig:741:18: error: unused argument in 'here is a string: '{s}' here is a number: {} ' 1 => @compileError(\"unused argument in '\" ++ fmt ++ \"'\"), ^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ referenced by: print__anon_40595: /home/ci/work/zig-bootstrap/out/host/lib/zig/std/debug.zig:317:39 test.print too many arguments: /home/ci/work/zig-bootstrap/zig/doc/langref/test_print_too_many_args.zig:7:10"
      - paragraph [ref=e5280]: Zig gives programmers the tools needed to protect themselves against their own mistakes.
      - paragraph [ref=e5281]:
        - text: Zig doesn't care whether the format argument is a string literal, only that it is a compile-time known value that can be coerced to a
        - code [ref=e5282]: "[]const u8"
        - text: ":"
      - figure "print_comptime-known_format.zig" [ref=e5283]:
        - generic [ref=e5284]: print_comptime-known_format.zig
        - code [ref=e5286]: "const print = @import(\"std\").debug.print; const a_number: i32 = 1234; const a_string = \"foobar\"; const fmt = \"here is a string: '{s}' here is a number: {}\\n\"; pub fn main() void { print(fmt, .{ a_string, a_number }); }"
      - figure "Shell" [ref=e5287]:
        - generic [ref=e5288]: Shell
        - generic [ref=e5290]: "$ zig build-exe print_comptime-known_format.zig $ ./print_comptime-known_format here is a string: 'foobar' here is a number: 1234"
      - paragraph [ref=e5291]: This works fine.
      - paragraph [ref=e5292]: Zig does not special case string formatting in the compiler and instead exposes enough power to accomplish this task in userland. It does so without introducing another language on top of Zig, such as a macro language or a preprocessor language. It's Zig all the way down.
      - paragraph [ref=e5293]: "See also:"
      - list [ref=e5294]:
        - listitem [ref=e5295]:
          - link "inline while" [ref=e5296] [cursor=pointer]:
            - /url: "#inline-while"
        - listitem [ref=e5297]:
          - link "inline for" [ref=e5298] [cursor=pointer]:
            - /url: "#inline-for"
      - heading "Assembly" [level=2] [ref=e5299]:
        - link "Assembly" [ref=e5300] [cursor=pointer]:
          - /url: "#toc-Assembly"
      - paragraph [ref=e5301]: "For some use cases, it may be necessary to directly control the machine code generated by Zig programs, rather than relying on Zig's code generation. For these cases, one can use inline assembly. Here is an example of implementing Hello, World on x86_64 Linux using inline assembly:"
