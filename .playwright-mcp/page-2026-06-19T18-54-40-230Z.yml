      - heading "Skip Tests" [level=3] [ref=e1459]:
        - link "Skip Tests" [ref=e1460] [cursor=pointer]:
          - /url: "#toc-Skip-Tests"
      - paragraph [ref=e1461]: One way to skip tests is to filter them out by using the zig test command line parameter --test-filter [text]. This makes the test build only include tests whose name contains the supplied filter text. Note that non-named tests are run even when using the --test-filter [text] command line parameter.
      - paragraph [ref=e1462]:
        - text: To programmatically skip a test, make a
        - code [ref=e1463]: test
        - text: return the error
        - code [ref=e1464]: error.SkipZigTest
        - text: and the default test runner will consider the test as being skipped. The total number of skipped tests will be reported after all tests have run.
      - figure "testing_skip.zig" [ref=e1465]:
