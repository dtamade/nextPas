      - paragraph [ref=e3940]:
        - text: There is a difference between a function
        - emphasis [ref=e3941]: body
        - text: and a function
        - emphasis [ref=e3942]: pointer
        - text: . Function bodies are
        - link "comptime" [ref=e3943] [cursor=pointer]:
          - /url: "#comptime"
        - text: "-only types while function"
        - link "Pointers" [ref=e3944] [cursor=pointer]:
          - /url: "#Pointers"
        - text: may be runtime-known.
      - heading "Pass-by-value Parameters" [level=3] [ref=e3945]:
        - link "Pass-by-value Parameters" [ref=e3946] [cursor=pointer]:
          - /url: "#toc-Pass-by-value-Parameters"
      - paragraph [ref=e3947]:
        - text: Primitive types such as
        - link "Integers" [ref=e3948] [cursor=pointer]:
          - /url: "#Integers"
        - text: and
        - link "Floats" [ref=e3949] [cursor=pointer]:
          - /url: "#Floats"
        - text: passed as parameters are copied, and then the copy is available in the function body. This is called "passing by value". Copying a primitive type is essentially free and typically involves nothing more than setting a register.
      - paragraph [ref=e3950]: Structs, unions, and arrays can sometimes be more efficiently passed as a reference, since a copy could be arbitrarily expensive depending on the size. When these types are passed as parameters, Zig may choose to copy and pass by value, or pass by reference, whichever way Zig decides will be faster. This is made possible, in part, by the fact that parameters are immutable.
      - figure "test_pass_by_reference_or_value.zig" [ref=e3951]:
        - generic [ref=e3952]: test_pass_by_reference_or_value.zig
        - code [ref=e3954]: "const Point = struct { x: i32, y: i32, }; fn foo(point: Point) i32 { // Here, `point` could be a reference, or a copy. The function body // can ignore the difference and treat it as a value. Be very careful // taking the address of the parameter - it should be treated as if // the address will become invalid when the function returns. return point.x + point.y; } const expectEqual = @import(\"std\").testing.expectEqual; test \"pass struct to function\" { try expectEqual(3, foo(Point{ .x = 1, .y = 2 })); }"
      - figure "Shell" [ref=e3955]:
        - generic [ref=e3956]: Shell
        - generic [ref=e3958]: $ zig test test_pass_by_reference_or_value.zig 1/1 test_pass_by_reference_or_value.test.pass struct to function...OK All 1 tests passed.
      - paragraph [ref=e3959]: For extern functions, Zig follows the C ABI for passing structs and unions by value.
      - heading "Function Parameter Type Inference" [level=3] [ref=e3960]:
        - link "Function Parameter Type Inference" [ref=e3961] [cursor=pointer]:
          - /url: "#toc-Function-Parameter-Type-Inference"
      - paragraph [ref=e3962]:
        - text: Function parameters can be declared with
        - code [ref=e3963]: anytype
        - text: in place of the type. In this case the parameter types will be inferred when the function is called. Use
        - link "@TypeOf" [ref=e3964] [cursor=pointer]:
          - /url: "#TypeOf"
        - text: and
        - link "@typeInfo" [ref=e3965] [cursor=pointer]:
          - /url: "#typeInfo"
        - text: to get information about the inferred type.
      - figure "test_fn_type_inference.zig" [ref=e3966]:
        - generic [ref=e3967]: test_fn_type_inference.zig
        - code [ref=e3969]: "const expectEqual = @import(\"std\").testing.expectEqual; fn addFortyTwo(x: anytype) @TypeOf(x) { return x + 42; } test \"fn type inference\" { try expectEqual(43, addFortyTwo(1)); try expectEqual(comptime_int, @TypeOf(addFortyTwo(1))); const y: i64 = 2; try expectEqual(44, addFortyTwo(y)); try expectEqual(i64, @TypeOf(addFortyTwo(y))); }"
      - figure "Shell" [ref=e3970]:
        - generic [ref=e3971]: Shell
        - generic [ref=e3973]: $ zig test test_fn_type_inference.zig 1/1 test_fn_type_inference.test.fn type inference...OK All 1 tests passed.
      - heading "inline fn" [level=3] [ref=e3974]:
        - link "inline fn" [ref=e3975] [cursor=pointer]:
          - /url: "#toc-inline-fn"
      - paragraph [ref=e3976]:
        - text: Adding the
        - code [ref=e3977]: inline
        - text: keyword to a function definition makes that function become
        - emphasis [ref=e3978]: semantically inlined
        - text: at the callsite. This is not a hint to be possibly observed by optimization passes, but has implications on the types and values involved in the function call.
      - paragraph [ref=e3979]:
        - text: Unlike normal function calls, arguments at an inline function callsite which are compile-time known are treated as
        - link "Compile Time Parameters" [ref=e3980] [cursor=pointer]:
          - /url: "#Compile-Time-Parameters"
        - text: ". This can potentially propagate all the way to the return value:"
      - figure "inline_call.zig" [ref=e3981]:
        - generic [ref=e3982]: inline_call.zig
        - code [ref=e3984]: "const std = @import(\"std\"); pub fn main() void { if (foo(1200, 34) != 1234) { @compileError(\"bad\"); } } inline fn foo(a: i32, b: i32) i32 { std.debug.print(\"runtime a = {} b = {}\", .{ a, b }); return a + b; }"
      - figure "Shell" [ref=e3985]:
        - generic [ref=e3986]: Shell
        - generic [ref=e3988]: $ zig build-exe inline_call.zig $ ./inline_call runtime a = 1200 b = 34
      - paragraph [ref=e3989]:
        - text: If
        - code [ref=e3990]: inline
        - text: is removed, the test fails with the compile error instead of passing.
      - paragraph [ref=e3991]: "It is generally better to let the compiler decide when to inline a function, except for these scenarios:"
      - list [ref=e3992]:
        - listitem [ref=e3993]: To change how many stack frames are in the call stack, for debugging purposes.
        - listitem [ref=e3994]: To force comptime-ness of the arguments to propagate to the return value of the function, as in the above example.
        - listitem [ref=e3995]: Real world performance measurements demand it.
      - paragraph [ref=e3996]:
        - text: Note that
        - code [ref=e3997]: inline
        - text: actually
        - emphasis [ref=e3998]: restricts
        - text: what the compiler is allowed to do. This can harm binary size, compilation speed, and even runtime performance.
      - heading "Function Reflection" [level=3] [ref=e3999]:
        - link "Function Reflection" [ref=e4000] [cursor=pointer]:
          - /url: "#toc-Function-Reflection"
      - figure "test_fn_reflection.zig" [ref=e4001]:
        - generic [ref=e4002]: test_fn_reflection.zig
        - code [ref=e4004]: "const std = @import(\"std\"); const math = std.math; const testing = std.testing; test \"fn reflection\" { try testing.expectEqual(bool, @typeInfo(@TypeOf(testing.expect)).@\"fn\".param_types[0].?); try testing.expectEqual(testing.TmpDir, @typeInfo(@TypeOf(testing.tmpDir)).@\"fn\".return_type.?); try testing.expect(@typeInfo(@TypeOf(math.Log2Int)).@\"fn\".is_generic); }"
      - figure "Shell" [ref=e4005]:
        - generic [ref=e4006]: Shell
        - generic [ref=e4008]: $ zig test test_fn_reflection.zig 1/1 test_fn_reflection.test.fn reflection...OK All 1 tests passed.
      - heading "Errors" [level=2] [ref=e4009]:
        - link "Errors" [ref=e4010] [cursor=pointer]:
          - /url: "#toc-Errors"
      - heading "Error Set Type" [level=3] [ref=e4011]:
        - link "Error Set Type" [ref=e4012] [cursor=pointer]:
          - /url: "#toc-Error-Set-Type"
      - paragraph [ref=e4013]:
        - text: An error set is like an
        - link "enum" [ref=e4014] [cursor=pointer]:
          - /url: "#enum"
        - text: . However, each error name across the entire compilation gets assigned an unsigned integer greater than 0. You are allowed to declare the same error name more than once, and if you do, it gets assigned the same integer value.
      - paragraph [ref=e4015]:
        - text: The error set type defaults to a
        - code [ref=e4016]: u16
        - text: ", though if the maximum number of distinct error values is provided via the --error-limit [num] command line parameter an integer type with the minimum number of bits required to represent all of the error values will be used."
      - paragraph [ref=e4017]:
        - text: You can
        - link "coerce" [ref=e4018] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: "an error from a subset to a superset:"
      - figure "test_coerce_error_subset_to_superset.zig" [ref=e4019]:
        - generic [ref=e4020]: test_coerce_error_subset_to_superset.zig
        - code [ref=e4022]: "const std = @import(\"std\"); const FileOpenError = error{ AccessDenied, OutOfMemory, FileNotFound, }; const AllocationError = error{ OutOfMemory, }; test \"coerce subset to superset\" { const err = foo(AllocationError.OutOfMemory); try std.testing.expectEqual(FileOpenError.OutOfMemory, err); } fn foo(err: AllocationError) FileOpenError { return err; }"
      - figure "Shell" [ref=e4023]:
        - generic [ref=e4024]: Shell
        - generic [ref=e4026]: $ zig test test_coerce_error_subset_to_superset.zig 1/1 test_coerce_error_subset_to_superset.test.coerce subset to superset...OK All 1 tests passed.
      - paragraph [ref=e4027]:
        - text: But you cannot
        - link "coerce" [ref=e4028] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: "an error from a superset to a subset:"
      - figure "test_coerce_error_superset_to_subset.zig" [ref=e4029]:
        - generic [ref=e4030]: test_coerce_error_superset_to_subset.zig
        - code [ref=e4032]: "const FileOpenError = error{ AccessDenied, OutOfMemory, FileNotFound, }; const AllocationError = error{ OutOfMemory, }; test \"coerce superset to subset\" { foo(FileOpenError.OutOfMemory) catch {}; } fn foo(err: FileOpenError) AllocationError { return err; }"
      - figure "Shell" [ref=e4033]:
        - generic [ref=e4034]: Shell
        - generic [ref=e4036]: "$ zig test test_coerce_error_superset_to_subset.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_coerce_error_superset_to_subset.zig:16:12: error: expected type 'error{OutOfMemory}', found 'error{AccessDenied,FileNotFound,OutOfMemory}' return err; ^~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_coerce_error_superset_to_subset.zig:16:12: note: 'error.AccessDenied' not a member of destination error set /home/ci/work/zig-bootstrap/zig/doc/langref/test_coerce_error_superset_to_subset.zig:16:12: note: 'error.FileNotFound' not a member of destination error set /home/ci/work/zig-bootstrap/zig/doc/langref/test_coerce_error_superset_to_subset.zig:15:28: note: function return type declared here fn foo(err: FileOpenError) AllocationError { ^~~~~~~~~~~~~~~ referenced by: test.coerce superset to subset: /home/ci/work/zig-bootstrap/zig/doc/langref/test_coerce_error_superset_to_subset.zig:12:8"
      - paragraph [ref=e4037]: "There is a shortcut for declaring an error set with only 1 value, and then getting that value:"
      - figure "single_value_error_set_shortcut.zig" [ref=e4038]:
        - generic [ref=e4039]: single_value_error_set_shortcut.zig
        - code [ref=e4041]: const err = error.FileNotFound;
      - paragraph [ref=e4042]: "This is equivalent to:"
      - figure "single_value_error_set.zig" [ref=e4043]:
        - generic [ref=e4044]: single_value_error_set.zig
        - code [ref=e4046]: "const err = (error{FileNotFound}).FileNotFound;"
      - paragraph [ref=e4047]:
        - text: This becomes useful when using
        - link "Inferred Error Sets" [ref=e4048] [cursor=pointer]:
          - /url: "#Inferred-Error-Sets"
        - text: .
      - heading "The Global Error Set" [level=4] [ref=e4049]:
        - link "The Global Error Set" [ref=e4050] [cursor=pointer]:
          - /url: "#toc-The-Global-Error-Set"
      - paragraph [ref=e4051]:
        - code [ref=e4052]: anyerror
        - text: refers to the global error set. This is the error set that contains all errors in the entire compilation unit, i.e. it is the union of all other error sets.
      - paragraph [ref=e4053]:
        - text: You can
        - link "coerce" [ref=e4054] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: any error set to the global one, and you can explicitly cast an error of the global error set to a non-global one. This inserts a language-level assert to make sure the error value is in fact in the destination error set.
      - paragraph [ref=e4055]:
        - text: The global error set should generally be avoided because it prevents the compiler from knowing what errors are possible at compile-time. Knowing the error set at compile-time is better for generated documentation and helpful error messages, such as forgetting a possible error value in a
        - link "switch" [ref=e4056] [cursor=pointer]:
          - /url: "#switch"
        - text: .
      - heading "Error Union Type" [level=3] [ref=e4057]:
        - link "Error Union Type" [ref=e4058] [cursor=pointer]:
          - /url: "#toc-Error-Union-Type"
      - paragraph [ref=e4059]:
        - text: An error set type and normal type can be combined with the
        - code [ref=e4060]: "!"
        - text: binary operator to form an error union type. You are likely to use an error union type more often than an error set type by itself.
      - paragraph [ref=e4061]: "Here is a function to parse a string into a 64-bit integer:"
      - figure "error_union_parsing_u64.zig" [ref=e4062]:
        - generic [ref=e4063]: error_union_parsing_u64.zig
        - code [ref=e4065]: "const std = @import(\"std\"); const maxInt = std.math.maxInt; pub fn parseU64(buf: []const u8, radix: u8) !u64 { var x: u64 = 0; for (buf) |c| { const digit = charToDigit(c); if (digit >= radix) { return error.InvalidChar; } // x *= radix var ov = @mulWithOverflow(x, radix); if (ov[1] != 0) return error.OverFlow; // x += digit ov = @addWithOverflow(ov[0], digit); if (ov[1] != 0) return error.OverFlow; x = ov[0]; } return x; } fn charToDigit(c: u8) u8 { return switch (c) { '0'...'9' => c - '0', 'A'...'Z' => c - 'A' + 10, 'a'...'z' => c - 'a' + 10, else => maxInt(u8), }; } test \"parse u64\" { const result = try parseU64(\"1234\", 10); try std.testing.expectEqual(1234, result); }"
      - figure "Shell" [ref=e4066]:
        - generic [ref=e4067]: Shell
        - generic [ref=e4069]: $ zig test error_union_parsing_u64.zig 1/1 error_union_parsing_u64.test.parse u64...OK All 1 tests passed.
      - paragraph [ref=e4070]:
        - text: Notice the return type is
        - code [ref=e4071]: "!u64"
        - text: . This means that the function either returns an unsigned 64 bit integer, or an error. We left off the error set to the left of the
        - code [ref=e4072]: "!"
        - text: ", so the error set is inferred."
      - paragraph [ref=e4073]:
        - text: Within the function definition, you can see some return statements that return an error, and at the bottom a return statement that returns a
        - code [ref=e4074]: u64
        - text: . Both types
        - link "coerce" [ref=e4075] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: to
        - code [ref=e4076]: anyerror!u64
        - text: .
      - paragraph [ref=e4077]: "What it looks like to use this function varies depending on what you're trying to do. One of the following:"
      - list [ref=e4078]:
        - listitem [ref=e4079]: You want to provide a default value if it returned an error.
        - listitem [ref=e4080]: If it returned an error then you want to return the same error.
        - listitem [ref=e4081]: You know with complete certainty it will not return an error, so want to unconditionally unwrap it.
        - listitem [ref=e4082]: You want to take a different action for each possible error.
      - heading "catch" [level=4] [ref=e4083]:
        - link "catch" [ref=e4084] [cursor=pointer]:
          - /url: "#toc-catch"
      - paragraph [ref=e4085]:
        - text: If you want to provide a default value, you can use the
        - code [ref=e4086]: catch
        - text: "binary operator:"
      - figure "catch.zig" [ref=e4087]:
        - generic [ref=e4088]: catch.zig
        - code [ref=e4090]: "const parseU64 = @import(\"error_union_parsing_u64.zig\").parseU64; fn doAThing(str: []u8) void { const number = parseU64(str, 10) catch 13; _ = number; // ... }"
      - paragraph [ref=e4091]:
        - text: In this code,
        - code [ref=e4092]: number
        - text: will be equal to the successfully parsed string, or a default value of 13. The type of the right hand side of the binary
        - code [ref=e4093]: catch
        - text: operator must match the unwrapped error union type, or be of type
        - code [ref=e4094]: noreturn
        - text: .
      - paragraph [ref=e4095]:
        - text: If you want to provide a default value with
        - code [ref=e4096]: catch
        - text: after performing some logic, you can combine
        - code [ref=e4097]: catch
        - text: with named
        - link "Blocks" [ref=e4098] [cursor=pointer]:
          - /url: "#Blocks"
        - text: ":"
      - figure "handle_error_with_catch_block.zig" [ref=e4099]:
        - generic [ref=e4100]: handle_error_with_catch_block.zig
        - code [ref=e4102]: "const parseU64 = @import(\"error_union_parsing_u64.zig\").parseU64; fn doAThing(str: []u8) void { const number = parseU64(str, 10) catch blk: { // do things break :blk 13; }; _ = number; // number is now initialized }"
      - heading "try" [level=4] [ref=e4103]:
        - link "try" [ref=e4104] [cursor=pointer]:
          - /url: "#toc-try"
      - paragraph [ref=e4105]: "Let's say you wanted to return the error if you got one, otherwise continue with the function logic:"
      - figure "catch_err_return.zig" [ref=e4106]:
        - generic [ref=e4107]: catch_err_return.zig
        - code [ref=e4109]: "const parseU64 = @import(\"error_union_parsing_u64.zig\").parseU64; fn doAThing(str: []u8) !void { const number = parseU64(str, 10) catch |err| return err; _ = number; // ... }"
      - paragraph [ref=e4110]:
        - text: There is a shortcut for this. The
        - code [ref=e4111]: try
        - text: "expression:"
      - figure "try.zig" [ref=e4112]:
        - generic [ref=e4113]: try.zig
        - code [ref=e4115]: "const parseU64 = @import(\"error_union_parsing_u64.zig\").parseU64; fn doAThing(str: []u8) !void { const number = try parseU64(str, 10); _ = number; // ... }"
      - paragraph [ref=e4116]:
        - code [ref=e4117]: try
        - text: evaluates an error union expression. If it is an error, it returns from the current function with the same error. Otherwise, the expression results in the unwrapped value.
      - paragraph [ref=e4118]: "Maybe you know with complete certainty that an expression will never be an error. In this case you can do this:"
      - code [ref=e4119]: const number = parseU64("1234", 10) catch unreachable;
      - paragraph [ref=e4120]:
        - text: Here we know for sure that "1234" will parse successfully. So we put the
        - code [ref=e4121]: unreachable
        - text: value on the right hand side.
        - code [ref=e4122]: unreachable
        - text: invokes safety-checked
        - link "Illegal Behavior" [ref=e4123] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: ", so in"
        - link "Debug" [ref=e4124] [cursor=pointer]:
          - /url: "#Debug"
        - text: and
        - link "ReleaseSafe" [ref=e4125] [cursor=pointer]:
          - /url: "#ReleaseSafe"
        - text: ", triggers a safety panic by default. So, while we're debugging the application, if there"
        - emphasis [ref=e4126]: was
        - text: a surprise error here, the application would crash appropriately.
      - paragraph [ref=e4127]:
        - text: You may want to take a different action for every situation. For that, we combine the
        - link "if" [ref=e4128] [cursor=pointer]:
          - /url: "#if"
        - text: and
        - link "switch" [ref=e4129] [cursor=pointer]:
          - /url: "#switch"
        - text: "expression:"
      - figure "handle_all_error_scenarios.zig" [ref=e4130]:
        - generic [ref=e4131]: handle_all_error_scenarios.zig
        - code [ref=e4133]: "fn doAThing(str: []u8) void { if (parseU64(str, 10)) |number| { doSomethingWithNumber(number); } else |err| switch (err) { error.Overflow => { // handle overflow... }, // we promise that InvalidChar won't happen (or crash in debug mode if it does) error.InvalidChar => unreachable, } }"
      - paragraph [ref=e4134]:
        - text: Finally, you may want to handle only some errors. For that, you can capture the unhandled errors in the
        - code [ref=e4135]: else
        - text: "case, which now contains a narrower error set:"
      - figure "handle_some_error_scenarios.zig" [ref=e4136]:
        - generic [ref=e4137]: handle_some_error_scenarios.zig
        - code [ref=e4139]: "fn doAnotherThing(str: []u8) error{InvalidChar}!void { if (parseU64(str, 10)) |number| { doSomethingWithNumber(number); } else |err| switch (err) { error.Overflow => { // handle overflow... }, else => |leftover_err| return leftover_err, } }"
      - paragraph [ref=e4140]:
        - text: You must use the variable capture syntax. If you don't need the variable, you can capture with
        - code [ref=e4141]: _
        - text: and avoid the
        - code [ref=e4142]: switch
        - text: .
      - figure "handle_no_error_scenarios.zig" [ref=e4143]:
        - generic [ref=e4144]: handle_no_error_scenarios.zig
        - code [ref=e4146]: "fn doADifferentThing(str: []u8) void { if (parseU64(str, 10)) |number| { doSomethingWithNumber(number); } else |_| { // do as you'd like } }"
      - heading "errdefer" [level=4] [ref=e4147]:
        - link "errdefer" [ref=e4148] [cursor=pointer]:
          - /url: "#toc-errdefer"
      - paragraph [ref=e4149]:
        - text: The other component to error handling is defer statements. In addition to an unconditional
        - link "defer" [ref=e4150] [cursor=pointer]:
          - /url: "#defer"
        - text: ", Zig has"
        - code [ref=e4151]: errdefer
        - text: ", which evaluates the deferred expression on block exit path if and only if the function returned with an error from the block."
      - paragraph [ref=e4152]: "Example:"
      - figure "errdefer_example.zig" [ref=e4153]:
        - generic [ref=e4154]: errdefer_example.zig
        - code [ref=e4156]: "fn createFoo(param: i32) !Foo { const foo = try tryToAllocateFoo(); // now we have allocated foo. we need to free it if the function fails. // but we want to return it if the function succeeds. errdefer deallocateFoo(foo); const tmp_buf = allocateTmpBuffer() orelse return error.OutOfMemory; // tmp_buf is truly a temporary resource, and we for sure want to clean it up // before this block leaves scope defer deallocateTmpBuffer(tmp_buf); if (param > 1337) return error.InvalidParam; // here the errdefer will not run since we're returning success from the function. // but the defer will run! return foo; }"
      - paragraph [ref=e4157]: The neat thing about this is that you get robust error handling without the verbosity and cognitive overhead of trying to make sure every exit path is covered. The deallocation code is always directly following the allocation code.
      - paragraph [ref=e4158]: "A couple of other tidbits about error handling:"
      - list [ref=e4159]:
        - listitem [ref=e4160]:
          - text: These primitives give enough expressiveness that it's completely practical to have failing to check for an error be a compile error. If you really want to ignore the error, you can add
          - code [ref=e4161]: catch unreachable
          - text: and get the added benefit of crashing in Debug and ReleaseSafe modes if your assumption was wrong.
        - listitem [ref=e4162]: Since Zig understands error types, it can pre-weight branches in favor of errors not occurring. Just a small optimization benefit that is not available in other languages.
      - paragraph [ref=e4163]: "See also:"
      - list [ref=e4164]:
        - listitem [ref=e4165]:
          - link "defer" [ref=e4166] [cursor=pointer]:
            - /url: "#defer"
        - listitem [ref=e4167]:
          - link "if" [ref=e4168] [cursor=pointer]:
            - /url: "#if"
        - listitem [ref=e4169]:
          - link "switch" [ref=e4170] [cursor=pointer]:
            - /url: "#switch"
      - paragraph [ref=e4171]:
        - text: An error union is created with the
        - code [ref=e4172]: "!"
        - text: "binary operator. You can use compile-time reflection to access the child type of an error union:"
      - figure "test_error_union.zig" [ref=e4173]:
        - generic [ref=e4174]: test_error_union.zig
        - code [ref=e4176]: "const expectEqual = @import(\"std\").testing.expectEqual; test \"error union\" { var foo: anyerror!i32 = undefined; // Coerce from child type of an error union: foo = 1234; // Coerce from an error set: foo = error.SomeError; // Use compile-time reflection to access the payload type of an error union: try comptime expectEqual(i32, @typeInfo(@TypeOf(foo)).error_union.payload); // Use compile-time reflection to access the error set type of an error union: try comptime expectEqual(anyerror, @typeInfo(@TypeOf(foo)).error_union.error_set); }"
      - figure "Shell" [ref=e4177]:
        - generic [ref=e4178]: Shell
        - generic [ref=e4180]: $ zig test test_error_union.zig 1/1 test_error_union.test.error union...OK All 1 tests passed.
      - heading "Merging Error Sets" [level=4] [ref=e4181]:
        - link "Merging Error Sets" [ref=e4182] [cursor=pointer]:
          - /url: "#toc-Merging-Error-Sets"
      - paragraph [ref=e4183]:
        - text: Use the
        - code [ref=e4184]: "||"
        - text: operator to merge two error sets together. The resulting error set contains the errors of both error sets. Doc comments from the left-hand side override doc comments from the right-hand side. In this example, the doc comments for
        - code [ref=e4185]: C.PathNotFound
        - text: is
        - code [ref=e4186]: A doc comment
        - text: .
      - paragraph [ref=e4187]:
        - text: This is especially useful for functions which return different error sets depending on
        - link "comptime" [ref=e4188] [cursor=pointer]:
          - /url: "#comptime"
        - text: branches. For example, the Zig standard library uses
        - code [ref=e4189]: LinuxFileOpenError || WindowsFileOpenError
        - text: for the error set of opening files.
      - figure "test_merging_error_sets.zig" [ref=e4190]:
        - generic [ref=e4191]: test_merging_error_sets.zig
        - code [ref=e4193]: "const A = error{ NotDir, /// A doc comment PathNotFound, }; const B = error{ OutOfMemory, /// B doc comment PathNotFound, }; const C = A || B; fn foo() C!void { return error.NotDir; } test \"merge error sets\" { if (foo()) { @panic(\"unexpected\"); } else |err| switch (err) { error.OutOfMemory => @panic(\"unexpected\"), error.PathNotFound => @panic(\"unexpected\"), error.NotDir => {}, } }"
      - figure "Shell" [ref=e4194]:
        - generic [ref=e4195]: Shell
        - generic [ref=e4197]: $ zig test test_merging_error_sets.zig 1/1 test_merging_error_sets.test.merge error sets...OK All 1 tests passed.
      - heading "Inferred Error Sets" [level=4] [ref=e4198]:
        - link "Inferred Error Sets" [ref=e4199] [cursor=pointer]:
          - /url: "#toc-Inferred-Error-Sets"
      - paragraph [ref=e4200]:
        - text: Because many functions in Zig return a possible error, Zig supports inferring the error set. To infer the error set for a function, prepend the
        - code [ref=e4201]: "!"
        - text: operator to the function’s return type, like
        - code [ref=e4202]: "!T"
        - text: ":"
      - figure "test_inferred_error_sets.zig" [ref=e4203]:
        - generic [ref=e4204]: test_inferred_error_sets.zig
        - code [ref=e4206]: "// With an inferred error set pub fn add_inferred(comptime T: type, a: T, b: T) !T { const ov = @addWithOverflow(a, b); if (ov[1] != 0) return error.Overflow; return ov[0]; } // With an explicit error set pub fn add_explicit(comptime T: type, a: T, b: T) Error!T { const ov = @addWithOverflow(a, b); if (ov[1] != 0) return error.Overflow; return ov[0]; } const Error = error{ Overflow, }; const std = @import(\"std\"); test \"inferred error set\" { if (add_inferred(u8, 255, 1)) |_| unreachable else |err| switch (err) { error.Overflow => {}, // ok } }"
      - figure "Shell" [ref=e4207]:
        - generic [ref=e4208]: Shell
        - generic [ref=e4210]: $ zig test test_inferred_error_sets.zig 1/1 test_inferred_error_sets.test.inferred error set...OK All 1 tests passed.
      - paragraph [ref=e4211]: When a function has an inferred error set, that function becomes generic and thus it becomes trickier to do certain things with it, such as obtain a function pointer, or have an error set that is consistent across different build targets. Additionally, inferred error sets are incompatible with recursion.
      - paragraph [ref=e4212]: In these situations, it is recommended to use an explicit error set. You can generally start with an empty error set and let compile errors guide you toward completing the set.
      - paragraph [ref=e4213]: These limitations may be overcome in a future version of Zig.
      - heading "Error Return Traces" [level=3] [ref=e4214]:
        - link "Error Return Traces" [ref=e4215] [cursor=pointer]:
          - /url: "#toc-Error-Return-Traces"
      - paragraph [ref=e4216]:
        - text: Error Return Traces show all the points in the code that an error was returned to the calling function. This makes it practical to use
        - link "try" [ref=e4217] [cursor=pointer]:
          - /url: "#try"
        - text: everywhere and then still be able to know what happened if an error ends up bubbling all the way out of your application.
      - figure "error_return_trace.zig" [ref=e4218]:
        - generic [ref=e4219]: error_return_trace.zig
        - code [ref=e4221]: "pub fn main() !void { try foo(12); } fn foo(x: i32) !void { if (x >= 5) { try bar(); } else { try bang2(); } } fn bar() !void { if (baz()) { try quux(); } else |err| switch (err) { error.FileNotFound => try hello(), } } fn baz() !void { try bang1(); } fn quux() !void { try bang2(); } fn hello() !void { try bang2(); } fn bang1() !void { return error.FileNotFound; } fn bang2() !void { return error.PermissionDenied; }"
      - figure "Shell" [ref=e4222]:
        - generic [ref=e4223]: Shell
        - generic [ref=e4225]: "$ zig build-exe error_return_trace.zig $ ./error_return_trace error: PermissionDenied /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:34:5: 0x11dfadc in bang1 (error_return_trace.zig) return error.FileNotFound; ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:22:5: 0x11dfb37 in baz (error_return_trace.zig) try bang1(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:38:5: 0x11dfb7c in bang2 (error_return_trace.zig) return error.PermissionDenied; ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:30:5: 0x11dfc57 in hello (error_return_trace.zig) try bang2(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:17:31: 0x11dfd65 in bar (error_return_trace.zig) error.FileNotFound => try hello(), ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:7:9: 0x11dfe45 in foo (error_return_trace.zig) try bar(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/error_return_trace.zig:2:5: 0x11dff4c in main (error_return_trace.zig) try foo(12); ^"
      - paragraph [ref=e4226]: Look closely at this example. This is no stack trace.
      - paragraph [ref=e4227]:
        - text: You can see that the final error bubbled up was
        - code [ref=e4228]: PermissionDenied
        - text: ", but the original error that started this whole thing was"
        - code [ref=e4229]: FileNotFound
        - text: . In the
        - code [ref=e4230]: bar
        - text: "function, the code handles the original error code, and then returns another one, from the switch statement. Error Return Traces make this clear, whereas a stack trace would look like this:"
      - figure "stack_trace.zig" [ref=e4231]:
        - generic [ref=e4232]: stack_trace.zig
        - code [ref=e4234]: "pub fn main() void { foo(12); } fn foo(x: i32) void { if (x >= 5) { bar(); } else { bang2(); } } fn bar() void { if (baz()) { quux(); } else { hello(); } } fn baz() bool { return bang1(); } fn quux() void { bang2(); } fn hello() void { bang2(); } fn bang1() bool { return false; } fn bang2() void { @panic(\"PermissionDenied\"); }"
      - figure "Shell" [ref=e4235]:
        - generic [ref=e4236]: Shell
        - generic [ref=e4238]: "$ zig build-exe stack_trace.zig $ ./stack_trace thread 3084008 panic: PermissionDenied /home/ci/work/zig-bootstrap/zig/doc/langref/stack_trace.zig:38:5: 0x11e0e0a in bang2 (stack_trace.zig) @panic(\"PermissionDenied\"); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/stack_trace.zig:30:10: 0x11e0e8c in hello (stack_trace.zig) bang2(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/stack_trace.zig:17:14: 0x11e0e43 in bar (stack_trace.zig) hello(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/stack_trace.zig:7:12: 0x11e0828 in foo (stack_trace.zig) bar(); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/stack_trace.zig:2:8: 0x11e0791 in main (stack_trace.zig) foo(12); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/std/start.zig:739:64: 0x11e009b in callMain (std.zig) if (fn_info.param_types.len == 0) return wrapMain(root.main()); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/std/start.zig:205:5: 0x11dfac1 in _start (std.zig) asm volatile (switch (native_arch) { ^ (process terminated by signal)"
      - paragraph [ref=e4239]:
        - text: Here, the stack trace does not explain how the control flow in
        - code [ref=e4240]: bar
        - text: got to the
        - code [ref=e4241]: hello()
        - text: call. One would have to open a debugger or further instrument the application in order to find out. The error return trace, on the other hand, shows exactly how the error bubbled up.
      - paragraph [ref=e4242]: This debugging feature makes it easier to iterate quickly on code that robustly handles all error conditions. This means that Zig developers will naturally find themselves writing correct, robust code in order to increase their development pace.
      - paragraph [ref=e4243]:
        - text: Error Return Traces are enabled by default in
        - link "Debug" [ref=e4244] [cursor=pointer]:
          - /url: "#Debug"
        - text: builds and disabled by default in
        - link "ReleaseFast" [ref=e4245] [cursor=pointer]:
          - /url: "#ReleaseFast"
        - text: ","
        - link "ReleaseSafe" [ref=e4246] [cursor=pointer]:
          - /url: "#ReleaseSafe"
        - text: and
        - link "ReleaseSmall" [ref=e4247] [cursor=pointer]:
          - /url: "#ReleaseSmall"
        - text: builds.
      - paragraph [ref=e4248]: "There are a few ways to activate this error return tracing feature:"
      - list [ref=e4249]:
        - listitem [ref=e4250]: Return an error from main
        - listitem [ref=e4251]:
          - text: An error makes its way to
          - code [ref=e4252]: catch unreachable
          - text: and you have not overridden the default panic handler
        - listitem [ref=e4253]:
          - text: Use
          - link "errorReturnTrace" [ref=e4254] [cursor=pointer]:
            - /url: "#errorReturnTrace"
          - text: to access the current return trace. You can use
          - code [ref=e4255]: std.debug.dumpErrorReturnTrace
          - text: to print it. This function returns comptime-known
          - link "null" [ref=e4256] [cursor=pointer]:
            - /url: "#null"
          - text: when building without error return tracing support.
      - heading "Implementation Details" [level=4] [ref=e4257]:
        - link "Implementation Details" [ref=e4258] [cursor=pointer]:
          - /url: "#toc-Implementation-Details"
      - paragraph [ref=e4259]: "To analyze performance cost, there are two cases:"
      - list [ref=e4260]:
        - listitem [ref=e4261]: when no errors are returned
        - listitem [ref=e4262]: when returning errors
      - paragraph [ref=e4263]:
        - text: For the case when no errors are returned, the cost is a single memory write operation, only in the first non-failable function in the call graph that calls a failable function, i.e. when a function returning
        - code [ref=e4264]: void
        - text: calls a function returning
        - code [ref=e4265]: error
        - text: ". This is to initialize this struct in the stack memory:"
      - figure "stack_trace_struct.zig" [ref=e4266]:
        - generic [ref=e4267]: stack_trace_struct.zig
        - code [ref=e4269]: "pub const StackTrace = struct { index: usize, instruction_addresses: [N]usize, };"
      - paragraph [ref=e4270]: Here, N is the maximum function call depth as determined by call graph analysis. Recursion is ignored and counts for 2.
      - paragraph [ref=e4271]:
        - text: A pointer to
        - code [ref=e4272]: StackTrace
        - text: is passed as a secret parameter to every function that can return an error, but it's always the first parameter, so it can likely sit in a register and stay there.
      - paragraph [ref=e4273]: That's it for the path when no errors occur. It's practically free in terms of performance.
      - paragraph [ref=e4274]:
        - text: When generating the code for a function that returns an error, just before the
        - code [ref=e4275]: return
        - text: statement (only for the
        - code [ref=e4276]: return
        - text: "statements that return errors), Zig generates a call to this function:"
      - figure "zig_return_error_fn.zig" [ref=e4277]:
        - generic [ref=e4278]: zig_return_error_fn.zig
        - code [ref=e4280]: "// marked as \"no-inline\" in LLVM IR fn __zig_return_error(stack_trace: *StackTrace) void { stack_trace.instruction_addresses[stack_trace.index] = @returnAddress(); stack_trace.index = (stack_trace.index + 1) % N; }"
      - paragraph [ref=e4281]: The cost is 2 math operations plus some memory reads and writes. The memory accessed is constrained and should remain cached for the duration of the error return bubbling.
      - paragraph [ref=e4282]:
        - text: As for code size cost, 1 function call before a return statement is no big deal. Even so, I have
        - link "a plan" [ref=e4283] [cursor=pointer]:
          - /url: https://github.com/ziglang/zig/issues/690
        - text: to make the call to
        - code [ref=e4284]: __zig_return_error
        - text: a tail call, which brings the code size cost down to actually zero. What is a return statement in code without error return tracing can become a jump instruction in code with error return tracing.
      - heading "Optionals" [level=2] [ref=e4285]:
        - link "Optionals" [ref=e4286] [cursor=pointer]:
          - /url: "#toc-Optionals"
      - paragraph [ref=e4287]: One area that Zig provides safety without compromising efficiency or readability is with the optional type.
      - paragraph [ref=e4288]: "The question mark symbolizes the optional type. You can convert a type to an optional type by putting a question mark in front of it, like this:"
      - figure "optional_integer.zig" [ref=e4289]:
        - generic [ref=e4290]: optional_integer.zig
        - code [ref=e4292]: "// normal integer const normal_int: i32 = 1234; // optional integer const optional_int: ?i32 = 5678;"
      - paragraph [ref=e4293]:
        - text: Now the variable
        - code [ref=e4294]: optional_int
        - text: could be an
        - code [ref=e4295]: i32
        - text: ", or"
        - code [ref=e4296]: "null"
        - text: .
      - paragraph [ref=e4297]:
        - text: Instead of integers, let's talk about pointers. Null references are the source of many runtime exceptions, and even stand accused of being
        - link "the worst mistake of computer science" [ref=e4298] [cursor=pointer]:
          - /url: https://www.lucidchart.com/techblog/2015/08/31/the-worst-mistake-of-computer-science/
        - text: .
      - paragraph [ref=e4299]: Zig does not have them.
      - paragraph [ref=e4300]: Instead, you can use an optional pointer. This secretly compiles down to a normal pointer, since we know we can use 0 as the null value for the optional type. But the compiler can check your work and make sure you don't assign null to something that can't be null.
      - paragraph [ref=e4301]: Typically the downside of not having null is that it makes the code more verbose to write. But, let's compare some equivalent C code and Zig code.
      - paragraph [ref=e4302]: "Task: call malloc, if the result is null, return null."
      - paragraph [ref=e4303]: C code
      - figure "call_malloc_in_c.c" [ref=e4304]:
        - generic [ref=e4305]: call_malloc_in_c.c
        - code [ref=e4307]: "// malloc prototype included for reference void *malloc(size_t size); struct Foo *do_a_thing(void) { char *ptr = malloc(1234); if (!ptr) return NULL; // ... }"
      - paragraph [ref=e4308]: Zig code
      - figure "call_malloc_from_zig.zig" [ref=e4309]:
        - generic [ref=e4310]: call_malloc_from_zig.zig
        - code [ref=e4312]: "// malloc prototype included for reference extern fn malloc(size: usize) ?[*]u8; fn doAThing() ?*Foo { const ptr = malloc(1234) orelse return null; _ = ptr; // ... }"
      - paragraph [ref=e4313]:
        - text: Here, Zig is at least as convenient, if not more, than C. And, the type of "ptr" is
        - code [ref=e4314]: "[*]u8"
        - emphasis [ref=e4315]: not
        - code [ref=e4316]: "?[*]u8"
        - text: . The
        - code [ref=e4317]: orelse
        - text: keyword unwrapped the optional type and therefore
        - code [ref=e4318]: ptr
        - text: is guaranteed to be non-null everywhere it is used in the function.
      - paragraph [ref=e4319]: "The other form of checking against NULL you might see looks like this:"
      - figure "checking_null_in_c.c" [ref=e4320]:
        - generic [ref=e4321]: checking_null_in_c.c
        - code [ref=e4323]: "void do_a_thing(struct Foo *foo) { // do some stuff if (foo) { do_something_with_foo(foo); } // do some stuff }"
      - paragraph [ref=e4324]: "In Zig you can accomplish the same thing:"
      - figure "checking_null_in_zig.zig" [ref=e4325]:
        - generic [ref=e4326]: checking_null_in_zig.zig
        - code [ref=e4328]: "const Foo = struct {}; fn doSomethingWithFoo(foo: *Foo) void { _ = foo; } fn doAThing(optional_foo: ?*Foo) void { // do some stuff if (optional_foo) |foo| { doSomethingWithFoo(foo); } // do some stuff }"
      - paragraph [ref=e4329]:
        - text: Once again, the notable thing here is that inside the if block,
        - code [ref=e4330]: foo
        - text: is no longer an optional pointer, it is a pointer, which cannot be null.
      - paragraph [ref=e4331]:
        - text: One benefit to this is that functions which take pointers as arguments can be annotated with the "nonnull" attribute -
        - code [ref=e4332]: __attribute__((nonnull))
        - text: in
        - link "GCC" [ref=e4333] [cursor=pointer]:
          - /url: https://gcc.gnu.org/onlinedocs/gcc-4.0.0/gcc/Function-Attributes.html
        - text: . The optimizer can sometimes make better decisions knowing that pointer arguments cannot be null.
      - heading "Optional Type" [level=3] [ref=e4334]:
        - link "Optional Type" [ref=e4335] [cursor=pointer]:
