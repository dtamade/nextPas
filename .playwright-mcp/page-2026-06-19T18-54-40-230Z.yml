            - /url: "#try"
      - heading "Comments" [level=2] [ref=e841]:
        - link "Comments" [ref=e842] [cursor=pointer]:
          - /url: "#toc-Comments"
      - paragraph [ref=e843]:
        - text: There are three types of comments. Normal comments are ignored, while
        - link "Doc Comments" [ref=e844] [cursor=pointer]:
          - /url: "#Doc-Comments"
        - text: and
        - link "Top-Level Doc Comments" [ref=e845] [cursor=pointer]:
          - /url: "#Top-Level-Doc-Comments"
        - text: are used by the compiler to generate the package documentation.
      - figure "comments.zig" [ref=e846]:
        - generic [ref=e847]: comments.zig
        - code [ref=e849]: "const print = @import(\"std\").debug.print; pub fn main() void { // Comments in Zig start with \"//\" and end at the next LF byte (end of line). // The line below is a comment and won't be executed. //print(\"Hello?\", .{}); print(\"Hello, world!\\n\", .{}); // another comment }"
      - figure "Shell" [ref=e850]:
        - generic [ref=e851]: Shell
        - generic [ref=e853]: $ zig build-exe comments.zig $ ./comments Hello, world!
      - paragraph [ref=e854]: There are no multiline comments. Zig has the property that each line of code can be tokenized independently.
      - heading "Doc Comments" [level=3] [ref=e855]:
        - link "Doc Comments" [ref=e856] [cursor=pointer]:
          - /url: "#toc-Doc-Comments"
      - paragraph [ref=e857]:
        - text: A doc comment is one that begins with exactly three slashes (i.e.
        - code [ref=e858]: ///
        - text: but not
        - code [ref=e859]: ////
        - text: ); multiple doc comments in a row are merged together to form a multiline doc comment. The doc comment documents whatever immediately follows it.
      - figure "doc_comments.zig" [ref=e860]:
        - generic [ref=e861]: doc_comments.zig
        - code [ref=e863]: "/// A structure for storing a timestamp, with nanosecond precision (this is a /// multiline doc comment). const Timestamp = struct { /// The number of seconds since the epoch (this is also a doc comment). seconds: i64, // signed so we can represent pre-1970 (not a doc comment) /// The number of nanoseconds past the second (doc comment again). nanos: u32, /// Returns a `Timestamp` struct representing the Unix epoch; that is, the /// moment of 1970 Jan 1 00:00:00 UTC (this is a doc comment too). pub fn unixEpoch() Timestamp { return Timestamp{ .seconds = 0, .nanos = 0, }; } };"
      - paragraph [ref=e864]: Doc comments are only allowed in certain places; it is a compile error to have a doc comment in an unexpected place, such as in the middle of an expression, or just before a non-doc comment.
      - figure "invalid_doc-comment.zig" [ref=e865]:
        - generic [ref=e866]: invalid_doc-comment.zig
        - code [ref=e868]: /// doc-comment //! top-level doc-comment const std = @import("std");
      - figure "Shell" [ref=e869]:
        - generic [ref=e870]: Shell
        - generic [ref=e872]: "$ zig build-obj invalid_doc-comment.zig /home/ci/work/zig-bootstrap/zig/doc/langref/invalid_doc-comment.zig:1:16: error: expected type expression, found 'a document comment' /// doc-comment ^"
      - figure "unattached_doc-comment.zig" [ref=e873]:
        - generic [ref=e874]: unattached_doc-comment.zig
        - code [ref=e876]: "pub fn main() void {} /// End of file"
      - figure "Shell" [ref=e877]:
        - generic [ref=e878]: Shell
        - generic [ref=e880]: "$ zig build-obj unattached_doc-comment.zig /home/ci/work/zig-bootstrap/zig/doc/langref/unattached_doc-comment.zig:3:1: error: unattached documentation comment /// End of file ^~~~~~~~~~~~~~~"
      - paragraph [ref=e881]: Doc comments can be interleaved with normal comments, which are ignored.
      - heading "Top-Level Doc Comments" [level=3] [ref=e882]:
        - link "Top-Level Doc Comments" [ref=e883] [cursor=pointer]:
          - /url: "#toc-Top-Level-Doc-Comments"
      - paragraph [ref=e884]:
        - text: "A top-level doc comment is one that begins with two slashes and an exclamation point:"
        - code [ref=e885]: //!
        - text: ; it documents the type which owns the containing
        - link "Namespace" [ref=e886] [cursor=pointer]:
          - /url: "#Namespace"
        - text: .
      - paragraph [ref=e887]: It is a compile error if a top-level doc comment is not placed at the start of a namespace, before any expressions.
      - figure "tldoc_comments.zig" [ref=e888]:
        - generic [ref=e889]: tldoc_comments.zig
        - code [ref=e891]: "//! Provides functions for retrieving the current date and time with varying //! degrees of precision and accuracy. const S = struct { //! Top level comments are allowed inside namespaces other than the //! implicit struct created by files, but it is not very useful. Currently, //! when producing the package documentation, these comments are ignored. };"
      - heading "Namespace" [level=2] [ref=e892]:
        - link "Namespace" [ref=e893] [cursor=pointer]:
          - /url: "#toc-Namespace"
      - paragraph [ref=e894]:
        - text: A namespace in Zig is created by
        - link "struct" [ref=e895] [cursor=pointer]:
          - /url: "#struct"
        - text: ","
        - link "enum" [ref=e896] [cursor=pointer]:
          - /url: "#enum"
        - text: ","
        - link "union" [ref=e897] [cursor=pointer]:
          - /url: "#union"
        - text: ", and"
        - link "opaque" [ref=e898] [cursor=pointer]:
          - /url: "#opaque"
        - text: .
      - paragraph [ref=e899]:
        - text: They contain
        - link "Namespace Level Variables" [ref=e900] [cursor=pointer]:
          - /url: "#Namespace-Level-Variables"
        - text: ","
        - link "function" [ref=e901] [cursor=pointer]:
          - /url: "#Functions"
        - text: declarations, and
        - link "comptime" [ref=e902] [cursor=pointer]:
          - /url: "#comptime"
        - text: blocks.
      - paragraph [ref=e903]:
        - text: Although namespaces use curly braces to surround their definition, they should not be confused with
        - link "blocks" [ref=e904] [cursor=pointer]:
          - /url: "#Blocks"
        - text: or function bodies.
      - paragraph [ref=e905]:
        - strong [ref=e906]: Every Zig source file is implicitly a struct
        - text: ", with the keyword"
        - code [ref=e907]: struct
        - text: and curly braces omitted.
      - heading "Identifiers" [level=2] [ref=e908]:
        - link "Identifiers" [ref=e909] [cursor=pointer]:
          - /url: "#toc-Identifiers"
      - paragraph [ref=e910]:
        - text: Identifiers must start with an alphabetic character or underscore and may be followed by any number of alphanumeric characters or underscores. They must not overlap with any keywords. See
        - link "Keyword Reference" [ref=e911] [cursor=pointer]:
          - /url: "#Keyword-Reference"
        - text: .
      - heading "String Identifier Syntax" [level=3] [ref=e912]:
        - link "String Identifier Syntax" [ref=e913] [cursor=pointer]:
          - /url: "#toc-String-Identifier-Syntax"
      - paragraph [ref=e914]:
        - text: If a name that does not fit these requirements is needed, such as for linking with external libraries, the
        - code [ref=e915]: "@\"\""
        - text: syntax may be used.
      - figure "identifiers.zig" [ref=e916]:
        - generic [ref=e917]: identifiers.zig
        - code [ref=e919]: "const @\"identifier with spaces in it\" = 0xff; const @\"1SmallStep4Man\" = 112358; const c = @import(\"std\").c; pub extern \"c\" fn @\"error\"() void; pub extern \"c\" fn @\"fstat$INODE64\"(fd: c.fd_t, buf: *c.Stat) c_int; const Color = enum { red, @\"really red\", }; const color: Color = .@\"really red\";"
      - heading "Values" [level=2] [ref=e920]:
        - link "Values" [ref=e921] [cursor=pointer]:
          - /url: "#toc-Values"
      - figure "values.zig" [ref=e922]:
        - generic [ref=e923]: values.zig
        - code [ref=e925]: "// Top-level declarations are order-independent: const print = std.debug.print; const std = @import(\"std\"); const os = std.os; const assert = std.debug.assert; // Custom error set definition: const ExampleErrorSet = error{ ExampleErrorVariant, }; pub fn main() void { // integers const one_plus_one: i32 = 1 + 1; print(\"1 + 1 = {}\\n\", .{one_plus_one}); // floats const seven_div_three: f32 = 7.0 / 3.0; print(\"7.0 / 3.0 = {}\\n\", .{seven_div_three}); // boolean print(\"{}\\n{}\\n{}\\n\", .{ true and false, true or false, !true, }); // optional var optional_value: ?[]const u8 = null; assert(optional_value == null); print(\"\\noptional 1\\ntype: {}\\nvalue: {?s}\\n\", .{ @TypeOf(optional_value), optional_value, }); optional_value = \"hi\"; assert(optional_value != null); print(\"\\noptional 2\\ntype: {}\\nvalue: {?s}\\n\", .{ @TypeOf(optional_value), optional_value, }); // error union var number_or_error: ExampleErrorSet!i32 = ExampleErrorSet.ExampleErrorVariant; print(\"\\nerror union 1\\ntype: {}\\nvalue: {!}\\n\", .{ @TypeOf(number_or_error), number_or_error, }); number_or_error = 1234; print(\"\\nerror union 2\\ntype: {}\\nvalue: {!}\\n\", .{ @TypeOf(number_or_error), number_or_error, }); }"
      - figure "Shell" [ref=e926]:
        - generic [ref=e927]: Shell
        - generic [ref=e929]: "$ zig build-exe values.zig $ ./values 1 + 1 = 2 7.0 / 3.0 = 2.3333333 false true false optional 1 type: ?[]const u8 value: null optional 2 type: ?[]const u8 value: hi error union 1 type: error{ExampleErrorVariant}!i32 value: error.ExampleErrorVariant error union 2 type: error{ExampleErrorVariant}!i32 value: 1234"
