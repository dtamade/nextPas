      - heading "Switching on Errors" [level=3] [ref=e3495]:
        - link "Switching on Errors" [ref=e3496] [cursor=pointer]:
          - /url: "#toc-Switching-on-Errors"
      - paragraph [ref=e3497]: "When switching on errors, some special cases are allowed to simplify generic programming patterns:"
      - figure "test_switch_on_errors.zig" [ref=e3498]:
        - generic [ref=e3499]: test_switch_on_errors.zig
        - code [ref=e3501]: "const FileOpenError0 = error{ AccessDenied, OutOfMemory, FileNotFound, }; fn openFile0() FileOpenError0 { return error.OutOfMemory; } test \"unreachable else prong\" { switch (openFile0()) { error.AccessDenied, error.FileNotFound => |e| return e, error.OutOfMemory => {}, // 'openFile0' cannot return any more errors, so an 'else' prong would be // statically known to be unreachable. Nonetheless, in this case, adding // one does not raise an \"unreachable else prong\" compile error: else => unreachable, } // Allowed unreachable else prongs are: // `else => unreachable,` // `else => return,` // `else => |e| return e,` (where `e` is any identifier) } const FileOpenError1 = error{ AccessDenied, SystemResources, FileNotFound, }; fn openFile1() FileOpenError1 { return error.SystemResources; } fn openFileGeneric(comptime kind: u1) switch (kind) { 0 => FileOpenError0, 1 => FileOpenError1, } { return switch (kind) { 0 => openFile0(), 1 => openFile1(), }; } test \"comptime unreachable errors not in error set\" { switch (openFileGeneric(1)) { error.AccessDenied, error.FileNotFound => |e| return e, error.OutOfMemory => comptime unreachable, // not in `FileOpenError1`! error.SystemResources => {}, } }"
      - figure "Shell" [ref=e3502]:
        - generic [ref=e3503]: Shell
        - generic [ref=e3505]: $ zig test test_switch_on_errors.zig 1/2 test_switch_on_errors.test.unreachable else prong...OK 2/2 test_switch_on_errors.test.comptime unreachable errors not in error set...OK All 2 tests passed.
      - heading "Labeled switch" [level=3] [ref=e3506]:
        - link "Labeled switch" [ref=e3507] [cursor=pointer]:
          - /url: "#toc-Labeled-switch"
      - paragraph [ref=e3508]:
        - text: When a switch statement is labeled, it can be referenced from a
        - code [ref=e3509]: break
        - text: or
        - code [ref=e3510]: continue
        - text: .
        - code [ref=e3511]: break
        - text: will return a value from the
        - code [ref=e3512]: switch
        - text: .
      - paragraph [ref=e3513]:
        - text: A
        - code [ref=e3514]: continue
        - text: targeting a switch must have an operand. When executed, it will jump to the matching prong, as if the
        - code [ref=e3515]: switch
        - text: were executed again with the
        - code [ref=e3516]: continue
        - text: "'s operand replacing the initial switch value."
      - figure "test_switch_continue.zig" [ref=e3517]:
        - generic [ref=e3518]: test_switch_continue.zig
        - code [ref=e3520]: "const std = @import(\"std\"); test \"switch continue\" { sw: switch (@as(i32, 5)) { 5 => continue :sw 4, // `continue` can occur multiple times within a single switch prong. 2...4 => |v| { if (v > 3) { continue :sw 2; } else if (v == 3) { // `break` can target labeled loops. break :sw; } continue :sw 1; }, 1 => return, else => unreachable, } }"
      - figure "Shell" [ref=e3521]:
        - generic [ref=e3522]: Shell
        - generic [ref=e3524]: $ zig test test_switch_continue.zig 1/1 test_switch_continue.test.switch continue...OK All 1 tests passed.
      - paragraph [ref=e3525]: "Semantically, this is equivalent to the following loop:"
      - figure "test_switch_continue_equivalent.zig" [ref=e3526]:
        - generic [ref=e3527]: test_switch_continue_equivalent.zig
        - code [ref=e3529]: "const std = @import(\"std\"); test \"switch continue, equivalent loop\" { var sw: i32 = 5; while (true) { switch (sw) { 5 => { sw = 4; continue; }, 2...4 => |v| { if (v > 3) { sw = 2; continue; } else if (v == 3) { break; } sw = 1; continue; }, 1 => return, else => unreachable, } } }"
      - figure "Shell" [ref=e3530]:
        - generic [ref=e3531]: Shell
        - generic [ref=e3533]: $ zig test test_switch_continue_equivalent.zig 1/1 test_switch_continue_equivalent.test.switch continue, equivalent loop...OK All 1 tests passed.
      - paragraph [ref=e3534]:
        - text: This can improve clarity of (for example) state machines, where the syntax
        - code [ref=e3535]: continue :sw .next_state
        - text: is unambiguous, explicit, and immediately understandable.
      - paragraph [ref=e3536]: "However, the motivating example is a switch on each element of an array, where using a single switch can improve clarity and performance:"
      - figure "test_switch_dispatch_loop.zig" [ref=e3537]:
        - generic [ref=e3538]: test_switch_dispatch_loop.zig
        - code [ref=e3540]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const Instruction = enum { add, mul, end, }; fn evaluate(initial_stack: []const i32, code: []const Instruction) !i32 { var buffer: [8]i32 = undefined; var stack = std.ArrayList(i32).initBuffer(&buffer); try stack.appendSliceBounded(initial_stack); var ip: usize = 0; return vm: switch (code[ip]) { // Because all code after `continue` is unreachable, this branch does // not provide a result. .add => { try stack.appendBounded(stack.pop().? + stack.pop().?); ip += 1; continue :vm code[ip]; }, .mul => { try stack.appendBounded(stack.pop().? * stack.pop().?); ip += 1; continue :vm code[ip]; }, .end => stack.pop().?, }; } test \"evaluate\" { const result = try evaluate(&.{ 7, 2, -3 }, &.{ .mul, .add, .end }); try expectEqual(1, result); }"
      - figure "Shell" [ref=e3541]:
        - generic [ref=e3542]: Shell
        - generic [ref=e3544]: $ zig test test_switch_dispatch_loop.zig 1/1 test_switch_dispatch_loop.test.evaluate...OK All 1 tests passed.
      - paragraph [ref=e3545]:
        - text: If the operand to
        - code [ref=e3546]: continue
        - text: is
        - link "comptime" [ref=e3547] [cursor=pointer]:
          - /url: "#comptime"
        - text: "-known, then it can be lowered to an unconditional branch to the relevant case. Such a branch is perfectly predicted, and hence typically very fast to execute."
      - paragraph [ref=e3548]:
        - text: If the operand is runtime-known, each
        - code [ref=e3549]: continue
        - text: can embed a conditional branch inline (ideally through a jump table), which allows a CPU to predict its target independently of any other prong. A loop-based lowering would force every branch through the same dispatch point, hindering branch prediction.
      - heading "Inline Switch Prongs" [level=3] [ref=e3550]:
        - link "Inline Switch Prongs" [ref=e3551] [cursor=pointer]:
          - /url: "#toc-Inline-Switch-Prongs"
      - paragraph [ref=e3552]:
        - text: Switch prongs can be marked as
        - code [ref=e3553]: inline
        - text: to generate the prong's body for each possible value it could have, making the captured value
        - link "comptime" [ref=e3554] [cursor=pointer]:
          - /url: "#comptime"
        - text: .
      - figure "test_inline_switch.zig" [ref=e3555]:
        - generic [ref=e3556]: test_inline_switch.zig
        - code [ref=e3558]: "const std = @import(\"std\"); const expect = std.testing.expect; const expectError = std.testing.expectError; fn isFieldOptional(comptime T: type, field_index: usize) !bool { const field_types = @typeInfo(T).@\"struct\".field_types; return switch (field_index) { // This prong is analyzed twice with `idx` being a // comptime-known value each time. inline 0, 1 => |idx| @typeInfo(field_types[idx]) == .optional, else => return error.IndexOutOfBounds, }; } const Struct1 = struct { a: u32, b: ?u32 }; test \"using @typeInfo with runtime values\" { var index: usize = 0; try expect(!try isFieldOptional(Struct1, index)); index += 1; try expect(try isFieldOptional(Struct1, index)); index += 1; try expectError(error.IndexOutOfBounds, isFieldOptional(Struct1, index)); } // Calls to `isFieldOptional` on `Struct1` get unrolled to an equivalent // of this function: fn isFieldOptionalUnrolled(field_index: usize) !bool { return switch (field_index) { 0 => false, 1 => true, else => return error.IndexOutOfBounds, }; }"
      - figure "Shell" [ref=e3559]:
        - generic [ref=e3560]: Shell
        - generic [ref=e3562]: $ zig test test_inline_switch.zig 1/1 test_inline_switch.test.using @typeInfo with runtime values...OK All 1 tests passed.
      - paragraph [ref=e3563]:
        - text: The
        - code [ref=e3564]: inline
        - text: "keyword may also be combined with ranges:"
      - figure "inline_prong_range.zig" [ref=e3565]:
        - generic [ref=e3566]: inline_prong_range.zig
        - code [ref=e3568]: "fn isFieldOptional(comptime T: type, field_index: usize) !bool { const field_types = @typeInfo(T).@\"struct\".field_types; return switch (field_index) { inline 0...field_types.len - 1 => |idx| @typeInfo(field_types[idx]) == .optional, else => return error.IndexOutOfBounds, }; }"
      - paragraph [ref=e3569]:
        - code [ref=e3570]: inline else
        - text: prongs can be used as a type safe alternative to
        - code [ref=e3571]: inline for
        - text: "loops:"
      - figure "test_inline_else.zig" [ref=e3572]:
        - generic [ref=e3573]: test_inline_else.zig
        - code [ref=e3575]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const SliceTypeA = extern struct { len: usize, ptr: [*]u32, }; const SliceTypeB = extern struct { ptr: [*]SliceTypeA, len: usize, }; const AnySlice = union(enum) { a: SliceTypeA, b: SliceTypeB, c: []const u8, d: []AnySlice, }; fn withFor(any: AnySlice) usize { const Tag = @typeInfo(AnySlice).@\"union\".tag_type.?; const info = @typeInfo(Tag).@\"enum\"; inline for (info.field_names, info.field_values) |field_name, field_value| { // With `inline for` the function gets generated as // a series of `if` statements relying on the optimizer // to convert it to a switch. if (field_value == @intFromEnum(any)) { return @field(any, field_name).len; } } // When using `inline for` the compiler doesn't know that every // possible case has been handled requiring an explicit `unreachable`. unreachable; } fn withSwitch(any: AnySlice) usize { return switch (any) { // With `inline else` the function is explicitly generated // as the desired switch and the compiler can check that // every possible case is handled. inline else => |slice| slice.len, }; } test \"inline for and inline else similarity\" { const any = AnySlice{ .c = \"hello\" }; try expectEqual(5, withFor(any)); try expectEqual(5, withSwitch(any)); }"
      - figure "Shell" [ref=e3576]:
        - generic [ref=e3577]: Shell
        - generic [ref=e3579]: $ zig test test_inline_else.zig 1/1 test_inline_else.test.inline for and inline else similarity...OK All 1 tests passed.
      - paragraph [ref=e3580]: When using an inline prong switching on an union an additional capture can be used to obtain the union's enum tag value at comptime, even though its payload might only be known at runtime.
      - figure "test_inline_switch_union_tag.zig" [ref=e3581]:
        - generic [ref=e3582]: test_inline_switch_union_tag.zig
        - code [ref=e3584]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const U = union(enum) { a: u32, b: f32, }; fn getNum(u: U) u32 { switch (u) { // Here `num` is a runtime-known value that is either // `u.a` or `u.b` and `tag` is `u`'s comptime-known tag value. inline else => |num, tag| { if (tag == .b) { return @intFromFloat(num); } return num; }, } } test \"test\" { const u = U{ .b = 42 }; try expectEqual(42, getNum(u)); }"
      - figure "Shell" [ref=e3585]:
        - generic [ref=e3586]: Shell
        - generic [ref=e3588]: $ zig test test_inline_switch_union_tag.zig 1/1 test_inline_switch_union_tag.test.test...OK All 1 tests passed.
