          - /url: "#toc-Optional-Pointers"
      - paragraph [ref=e4357]:
        - text: An optional pointer is guaranteed to be the same size as a pointer. The
        - code [ref=e4358]: "null"
        - text: of the optional is guaranteed to be address 0.
      - figure "test_optional_pointer.zig" [ref=e4359]:
        - generic [ref=e4360]: test_optional_pointer.zig
        - code [ref=e4362]: "const expectEqual = @import(\"std\").testing.expectEqual; test \"optional pointers\" { // Pointers cannot be null. If you want a null pointer, use the optional // prefix `?` to make the pointer type optional. var ptr: ?*i32 = null; var x: i32 = 1; ptr = &x; try expectEqual(1, ptr.?.*); // Optional pointers are the same size as normal pointers, because pointer // value 0 is used as the null value. try expectEqual(@sizeOf(?*i32), @sizeOf(*i32)); }"
      - figure "Shell" [ref=e4363]:
        - generic [ref=e4364]: Shell
        - generic [ref=e4366]: $ zig test test_optional_pointer.zig 1/1 test_optional_pointer.test.optional pointers...OK All 1 tests passed.
      - paragraph [ref=e4367]: "See also:"
      - list [ref=e4368]:
        - listitem [ref=e4369]:
          - link "while with Optionals" [ref=e4370] [cursor=pointer]:
