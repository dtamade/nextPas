      - code [ref=e6513]: "@setFloatMode(comptime mode: FloatMode) void"
      - paragraph [ref=e6514]: Changes the current scope's rules about how floating point operations are defined.
      - list [ref=e6515]:
        - listitem [ref=e6516]:
          - code [ref=e6517]: .strict
          - text: (default) - Floating point operations follow strict IEEE compliance.
        - listitem [ref=e6518]:
          - code [ref=e6519]: .optimized
          - text: "- Floating point operations may do all of the following:"
          - list [ref=e6520]:
            - listitem [ref=e6521]: Assume the arguments and result are not NaN. Optimizations are required to retain legal behavior over NaNs, but the value of the result is undefined.
            - listitem [ref=e6522]: Assume the arguments and result are not +/-Inf. Optimizations are required to retain legal behavior over +/-Inf, but the value of the result is undefined.
            - listitem [ref=e6523]: Treat the sign of a zero argument or result as insignificant.
            - listitem [ref=e6524]: Use the reciprocal of an argument rather than perform division.
            - listitem [ref=e6525]: Perform floating-point contraction (e.g. fusing a multiply followed by an addition into a fused multiply-add).
            - listitem [ref=e6526]: Perform algebraically equivalent transformations that may change results in floating point (e.g. reassociate).
          - text: This is equivalent to
          - code [ref=e6527]: "-ffast-math"
          - text: in GCC.
      - paragraph [ref=e6528]: The floating point mode is inherited by child scopes, and can be overridden in any scope. You can set the floating point mode in a struct or module scope by using a comptime block.
