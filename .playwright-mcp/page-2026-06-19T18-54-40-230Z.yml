      - paragraph [ref=e5068]: This is an error because the programmer attempted to pass a value only known at run-time to a function which expects a value known at compile-time.
      - paragraph [ref=e5069]:
        - text: Another way to get an error is if we pass a type that violates the type checker when the function is analyzed. This is what it means to have
