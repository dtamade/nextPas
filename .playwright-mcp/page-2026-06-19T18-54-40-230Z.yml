          - /url: "#toc-Single-Threaded-Builds"
      - paragraph [ref=e7213]: "Zig has a compile option -fsingle-threaded which has the following effects:"
      - list [ref=e7214]:
        - listitem [ref=e7215]:
          - text: All
          - link "Thread Local Variables" [ref=e7216] [cursor=pointer]:
            - /url: "#Thread-Local-Variables"
          - text: are treated as regular
          - link "Namespace Level Variables" [ref=e7217] [cursor=pointer]:
            - /url: "#Namespace-Level-Variables"
          - text: .
        - listitem [ref=e7218]:
          - text: The overhead of
          - link "Async Functions" [ref=e7219] [cursor=pointer]:
            - /url: "#Async-Functions"
          - text: becomes equivalent to function call overhead.
        - listitem [ref=e7220]:
          - text: The
          - code [ref=e7221]: "@import(\"builtin\").single_threaded"
          - text: becomes
          - code [ref=e7222]: "true"
          - text: and therefore various userland APIs which read this variable become more efficient. For example
          - code [ref=e7223]: std.Mutex
          - text: becomes an empty data structure and all of its functions become no-ops.
      - heading "Illegal Behavior" [level=2] [ref=e7224]:
        - link "Illegal Behavior" [ref=e7225] [cursor=pointer]:
          - /url: "#toc-Illegal-Behavior"
      - paragraph [ref=e7226]: Many operations in Zig trigger what is known as "Illegal Behavior" (IB). If Illegal Behavior is detected at compile-time, Zig emits a compile error and refuses to continue. Otherwise, when Illegal Behavior is not caught at compile-time, it falls into one of two categories.
      - paragraph [ref=e7227]:
        - text: Some Illegal Behavior is
        - emphasis [ref=e7228]: safety-checked
        - text: ": this means that the compiler will insert \"safety checks\" anywhere that the Illegal Behavior may occur at runtime, to determine whether it is about to happen. If it is, the safety check \"fails\", which triggers a panic."
      - paragraph [ref=e7229]:
        - text: All other Illegal Behavior is
        - emphasis [ref=e7230]: unchecked
        - text: ", meaning the compiler is unable to insert safety checks for it. If Unchecked Illegal Behavior is invoked at runtime, anything can happen: usually that will be some kind of crash, but the optimizer is free to make Unchecked Illegal Behavior do anything, such as calling arbitrary functions or clobbering arbitrary data. This is similar to the concept of \"undefined behavior\" in some other languages. Note that Unchecked Illegal Behavior still always results in a compile error if evaluated at"
        - link "comptime" [ref=e7231] [cursor=pointer]:
          - /url: "#comptime"
        - text: ", because the Zig compiler is able to perform more sophisticated checks at compile-time than at runtime."
      - paragraph [ref=e7232]:
        - text: Most Illegal Behavior is safety-checked. However, to facilitate optimizations, safety checks are disabled by default in the
        - link "ReleaseFast" [ref=e7233] [cursor=pointer]:
          - /url: "#ReleaseFast"
        - text: and
        - link "ReleaseSmall" [ref=e7234] [cursor=pointer]:
          - /url: "#ReleaseSmall"
        - text: optimization modes. Safety checks can also be enabled or disabled on a per-block basis, overriding the default for the current optimization mode, using
        - link "@setRuntimeSafety" [ref=e7235] [cursor=pointer]:
          - /url: "#setRuntimeSafety"
        - text: . When safety checks are disabled, Safety-Checked Illegal Behavior behaves like Unchecked Illegal Behavior; that is, any behavior may result from invoking it.
