            - 'rowheader "\\u{NNNNNN}" [ref=e1269]':
              - code [ref=e1270]: "\\u{NNNNNN}"
            - cell "hexadecimal Unicode scalar value UTF-8 encoded (1 or more digits)" [ref=e1271]
      - paragraph [ref=e1272]:
        - text: Note that the maximum valid Unicode scalar value is
        - code [ref=e1273]: "0x10ffff"
        - text: .
      - heading "Multiline String Literals" [level=4] [ref=e1274]:
        - link "Multiline String Literals" [ref=e1275] [cursor=pointer]:
          - /url: "#toc-Multiline-String-Literals"
      - paragraph [ref=e1276]:
        - text: Multiline string literals have no escapes and can span across multiple lines. To start a multiline string literal, use the
        - code [ref=e1277]: \\
        - text: token. Just like a comment, the string literal goes until the end of the line. The end of the line is not included in the string literal. However, if the next line begins with
        - code [ref=e1278]: \\
        - text: then a newline is appended and the string literal continues.
      - figure "multiline_string_literals.zig" [ref=e1279]:
        - generic [ref=e1280]: multiline_string_literals.zig
        - code [ref=e1282]: "const hello_world_in_c = \\\\#include <stdio.h> \\\\ \\\\int main(int argc, char **argv) { \\\\ printf(\"hello world\\n\"); \\\\ return 0; \\\\} ;"
      - paragraph [ref=e1283]: "See also:"
      - list [ref=e1284]:
        - listitem [ref=e1285]:
          - link "@embedFile" [ref=e1286] [cursor=pointer]:
            - /url: "#embedFile"
      - heading "Assignment" [level=3] [ref=e1287]:
        - link "Assignment" [ref=e1288] [cursor=pointer]:
          - /url: "#toc-Assignment"
      - paragraph [ref=e1289]:
        - text: Use the
        - code [ref=e1290]: const
        - text: "keyword to assign a value to an identifier:"
      - figure "constant_identifier_cannot_change.zig" [ref=e1291]:
        - generic [ref=e1292]: constant_identifier_cannot_change.zig
        - code [ref=e1294]: "const x = 1234; fn foo() void { // It works at file scope as well as inside functions. const y = 5678; // Once assigned, an identifier cannot be changed. y += 1; } pub fn main() void { foo(); }"
      - figure "Shell" [ref=e1295]:
        - generic [ref=e1296]: Shell
        - generic [ref=e1298]: "$ zig build-exe constant_identifier_cannot_change.zig /home/ci/work/zig-bootstrap/zig/doc/langref/constant_identifier_cannot_change.zig:8:5: error: cannot assign to constant y += 1; ^ referenced by: main: /home/ci/work/zig-bootstrap/zig/doc/langref/constant_identifier_cannot_change.zig:12:8 callMain [inlined]: /home/ci/work/zig-bootstrap/out/host/lib/zig/std/start.zig:739:64 callMainWithArgs [inlined]: /home/ci/work/zig-bootstrap/out/host/lib/zig/std/start.zig:680:20 posixCallMainAndExit: /home/ci/work/zig-bootstrap/out/host/lib/zig/std/start.zig:632:38 2 reference(s) hidden; use '-freference-trace=6' to see all references"
      - paragraph [ref=e1299]:
        - code [ref=e1300]: const
        - text: applies to all of the bytes that the identifier immediately addresses.
        - link "Pointers" [ref=e1301] [cursor=pointer]:
          - /url: "#Pointers"
        - text: have their own const-ness.
      - paragraph [ref=e1302]:
        - text: If you need a variable that you can modify, use the
        - code [ref=e1303]: var
        - text: "keyword:"
      - figure "mutable_var.zig" [ref=e1304]:
        - generic [ref=e1305]: mutable_var.zig
        - code [ref=e1307]: "const print = @import(\"std\").debug.print; pub fn main() void { var y: i32 = 5678; y += 1; print(\"{d}\", .{y}); }"
      - figure "Shell" [ref=e1308]:
        - generic [ref=e1309]: Shell
        - generic [ref=e1311]: $ zig build-exe mutable_var.zig $ ./mutable_var 5679
      - paragraph [ref=e1312]: "Variables must be initialized:"
      - figure "var_must_be_initialized.zig" [ref=e1313]:
        - generic [ref=e1314]: var_must_be_initialized.zig
        - code [ref=e1316]: "pub fn main() void { var x: i32; x = 1; }"
      - figure "Shell" [ref=e1317]:
        - generic [ref=e1318]: Shell
        - generic [ref=e1320]: "$ zig build-exe var_must_be_initialized.zig /home/ci/work/zig-bootstrap/zig/doc/langref/var_must_be_initialized.zig:2:15: error: expected '=', found ';' var x: i32; ^"
      - heading "undefined" [level=4] [ref=e1321]:
        - link "undefined" [ref=e1322] [cursor=pointer]:
          - /url: "#toc-undefined"
      - paragraph [ref=e1323]:
        - text: Use
        - code [ref=e1324]: undefined
        - text: "to leave variables uninitialized:"
      - figure "assign_undefined.zig" [ref=e1325]:
        - generic [ref=e1326]: assign_undefined.zig
        - code [ref=e1328]: "const print = @import(\"std\").debug.print; pub fn main() void { var x: i32 = undefined; x = 1; print(\"{d}\", .{x}); }"
      - figure "Shell" [ref=e1329]:
        - generic [ref=e1330]: Shell
        - generic [ref=e1332]: $ zig build-exe assign_undefined.zig $ ./assign_undefined 1
      - paragraph [ref=e1333]:
        - code [ref=e1334]: undefined
        - text: can be
        - link "coerced" [ref=e1335] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: to any type. Once this happens, it is no longer possible to detect that the value is
        - code [ref=e1336]: undefined
        - text: .
        - code [ref=e1337]: undefined
        - text: means the value could be anything, even something that is nonsense according to the type. Translated into English,
        - code [ref=e1338]: undefined
        - text: means "Not a meaningful value. Using this value would be a bug. The value will be unused, or overwritten before being used."
      - paragraph [ref=e1339]:
        - text: In
        - link "Debug" [ref=e1340] [cursor=pointer]:
          - /url: "#Debug"
        - text: and
        - link "ReleaseSafe" [ref=e1341] [cursor=pointer]:
          - /url: "#ReleaseSafe"
        - text: mode, Zig writes
        - code [ref=e1342]: "0xaa"
        - text: bytes to undefined memory. This is to catch bugs early, and to help detect use of undefined memory in a debugger. However, this behavior is only an implementation feature, not a language semantic, so it is not guaranteed to be observable to code.
      - heading "Destructuring" [level=4] [ref=e1343]:
        - link "Destructuring" [ref=e1344] [cursor=pointer]:
          - /url: "#toc-Destructuring"
      - paragraph [ref=e1345]:
        - text: A destructuring assignment can separate elements of indexable aggregate types (
        - link "Tuples" [ref=e1346] [cursor=pointer]:
          - /url: "#Tuples"
        - text: ","
        - link "Arrays" [ref=e1347] [cursor=pointer]:
          - /url: "#Arrays"
        - text: ","
        - link "Vectors" [ref=e1348] [cursor=pointer]:
          - /url: "#Vectors"
        - text: "):"
      - figure "destructuring_to_existing.zig" [ref=e1349]:
        - generic [ref=e1350]: destructuring_to_existing.zig
        - code [ref=e1352]: "const print = @import(\"std\").debug.print; pub fn main() void { var x: u32 = undefined; var y: u32 = undefined; var z: u32 = undefined; const tuple = .{ 1, 2, 3 }; x, y, z = tuple; print(\"tuple: x = {}, y = {}, z = {}\\n\", .{x, y, z}); const array = [_]u32{ 4, 5, 6 }; x, y, z = array; print(\"array: x = {}, y = {}, z = {}\\n\", .{x, y, z}); const vector: @Vector(3, u32) = .{ 7, 8, 9 }; x, y, z = vector; print(\"vector: x = {}, y = {}, z = {}\\n\", .{x, y, z}); }"
      - figure "Shell" [ref=e1353]:
        - generic [ref=e1354]: Shell
        - generic [ref=e1356]: "$ zig build-exe destructuring_to_existing.zig $ ./destructuring_to_existing tuple: x = 1, y = 2, z = 3 array: x = 4, y = 5, z = 6 vector: x = 7, y = 8, z = 9"
      - paragraph [ref=e1357]:
        - text: A destructuring expression may only appear within a block (i.e. not at
        - link "Namespace" [ref=e1358] [cursor=pointer]:
          - /url: "#Namespace"
        - text: scope). The left hand side of the assignment must consist of a comma separated list, each element of which may be either an lvalue (for instance, an existing
        - code [ref=e1359]: var
        - text: ") or a variable declaration:"
      - figure "destructuring_mixed.zig" [ref=e1360]:
        - generic [ref=e1361]: destructuring_mixed.zig
        - code [ref=e1363]: "const print = @import(\"std\").debug.print; pub fn main() void { var x: u32 = undefined; const tuple = .{ 1, 2, 3 }; x, var y : u32, const z = tuple; print(\"x = {}, y = {}, z = {}\\n\", .{x, y, z}); // y is mutable y = 100; // You can use _ to throw away unwanted values. _, x, _ = tuple; print(\"x = {}\\n\", .{x}); }"
      - figure "Shell" [ref=e1364]:
        - generic [ref=e1365]: Shell
        - generic [ref=e1367]: $ zig build-exe destructuring_mixed.zig $ ./destructuring_mixed x = 1, y = 2, z = 3 x = 2
      - paragraph [ref=e1368]:
        - text: A destructure may be prefixed with the
        - code [ref=e1369]: comptime
        - text: keyword, in which case the entire destructure expression is evaluated at
