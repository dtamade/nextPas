        - text: If well-defined in-memory layout is not required,
        - link "struct" [ref=e2938] [cursor=pointer]:
          - /url: "#struct"
        - text: is a better choice because it places fewer restrictions on the compiler.
      - paragraph [ref=e2939]:
        - text: See
        - link "packed struct" [ref=e2940] [cursor=pointer]:
          - /url: "#packed-struct"
        - text: for a struct that has the ABI of its backing integer, which can be useful for modeling flags.
      - paragraph [ref=e2941]: "See also:"
      - list [ref=e2942]:
        - listitem [ref=e2943]:
          - link "extern union" [ref=e2944] [cursor=pointer]:
            - /url: "#extern-union"
        - listitem [ref=e2945]:
          - link "extern enum" [ref=e2946] [cursor=pointer]:
            - /url: "#extern-enum"
      - heading "packed struct" [level=3] [ref=e2947]:
        - link "packed struct" [ref=e2948] [cursor=pointer]:
          - /url: "#toc-packed-struct"
      - paragraph [ref=e2949]:
        - code [ref=e2950]: packed
        - text: structs, like
        - code [ref=e2951]: enum
        - text: ", are based on the concept of interpreting integers differently. All packed structs have a"
        - strong [ref=e2952]: backing integer
        - text: ", which is implicitly determined by the total bit count of fields, or explicitly specified. Packed structs have well-defined memory layout - exactly the same ABI as their backing integer."
      - paragraph [ref=e2953]: "Each field of a packed struct is interpreted as a logical sequence of bits, arranged from least to most significant. Allowed field types:"
      - list [ref=e2954]:
        - listitem [ref=e2955]:
          - text: An
          - link "integer" [ref=e2956] [cursor=pointer]:
            - /url: "#Integers"
          - text: field uses exactly as many bits as its bit width. For example, a
          - code [ref=e2957]: u5
          - text: will use 5 bits of the backing integer.
        - listitem [ref=e2958]:
          - text: A
          - link "bool" [ref=e2959] [cursor=pointer]:
            - /url: "#Primitive-Types"
          - text: field uses exactly 1 bit.
        - listitem [ref=e2960]:
          - text: An
          - link "enum" [ref=e2961] [cursor=pointer]:
            - /url: "#enum"
          - text: field uses exactly the bit width of its integer tag type.
        - listitem [ref=e2962]:
          - text: A
          - link "packed union" [ref=e2963] [cursor=pointer]:
            - /url: "#packed-union"
          - text: field uses exactly the bit width of the union field with the largest bit width.
        - listitem [ref=e2964]:
          - text: A
          - code [ref=e2965]: packed struct
          - text: field uses the bits of its backing integer.
      - paragraph [ref=e2966]:
        - text: This means that a
        - code [ref=e2967]: packed struct
        - text: can participate in a
        - link "@bitCast" [ref=e2968] [cursor=pointer]:
          - /url: "#bitCast"
        - text: or a
        - link "@ptrCast" [ref=e2969] [cursor=pointer]:
          - /url: "#ptrCast"
        - text: to reinterpret memory. This even works at
        - link "comptime" [ref=e2970] [cursor=pointer]:
          - /url: "#comptime"
        - text: ":"
      - figure "test_packed_structs.zig" [ref=e2971]:
        - generic [ref=e2972]: test_packed_structs.zig
        - code [ref=e2974]: "const std = @import(\"std\"); const native_endian = @import(\"builtin\").target.cpu.arch.endian(); const expectEqual = std.testing.expectEqual; const Full = packed struct { number: u16, }; const Divided = packed struct { half1: u8, quarter3: u4, quarter4: u4, }; test \"@bitCast between packed structs\" { try doTheTest(); try comptime doTheTest(); } fn doTheTest() !void { try expectEqual(2, @sizeOf(Full)); try expectEqual(2, @sizeOf(Divided)); const full = Full{ .number = 0x1234 }; const divided: Divided = @bitCast(full); try expectEqual(0x34, divided.half1); try expectEqual(0x2, divided.quarter3); try expectEqual(0x1, divided.quarter4); const ordered: [2]u8 = @bitCast(full); switch (native_endian) { .big => { try expectEqual(0x12, ordered[0]); try expectEqual(0x34, ordered[1]); }, .little => { try expectEqual(0x34, ordered[0]); try expectEqual(0x12, ordered[1]); }, } }"
      - figure "Shell" [ref=e2975]:
        - generic [ref=e2976]: Shell
        - generic [ref=e2978]: $ zig test test_packed_structs.zig 1/1 test_packed_structs.test.@bitCast between packed structs...OK All 1 tests passed.
      - paragraph [ref=e2979]: "The backing integer can be inferred or explicitly provided. When inferred, it will be unsigned. When explicitly provided, its bit width will be enforced at compile time to exactly match the total bit width of the fields:"
      - figure "test_missized_packed_struct.zig" [ref=e2980]:
        - generic [ref=e2981]: test_missized_packed_struct.zig
        - code [ref=e2983]: "test \"missized packed struct\" { const S = packed struct(u32) { a: u16, b: u8 }; _ = S{ .a = 4, .b = 2 }; }"
      - figure "Shell" [ref=e2984]:
        - generic [ref=e2985]: Shell
        - generic [ref=e2987]: "$ zig test test_missized_packed_struct.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_missized_packed_struct.zig:2:22: error: backing integer bit width does not match total bit width of fields const S = packed struct(u32) { a: u16, b: u8 }; ~~~~~~~^~~~~~~~~~~~~~~~~~~~~~~~~~~~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_missized_packed_struct.zig:2:29: note: backing integer 'u32' has bit width '32' const S = packed struct(u32) { a: u16, b: u8 }; ^~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_missized_packed_struct.zig:2:22: note: struct fields have total bit width '24' referenced by: test.missized packed struct: /home/ci/work/zig-bootstrap/zig/doc/langref/test_missized_packed_struct.zig:3:17"
      - paragraph [ref=e2988]: "Zig allows the address to be taken of a non-byte-aligned field:"
      - figure "test_pointer_to_non-byte_aligned_field.zig" [ref=e2989]:
        - generic [ref=e2990]: test_pointer_to_non-byte_aligned_field.zig
        - code [ref=e2992]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const BitField = packed struct { a: u3, b: u3, c: u2, }; var foo = BitField{ .a = 1, .b = 2, .c = 3, }; test \"pointer to non-byte-aligned field\" { const ptr = &foo.b; try expectEqual(2, ptr.*); }"
      - figure "Shell" [ref=e2993]:
        - generic [ref=e2994]: Shell
        - generic [ref=e2996]: $ zig test test_pointer_to_non-byte_aligned_field.zig 1/1 test_pointer_to_non-byte_aligned_field.test.pointer to non-byte-aligned field...OK All 1 tests passed.
      - paragraph [ref=e2997]: "However, the pointer to a non-byte-aligned field has special properties and cannot be passed when a normal pointer is expected:"
      - figure "test_misaligned_pointer.zig" [ref=e2998]:
        - generic [ref=e2999]: test_misaligned_pointer.zig
        - code [ref=e3001]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const BitField = packed struct { a: u3, b: u3, c: u2, }; var bit_field = BitField{ .a = 1, .b = 2, .c = 3, }; test \"pointer to non-byte-aligned field\" { try expectEqual(2, bar(&bit_field.b)); } fn bar(x: *const u3) u3 { return x.*; }"
      - figure "Shell" [ref=e3002]:
        - generic [ref=e3003]: Shell
        - generic [ref=e3005]: "$ zig test test_misaligned_pointer.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_misaligned_pointer.zig:17:28: error: expected type '*const u3', found '*align(1:3:1) u3' try expectEqual(2, bar(&bit_field.b)); ^~~~~~~~~~~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_misaligned_pointer.zig:17:28: note: pointer host size '1' cannot cast into pointer host size '0' /home/ci/work/zig-bootstrap/zig/doc/langref/test_misaligned_pointer.zig:17:28: note: pointer bit offset '3' cannot cast into pointer bit offset '0' /home/ci/work/zig-bootstrap/zig/doc/langref/test_misaligned_pointer.zig:20:11: note: parameter type declared here fn bar(x: *const u3) u3 { ^~~~~~~~~"
      - paragraph [ref=e3006]:
        - text: In this case, the function
        - code [ref=e3007]: bar
        - text: cannot be called because the pointer to the non-ABI-aligned field mentions the bit offset, but the function expects an ABI-aligned pointer.
      - paragraph [ref=e3008]: "Pointers to non-ABI-aligned fields share the same address as the other fields within their host integer:"
      - figure "test_packed_struct_field_address.zig" [ref=e3009]:
        - generic [ref=e3010]: test_packed_struct_field_address.zig
        - code [ref=e3012]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const BitField = packed struct { a: u3, b: u3, c: u2, }; var bit_field = BitField{ .a = 1, .b = 2, .c = 3, }; test \"pointers of sub-byte-aligned fields share addresses\" { try expectEqual(@intFromPtr(&bit_field.a), @intFromPtr(&bit_field.b)); try expectEqual(@intFromPtr(&bit_field.a), @intFromPtr(&bit_field.c)); }"
      - figure "Shell" [ref=e3013]:
        - generic [ref=e3014]: Shell
        - generic [ref=e3016]: $ zig test test_packed_struct_field_address.zig 1/1 test_packed_struct_field_address.test.pointers of sub-byte-aligned fields share addresses...OK All 1 tests passed.
      - paragraph [ref=e3017]:
        - text: This can be observed with
        - link "@bitOffsetOf" [ref=e3018] [cursor=pointer]:
          - /url: "#bitOffsetOf"
        - text: and
        - link "offsetOf" [ref=e3019] [cursor=pointer]:
          - /url: "#offsetOf"
        - text: ":"
      - figure "test_bitOffsetOf_offsetOf.zig" [ref=e3020]:
        - generic [ref=e3021]: test_bitOffsetOf_offsetOf.zig
        - code [ref=e3023]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const BitField = packed struct { a: u3, b: u3, c: u2, }; test \"offsets of non-byte-aligned fields\" { comptime { try expectEqual(0, @bitOffsetOf(BitField, \"a\")); try expectEqual(3, @bitOffsetOf(BitField, \"b\")); try expectEqual(6, @bitOffsetOf(BitField, \"c\")); try expectEqual(0, @offsetOf(BitField, \"a\")); try expectEqual(0, @offsetOf(BitField, \"b\")); try expectEqual(0, @offsetOf(BitField, \"c\")); } }"
      - figure "Shell" [ref=e3024]:
        - generic [ref=e3025]: Shell
        - generic [ref=e3027]: $ zig test test_bitOffsetOf_offsetOf.zig 1/1 test_bitOffsetOf_offsetOf.test.offsets of non-byte-aligned fields...OK All 1 tests passed.
      - paragraph [ref=e3028]: "Packed structs have the same alignment as their backing integer, however, overaligned pointers to packed structs can override this:"
      - figure "test_overaligned_packed_struct.zig" [ref=e3029]:
        - generic [ref=e3030]: test_overaligned_packed_struct.zig
        - code [ref=e3032]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const S = packed struct { a: u32, b: u32, }; test \"overaligned pointer to packed struct\" { var foo: S align(4) = .{ .a = 1, .b = 2 }; const ptr: *align(4) S = &foo; const ptr_to_b = &ptr.b; try expectEqual(2, ptr_to_b.*); }"
      - figure "Shell" [ref=e3033]:
        - generic [ref=e3034]: Shell
        - generic [ref=e3036]: $ zig test test_overaligned_packed_struct.zig 1/1 test_overaligned_packed_struct.test.overaligned pointer to packed struct...OK All 1 tests passed.
      - paragraph [ref=e3037]: "It's also possible to set alignment of struct fields:"
      - figure "test_aligned_struct_fields.zig" [ref=e3038]:
        - generic [ref=e3039]: test_aligned_struct_fields.zig
        - code [ref=e3041]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"aligned struct fields\" { const S = struct { a: u32 align(2), b: u32 align(64), }; var foo = S{ .a = 1, .b = 2 }; try expectEqual(64, @alignOf(S)); try expectEqual(*align(2) u32, @TypeOf(&foo.a)); try expectEqual(*align(64) u32, @TypeOf(&foo.b)); }"
      - figure "Shell" [ref=e3042]:
        - generic [ref=e3043]: Shell
        - generic [ref=e3045]: $ zig test test_aligned_struct_fields.zig 1/1 test_aligned_struct_fields.test.aligned struct fields...OK All 1 tests passed.
      - paragraph [ref=e3046]:
        - text: Equating packed structs results in a comparison of the backing integer, and only works for the
        - code [ref=e3047]: ==
        - text: and
        - code [ref=e3048]: "!="
        - link "Operators" [ref=e3049] [cursor=pointer]:
          - /url: "#Operators"
        - text: .
      - figure "test_packed_struct_equality.zig" [ref=e3050]:
        - generic [ref=e3051]: test_packed_struct_equality.zig
        - code [ref=e3053]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"packed struct equality\" { const S = packed struct { a: u4, b: u4, }; const x: S = .{ .a = 1, .b = 2 }; const y: S = .{ .b = 2, .a = 1 }; try expectEqual(x, y); }"
      - figure "Shell" [ref=e3054]:
        - generic [ref=e3055]: Shell
        - generic [ref=e3057]: $ zig test test_packed_struct_equality.zig 1/1 test_packed_struct_equality.test.packed struct equality...OK All 1 tests passed.
      - paragraph [ref=e3058]:
        - text: Field access and assignment can be understood as shorthand for bitshifts on the backing integer. These operations are not
        - link "atomic" [ref=e3059] [cursor=pointer]:
          - /url: "#Atomics"
        - text: ", so beware using field access syntax when combined with memory-mapped input-output (MMIO). Instead of field access on"
        - link "volatile" [ref=e3060] [cursor=pointer]:
          - /url: "#volatile"
        - link "Pointers" [ref=e3061] [cursor=pointer]:
          - /url: "#Pointers"
        - text: ", construct a fully-formed new value first, then write that value to the volatile pointer."
      - figure "packed_struct_mmio.zig" [ref=e3062]:
        - generic [ref=e3063]: packed_struct_mmio.zig
        - code [ref=e3065]: "pub const GpioRegister = packed struct(u8) { GPIO0: bool, GPIO1: bool, GPIO2: bool, GPIO3: bool, reserved: u4 = 0, }; const gpio: *volatile GpioRegister = @ptrFromInt(0x0123); pub fn writeToGpio(new_states: GpioRegister) void { // Example of what not to do: // BAD! gpio.GPIO0 = true; BAD! // Instead, do this: gpio.* = new_states; }"
      - heading "Struct Naming" [level=3] [ref=e3066]:
        - link "Struct Naming" [ref=e3067] [cursor=pointer]:
          - /url: "#toc-Struct-Naming"
      - paragraph [ref=e3068]: Since all structs are anonymous, Zig infers the type name based on a few rules.
      - list [ref=e3069]:
        - listitem [ref=e3070]: If the struct is in the initialization expression of a variable, it gets named after that variable.
        - listitem [ref=e3071]:
          - text: If the struct is in the
          - code [ref=e3072]: return
          - text: expression, it gets named after the function it is returning from, with the parameter values serialized.
        - listitem [ref=e3073]:
          - text: Otherwise, the struct gets a name such as
          - code [ref=e3074]: (filename.funcname__struct_ID)
          - text: .
        - listitem [ref=e3075]: If the struct is declared inside another struct, it gets named after both the parent struct and the name inferred by the previous rules, separated by a dot.
      - figure "struct_name.zig" [ref=e3076]:
        - generic [ref=e3077]: struct_name.zig
        - code [ref=e3079]: "const std = @import(\"std\"); pub fn main() void { const Foo = struct {}; std.debug.print(\"variable: {s}\\n\", .{@typeName(Foo)}); std.debug.print(\"anonymous: {s}\\n\", .{@typeName(struct {})}); std.debug.print(\"function: {s}\\n\", .{@typeName(List(i32))}); } fn List(comptime T: type) type { return struct { x: T, }; }"
      - figure "Shell" [ref=e3080]:
        - generic [ref=e3081]: Shell
        - generic [ref=e3083]: "$ zig build-exe struct_name.zig $ ./struct_name variable: struct_name.main.Foo anonymous: struct_name.main__struct_32058 function: struct_name.List(i32)"
      - heading "Anonymous Struct Literals" [level=3] [ref=e3084]:
        - link "Anonymous Struct Literals" [ref=e3085] [cursor=pointer]:
          - /url: "#toc-Anonymous-Struct-Literals"
      - paragraph [ref=e3086]:
        - text: Zig allows omitting the struct type of a literal. When the result is
        - link "coerced" [ref=e3087] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: ", the struct literal will directly instantiate the"
        - link "result location" [ref=e3088] [cursor=pointer]:
          - /url: "#Result-Location-Semantics"
        - text: ", with no copy:"
      - figure "test_struct_result.zig" [ref=e3089]:
        - generic [ref=e3090]: test_struct_result.zig
        - code [ref=e3092]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const Point = struct { x: i32, y: i32 }; test \"anonymous struct literal\" { const pt: Point = .{ .x = 13, .y = 67, }; try expectEqual(13, pt.x); try expectEqual(67, pt.y); }"
      - figure "Shell" [ref=e3093]:
        - generic [ref=e3094]: Shell
        - generic [ref=e3096]: $ zig test test_struct_result.zig 1/1 test_struct_result.test.anonymous struct literal...OK All 1 tests passed.
      - paragraph [ref=e3097]:
        - text: The struct type can be inferred. Here the
        - link "result location" [ref=e3098] [cursor=pointer]:
          - /url: "#Result-Location-Semantics"
        - text: "does not include a type, and so Zig infers the type:"
      - figure "test_anonymous_struct.zig" [ref=e3099]:
        - generic [ref=e3100]: test_anonymous_struct.zig
        - code [ref=e3102]: "const std = @import(\"std\"); const expect = std.testing.expect; const expectEqual = std.testing.expectEqual; test \"fully anonymous struct\" { try check(.{ .int = @as(u32, 1234), .float = @as(f64, 12.34), .b = true, .s = \"hi\", }); } fn check(args: anytype) !void { try expectEqual(1234, args.int); try expectEqual(12.34, args.float); try expect(args.b); try expectEqual('h', args.s[0]); try expectEqual('i', args.s[1]); }"
      - figure "Shell" [ref=e3103]:
        - generic [ref=e3104]: Shell
        - generic [ref=e3106]: $ zig test test_anonymous_struct.zig 1/1 test_anonymous_struct.test.fully anonymous struct...OK All 1 tests passed.
      - heading "Tuples" [level=3] [ref=e3107]:
        - link "Tuples" [ref=e3108] [cursor=pointer]:
          - /url: "#toc-Tuples"
      - paragraph [ref=e3109]:
        - text: Anonymous structs can be created without specifying field names, and are referred to as "tuples". An empty tuple looks like
        - code [ref=e3110]: ".{}"
        - text: and can be seen in one of the
        - link "Hello World examples" [ref=e3111] [cursor=pointer]:
          - /url: "#Hello-World"
        - text: .
      - paragraph [ref=e3112]:
        - text: The fields are implicitly named using numbers starting from 0. Because their names are integers, they cannot be accessed with
        - code [ref=e3113]: .
        - text: syntax without also wrapping them in
        - code [ref=e3114]: "@\"\""
        - text: . Names inside
        - code [ref=e3115]: "@\"\""
        - text: are always recognised as
        - link "identifiers" [ref=e3116] [cursor=pointer]:
          - /url: "#Identifiers"
        - text: .
      - paragraph [ref=e3117]:
        - text: Like arrays, tuples have a .len field, can be indexed (provided the index is comptime-known) and work with the ++ operator. They can also be iterated over with
        - link "inline for" [ref=e3118] [cursor=pointer]:
          - /url: "#inline-for"
        - text: .
      - figure "test_tuples.zig" [ref=e3119]:
        - generic [ref=e3120]: test_tuples.zig
        - code [ref=e3122]: "const std = @import(\"std\"); const expect = std.testing.expect; const expectEqual = std.testing.expectEqual; test \"tuple\" { const values = .{ @as(u32, 1234), @as(f64, 12.34), true, \"hi\", } ++ .{ false, false }; try expectEqual(1234, values[0]); try expectEqual(false, values[4]); inline for (values, 0..) |v, i| { if (i != 2) continue; try expect(v); } try expectEqual(6, values.len); try expectEqual('h', values.@\"3\"[0]); }"
      - figure "Shell" [ref=e3123]:
        - generic [ref=e3124]: Shell
        - generic [ref=e3126]: $ zig test test_tuples.zig 1/1 test_tuples.test.tuple...OK All 1 tests passed.
      - heading "Destructuring Tuples" [level=4] [ref=e3127]:
        - link "Destructuring Tuples" [ref=e3128] [cursor=pointer]:
          - /url: "#toc-Destructuring-Tuples"
      - paragraph [ref=e3129]:
        - text: Tuples can be
        - link "destructured" [ref=e3130] [cursor=pointer]:
          - /url: "#Destructuring"
        - text: .
      - paragraph [ref=e3131]: "Tuple destructuring is helpful for returning multiple values from a block:"
      - figure "destructuring_block.zig" [ref=e3132]:
        - generic [ref=e3133]: destructuring_block.zig
        - code [ref=e3135]: "const print = @import(\"std\").debug.print; pub fn main() void { const digits = [_]i8 { 3, 8, 9, 0, 7, 4, 1 }; const min, const max = blk: { var min: i8 = 127; var max: i8 = -128; for (digits) |digit| { if (digit < min) min = digit; if (digit > max) max = digit; } break :blk .{ min, max }; }; print(\"min = {}\\n\", .{ min }); print(\"max = {}\\n\", .{ max }); }"
      - figure "Shell" [ref=e3136]:
        - generic [ref=e3137]: Shell
        - generic [ref=e3139]: $ zig build-exe destructuring_block.zig $ ./destructuring_block min = 0 max = 9
      - paragraph [ref=e3140]: "Tuple destructuring is helpful for dealing with functions and built-ins that return multiple values as a tuple:"
      - figure "destructuring_return_value.zig" [ref=e3141]:
        - generic [ref=e3142]: destructuring_return_value.zig
        - code [ref=e3144]: "const print = @import(\"std\").debug.print; fn divmod(numerator: u32, denominator: u32) struct { u32, u32 } { return .{ numerator / denominator, numerator % denominator }; } pub fn main() void { const div, const mod = divmod(10, 3); print(\"10 / 3 = {}\\n\", .{div}); print(\"10 % 3 = {}\\n\", .{mod}); }"
      - figure "Shell" [ref=e3145]:
        - generic [ref=e3146]: Shell
        - generic [ref=e3148]: $ zig build-exe destructuring_return_value.zig $ ./destructuring_return_value 10 / 3 = 3 10 % 3 = 1
      - paragraph [ref=e3149]: "See also:"
      - list [ref=e3150]:
        - listitem [ref=e3151]:
          - link "Destructuring" [ref=e3152] [cursor=pointer]:
            - /url: "#Destructuring"
        - listitem [ref=e3153]:
          - link "Destructuring Arrays" [ref=e3154] [cursor=pointer]:
            - /url: "#Destructuring-Arrays"
        - listitem [ref=e3155]:
          - link "Destructuring Vectors" [ref=e3156] [cursor=pointer]:
            - /url: "#Destructuring-Vectors"
      - paragraph [ref=e3157]: "See also:"
      - list [ref=e3158]:
        - listitem [ref=e3159]:
          - link "comptime" [ref=e3160] [cursor=pointer]:
            - /url: "#comptime"
        - listitem [ref=e3161]:
          - link "@fieldParentPtr" [ref=e3162] [cursor=pointer]:
            - /url: "#fieldParentPtr"
      - heading "enum" [level=2] [ref=e3163]:
        - link "enum" [ref=e3164] [cursor=pointer]:
          - /url: "#toc-enum"
