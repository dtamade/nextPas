        - generic [ref=e3450]: test_switch_tagged_union.zig
        - code [ref=e3452]: "const expectEqual = @import(\"std\").testing.expectEqual; test \"switch on tagged union\" { const Point = struct { x: u8, y: u8, }; const Item = union(enum) { a: u32, c: Point, d, e: u32, }; var a = Item{ .c = Point{ .x = 1, .y = 2 } }; // Switching on more complex enums is allowed. const b = switch (a) { // A capture group is allowed on a match, and will return the enum // value matched. If the payload types of both cases are the same // they can be put into the same switch prong. Item.a, Item.e => |item| item, // A reference to the matched value can be obtained using `*` syntax. Item.c => |*item| blk: { item.*.x += 1; break :blk 6; }, // No else is required if the types cases was exhaustively handled Item.d => 8, }; try expectEqual(6, b); try expectEqual(2, a.c.x); }"
