      - heading "Relationship with Arrays" [level=3] [ref=e2564]:
        - link "Relationship with Arrays" [ref=e2565] [cursor=pointer]:
          - /url: "#toc-Relationship-with-Arrays"
      - paragraph [ref=e2566]:
        - text: Vectors and
        - link "Arrays" [ref=e2567] [cursor=pointer]:
          - /url: "#Arrays"
        - text: each have a well-defined
        - strong [ref=e2568]: bit layout
        - text: and therefore support
        - link "@bitCast" [ref=e2569] [cursor=pointer]:
          - /url: "#bitCast"
        - text: between each other.
        - link "Type Coercion" [ref=e2570] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: implicitly peforms
        - code [ref=e2571]: "@bitCast"
        - text: .
      - paragraph [ref=e2572]:
        - text: Arrays have well-defined byte layout, but vectors do not, making
        - link "@ptrCast" [ref=e2573] [cursor=pointer]:
          - /url: "#ptrCast"
        - text: between them
        - link "Illegal Behavior" [ref=e2574] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: .
      - heading "Destructuring Vectors" [level=3] [ref=e2575]:
        - link "Destructuring Vectors" [ref=e2576] [cursor=pointer]:
          - /url: "#toc-Destructuring-Vectors"
      - paragraph [ref=e2577]: "Vectors can be destructured:"
      - figure "destructuring_vectors.zig" [ref=e2578]:
        - generic [ref=e2579]: destructuring_vectors.zig
        - code [ref=e2581]: "const print = @import(\"std\").debug.print; // emulate punpckldq pub fn unpack(x: @Vector(4, f32), y: @Vector(4, f32)) @Vector(4, f32) { const a, const c, _, _ = x; const b, const d, _, _ = y; return .{ a, b, c, d }; } pub fn main() void { const x: @Vector(4, f32) = .{ 1.0, 2.0, 3.0, 4.0 }; const y: @Vector(4, f32) = .{ 5.0, 6.0, 7.0, 8.0 }; print(\"{}\", .{unpack(x, y)}); }"
      - figure "Shell" [ref=e2582]:
        - generic [ref=e2583]: Shell
        - generic [ref=e2585]: "$ zig build-exe destructuring_vectors.zig $ ./destructuring_vectors { 1, 5, 2, 6 }"
      - paragraph [ref=e2586]: "See also:"
      - list [ref=e2587]:
        - listitem [ref=e2588]:
          - link "Destructuring" [ref=e2589] [cursor=pointer]:
            - /url: "#Destructuring"
        - listitem [ref=e2590]:
          - link "Destructuring Tuples" [ref=e2591] [cursor=pointer]:
            - /url: "#Destructuring-Tuples"
        - listitem [ref=e2592]:
