          - /url: "#toc-Casting"
      - paragraph [ref=e4375]:
        - text: A
        - strong [ref=e4376]: type cast
        - text: converts a value of one type to another. Zig has
        - link "Type Coercion" [ref=e4377] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: for conversions that are known to be completely safe and unambiguous, and
        - link "Explicit Casts" [ref=e4378] [cursor=pointer]:
          - /url: "#Explicit-Casts"
        - text: for conversions that one would not want to happen on accident. There is also a third kind of type conversion called
        - link "Peer Type Resolution" [ref=e4379] [cursor=pointer]:
          - /url: "#Peer-Type-Resolution"
        - text: for the case when a result type must be decided given multiple operand types.
