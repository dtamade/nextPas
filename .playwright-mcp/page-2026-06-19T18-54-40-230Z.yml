      - heading "Memory" [level=2] [ref=e7781]:
        - link "Memory" [ref=e7782] [cursor=pointer]:
          - /url: "#toc-Memory"
      - paragraph [ref=e7783]: "The Zig language performs no memory management on behalf of the programmer. This is why Zig has no runtime, and why Zig code works seamlessly in so many environments, including real-time software, operating system kernels, embedded devices, and low latency servers. As a consequence, Zig programmers must always be able to answer the question:"
      - paragraph [ref=e7784]:
        - link "Where are the bytes?" [ref=e7785] [cursor=pointer]:
          - /url: "#Where-are-the-bytes"
      - paragraph [ref=e7786]:
        - text: Like Zig, the C programming language has manual memory management. However, unlike Zig, C has a default allocator -
        - code [ref=e7787]: malloc
        - text: ","
        - code [ref=e7788]: realloc
        - text: ", and"
        - code [ref=e7789]: free
        - text: . When linking against libc, Zig exposes this allocator with
        - code [ref=e7790]: std.heap.c_allocator
        - text: . However, by convention, there is no default allocator in Zig. Instead, functions which need to allocate accept an
        - code [ref=e7791]: Allocator
        - text: parameter. Likewise, some data structures accept an
        - code [ref=e7792]: Allocator
        - text: "parameter in their initialization functions:"
      - figure "test_allocator.zig" [ref=e7793]:
        - generic [ref=e7794]: test_allocator.zig
        - code [ref=e7796]: "const std = @import(\"std\"); const Allocator = std.mem.Allocator; const expectEqualStrings = std.testing.expectEqualStrings; test \"using an allocator\" { var buffer: [100]u8 = undefined; var fba = std.heap.FixedBufferAllocator.init(&buffer); const allocator = fba.allocator(); const result = try concat(allocator, \"foo\", \"bar\"); try expectEqualStrings(\"foobar\", result); } fn concat(allocator: Allocator, a: []const u8, b: []const u8) ![]u8 { const result = try allocator.alloc(u8, a.len + b.len); @memcpy(result[0..a.len], a); @memcpy(result[a.len..], b); return result; }"
      - figure "Shell" [ref=e7797]:
        - generic [ref=e7798]: Shell
        - generic [ref=e7800]: $ zig test test_allocator.zig 1/1 test_allocator.test.using an allocator...OK All 1 tests passed.
      - paragraph [ref=e7801]:
        - text: In the above example, 100 bytes of stack memory are used to initialize a
        - code [ref=e7802]: FixedBufferAllocator
        - text: ", which is then passed to a function. As a convenience there is a global"
        - code [ref=e7803]: FixedBufferAllocator
        - text: available for quick tests at
        - code [ref=e7804]: std.testing.allocator
        - text: ", which will also perform basic leak detection."
      - paragraph [ref=e7805]:
        - text: Zig has a general purpose allocator available to be imported with
        - code [ref=e7806]: std.heap.DebugAllocator
        - text: . However, it is still recommended to follow the
        - link "Choosing an Allocator" [ref=e7807] [cursor=pointer]:
          - /url: "#Choosing-an-Allocator"
        - text: guide.
      - heading "Choosing an Allocator" [level=3] [ref=e7808]:
        - link "Choosing an Allocator" [ref=e7809] [cursor=pointer]:
          - /url: "#toc-Choosing-an-Allocator"
      - paragraph [ref=e7810]: "What allocator to use depends on a number of factors. Here is a flow chart to help you decide:"
      - list [ref=e7811]:
        - listitem [ref=e7812]:
          - text: Are you making a library? In this case, best to accept an
          - code [ref=e7813]: Allocator
          - text: as a parameter and allow your library's users to decide what allocator to use.
        - listitem [ref=e7814]:
          - text: Are you linking libc? In this case,
          - code [ref=e7815]: std.heap.c_allocator
          - text: is likely the right choice, at least for your main allocator.
        - listitem [ref=e7816]:
          - text: Is the maximum number of bytes that you will need bounded by a number known at
          - link "comptime" [ref=e7817] [cursor=pointer]:
            - /url: "#comptime"
          - text: "? In this case, use"
          - code [ref=e7818]: std.heap.FixedBufferAllocator
          - text: .
        - listitem [ref=e7819]:
          - text: "Is your program a command line application which runs from start to end without any fundamental cyclical pattern (such as a video game main loop, or a web server request handler), such that it would make sense to free everything at once at the end? In this case, it is recommended to follow this pattern:"
          - figure "cli_allocation.zig" [ref=e7820]:
            - generic [ref=e7821]: cli_allocation.zig
            - code [ref=e7823]: "const std = @import(\"std\"); pub fn main() !void { var arena = std.heap.ArenaAllocator.init(std.heap.page_allocator); defer arena.deinit(); const allocator = arena.allocator(); const ptr = try allocator.create(i32); std.debug.print(\"ptr={*}\\n\", .{ptr}); }"
          - figure "Shell" [ref=e7824]:
            - generic [ref=e7825]: Shell
            - generic [ref=e7827]: $ zig build-exe cli_allocation.zig $ ./cli_allocation ptr=i32@7f77143cc018
          - text: When using this kind of allocator, there is no need to free anything manually. Everything gets freed at once with the call to
          - code [ref=e7828]: arena.deinit()
          - text: .
        - listitem [ref=e7829]:
          - text: Are the allocations part of a cyclical pattern such as a video game main loop, or a web server request handler? If the allocations can all be freed at once, at the end of the cycle, for example once the video game frame has been fully rendered, or the web server request has been served, then
          - code [ref=e7830]: std.heap.ArenaAllocator
          - text: is a great candidate. As demonstrated in the previous bullet point, this allows you to free entire arenas at once. Note also that if an upper bound of memory can be established, then
          - code [ref=e7831]: std.heap.FixedBufferAllocator
          - text: can be used as a further optimization.
        - listitem [ref=e7832]:
          - text: Are you writing a test, and you want to make sure
          - code [ref=e7833]: error.OutOfMemory
          - text: is handled correctly? In this case, use
          - code [ref=e7834]: std.testing.FailingAllocator
          - text: .
        - listitem [ref=e7835]:
          - text: Are you writing a test? In this case, use
          - code [ref=e7836]: std.testing.allocator
          - text: .
        - listitem [ref=e7837]:
          - text: Finally, if none of the above apply, you need a general purpose allocator. If you are in Debug mode,
          - code [ref=e7838]: std.heap.DebugAllocator
          - text: is available as a function that takes a
          - link "comptime" [ref=e7839] [cursor=pointer]:
            - /url: "#comptime"
          - link "struct" [ref=e7840] [cursor=pointer]:
            - /url: "#struct"
          - text: of configuration options and returns a type. Generally, you will set up exactly one in your main function, and then pass it or sub-allocators around to various parts of your application.
        - listitem [ref=e7841]:
          - text: If you are compiling in ReleaseFast mode,
          - code [ref=e7842]: std.heap.smp_allocator
          - text: is a solid choice for a general purpose allocator.
        - listitem [ref=e7843]: You can also consider implementing an allocator.
      - heading "Where are the bytes?" [level=3] [ref=e7844]:
        - link "Where are the bytes?" [ref=e7845] [cursor=pointer]:
          - /url: "#toc-Where-are-the-bytes"
      - paragraph [ref=e7846]:
        - text: String literals such as
        - code [ref=e7847]: "\"hello\""
        - text: "are in the global constant data section. This is why it is an error to pass a string literal to a mutable slice, like this:"
      - figure "test_string_literal_to_slice.zig" [ref=e7848]:
        - generic [ref=e7849]: test_string_literal_to_slice.zig
        - code [ref=e7851]: "fn foo(s: []u8) void { _ = s; } test \"string literal to mutable slice\" { foo(\"hello\"); }"
      - figure "Shell" [ref=e7852]:
        - generic [ref=e7853]: Shell
        - generic [ref=e7855]: "$ zig test test_string_literal_to_slice.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_string_literal_to_slice.zig:6:9: error: expected type '[]u8', found '*const [5:0]u8' foo(\"hello\"); ^~~~~~~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_string_literal_to_slice.zig:6:9: note: cast discards const qualifier /home/ci/work/zig-bootstrap/zig/doc/langref/test_string_literal_to_slice.zig:1:11: note: parameter type declared here fn foo(s: []u8) void { ^~~~"
      - paragraph [ref=e7856]: "However if you make the slice constant, then it works:"
      - figure "test_string_literal_to_const_slice.zig" [ref=e7857]:
        - generic [ref=e7858]: test_string_literal_to_const_slice.zig
        - code [ref=e7860]: "fn foo(s: []const u8) void { _ = s; } test \"string literal to constant slice\" { foo(\"hello\"); }"
      - figure "Shell" [ref=e7861]:
        - generic [ref=e7862]: Shell
        - generic [ref=e7864]: $ zig test test_string_literal_to_const_slice.zig 1/1 test_string_literal_to_const_slice.test.string literal to constant slice...OK All 1 tests passed.
      - paragraph [ref=e7865]:
        - text: Just like string literals,
        - code [ref=e7866]: const
        - text: declarations, when the value is known at
        - link "comptime" [ref=e7867] [cursor=pointer]:
          - /url: "#comptime"
        - text: ", are stored in the global constant data section. Also"
        - link "Compile Time Variables" [ref=e7868] [cursor=pointer]:
          - /url: "#Compile-Time-Variables"
        - text: are stored in the global constant data section.
      - paragraph [ref=e7869]:
        - code [ref=e7870]: var
        - text: declarations inside functions are stored in the function's stack frame. Once a function returns, any
        - link "Pointers" [ref=e7871] [cursor=pointer]:
          - /url: "#Pointers"
        - text: to variables in the function's stack frame become invalid references, and dereferencing them becomes unchecked
        - link "Illegal Behavior" [ref=e7872] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: .
      - paragraph [ref=e7873]:
        - code [ref=e7874]: var
        - text: declarations at the top level or in
        - link "struct" [ref=e7875] [cursor=pointer]:
          - /url: "#struct"
        - text: declarations are stored in the global data section.
      - paragraph [ref=e7876]:
        - text: The location of memory allocated with
        - code [ref=e7877]: allocator.alloc
        - text: or
        - code [ref=e7878]: allocator.create
        - text: is determined by the allocator's implementation.
      - paragraph [ref=e7879]: "TODO: thread local variables"
      - heading "Heap Allocation Failure" [level=3] [ref=e7880]:
        - link "Heap Allocation Failure" [ref=e7881] [cursor=pointer]:
          - /url: "#toc-Heap-Allocation-Failure"
      - paragraph [ref=e7882]:
        - text: Many programming languages choose to handle the possibility of heap allocation failure by unconditionally crashing. By convention, Zig programmers do not consider this to be a satisfactory solution. Instead,
        - code [ref=e7883]: error.OutOfMemory
        - text: represents heap allocation failure, and Zig libraries return this error code whenever heap allocation failure prevented an operation from completing successfully.
      - paragraph [ref=e7884]: "Some have argued that because some operating systems such as Linux have memory overcommit enabled by default, it is pointless to handle heap allocation failure. There are many problems with this reasoning:"
      - list [ref=e7885]:
        - listitem [ref=e7886]:
          - text: Only some operating systems have an overcommit feature.
          - list [ref=e7887]:
            - listitem [ref=e7888]: Linux has it enabled by default, but it is configurable.
            - listitem [ref=e7889]: Windows does not overcommit.
            - listitem [ref=e7890]: Embedded systems do not have overcommit.
            - listitem [ref=e7891]: Hobby operating systems may or may not have overcommit.
        - listitem [ref=e7892]: For real-time systems, not only is there no overcommit, but typically the maximum amount of memory per application is determined ahead of time.
        - listitem [ref=e7893]: When writing a library, one of the main goals is code reuse. By making code handle allocation failure correctly, a library becomes eligible to be reused in more contexts.
        - listitem [ref=e7894]: Although some software has grown to depend on overcommit being enabled, its existence is the source of countless user experience disasters. When a system with overcommit enabled, such as Linux on default settings, comes close to memory exhaustion, the system locks up and becomes unusable. At this point, the OOM Killer selects an application to kill based on heuristics. This non-deterministic decision often results in an important process being killed, and often fails to return the system back to working order.
      - heading "Recursion" [level=3] [ref=e7895]:
        - link "Recursion" [ref=e7896] [cursor=pointer]:
          - /url: "#toc-Recursion"
      - paragraph [ref=e7897]: "Recursion is a fundamental tool in modeling software. However it has an often-overlooked problem: unbounded memory allocation."
      - paragraph [ref=e7898]:
        - text: Recursion is an area of active experimentation in Zig and so the documentation here is not final. You can read a
        - link "summary of recursion status in the 0.3.0 release notes" [ref=e7899] [cursor=pointer]:
          - /url: https://ziglang.org/download/0.3.0/release-notes.html#recursion
        - text: .
      - paragraph [ref=e7900]: The short summary is that currently recursion works normally as you would expect. Although Zig code is not yet protected from stack overflow, it is planned that a future version of Zig will provide such protection, with some degree of cooperation from Zig code required.
      - heading "Lifetime and Ownership" [level=3] [ref=e7901]:
        - link "Lifetime and Ownership" [ref=e7902] [cursor=pointer]:
          - /url: "#toc-Lifetime-and-Ownership"
      - paragraph [ref=e7903]:
        - text: It is the Zig programmer's responsibility to ensure that a
        - link "pointer" [ref=e7904] [cursor=pointer]:
          - /url: "#Pointers"
        - text: is not accessed when the memory pointed to is no longer available. Note that a
        - link "slice" [ref=e7905] [cursor=pointer]:
          - /url: "#Slices"
        - text: is a form of pointer, in that it references other memory.
      - paragraph [ref=e7906]: In order to prevent bugs, there are some helpful conventions to follow when dealing with pointers. In general, when a function returns a pointer, the documentation for the function should explain who "owns" the pointer. This concept helps the programmer decide when it is appropriate, if ever, to free the pointer.
      - paragraph [ref=e7907]:
        - text: For example, the function's documentation may say "caller owns the returned memory", in which case the code that calls the function must have a plan for when to free that memory. Probably in this situation, the function will accept an
        - code [ref=e7908]: Allocator
        - text: parameter.
      - paragraph [ref=e7909]:
        - text: Sometimes the lifetime of a pointer may be more complicated. For example, the
        - code [ref=e7910]: std.ArrayList(T).items
        - text: slice has a lifetime that remains valid until the next time the list is resized, such as by appending new elements.
      - paragraph [ref=e7911]:
        - text: The API documentation for functions and data structures should take great care to explain the ownership and lifetime semantics of pointers. Ownership determines whose responsibility it is to free the memory referenced by the pointer, and lifetime determines the point at which the memory becomes inaccessible (lest
        - link "Illegal Behavior" [ref=e7912] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: occur).
      - heading "Compile Variables" [level=2] [ref=e7913]:
        - link "Compile Variables" [ref=e7914] [cursor=pointer]:
          - /url: "#toc-Compile-Variables"
      - paragraph [ref=e7915]:
        - text: Compile variables are accessible by importing the
        - code [ref=e7916]: "\"builtin\""
        - text: package, which the compiler makes available to every Zig source file. It contains compile-time constants such as the current target, endianness, and release mode.
      - figure "compile_variables.zig" [ref=e7917]:
        - generic [ref=e7918]: compile_variables.zig
        - code [ref=e7920]: const builtin = @import("builtin"); const separator = if (builtin.os.tag == .windows) '\\' else '/';
      - paragraph [ref=e7921]:
        - text: Example of what is imported with
        - code [ref=e7922]: "@import(\"builtin\")"
        - text: ":"
      - figure "@import(\"builtin\")" [ref=e7923]:
        - generic [ref=e7924]: "@import(\"builtin\")"
        - code [ref=e7926]: "const std = @import(\"std\"); /// Zig version. When writing code that supports multiple versions of Zig, prefer /// feature detection (i.e. with `@hasDecl` or `@hasField`) over version checks. pub const zig_version = std.SemanticVersion.parse(zig_version_string) catch unreachable; pub const zig_version_string = \"0.17.0-dev.892+54537285c\"; pub const zig_backend = std.lang.CompilerBackend.stage2_x86_64; pub const output_mode: std.lang.OutputMode = .Exe; pub const link_mode: std.lang.LinkMode = .static; pub const unwind_tables: std.lang.UnwindTables = .async; pub const is_test = false; pub const single_threaded = false; pub const abi: std.Target.Abi = .gnu; pub const cpu: std.Target.Cpu = .{ .arch = .x86_64, .model = &std.Target.x86.cpu.znver2, .features = std.Target.x86.featureSet(&.{ .@\"64bit\", .adx, .aes, .allow_light_256_bit, .avx, .avx2, .bmi, .bmi2, .branchfusion, .clflushopt, .clwb, .clzero, .cmov, .crc32, .cx16, .cx8, .f16c, .fast_15bytenop, .fast_bextr, .fast_imm16, .fast_lzcnt, .fast_movbe, .fast_scalar_fsqrt, .fast_scalar_shift_masks, .fast_variable_perlane_shuffle, .fast_vector_fsqrt, .fma, .fsgsbase, .fxsr, .idivq_to_divl, .lzcnt, .mmx, .movbe, .mwaitx, .nopl, .pclmul, .popcnt, .prfchw, .rdpid, .rdpru, .rdrnd, .rdseed, .sahf, .sbb_dep_breaking, .sha, .slow_shld, .smap, .smep, .sse, .sse2, .sse3, .sse4_1, .sse4_2, .sse4a, .ssse3, .vzeroupper, .wbnoinvd, .x87, .xsave, .xsavec, .xsaveopt, .xsaves, }), }; pub const os: std.Target.Os = .{ .tag = .linux, .version_range = .{ .linux = .{ .range = .{ .min = .{ .major = 6, .minor = 1, .patch = 0, }, .max = .{ .major = 6, .minor = 1, .patch = 0, }, }, .glibc = .{ .major = 2, .minor = 36, .patch = 0, }, .android = 29, }}, }; pub const target: std.Target = .{ .cpu = cpu, .os = os, .abi = abi, .ofmt = object_format, .dynamic_linker = .init(\"/lib64/ld-linux-x86-64.so.2\"), }; pub const object_format: std.Target.ObjectFormat = .elf; pub const mode: std.lang.OptimizeMode = .Debug; pub const link_libc = false; pub const link_libcpp = false; pub const have_error_return_tracing = true; pub const valgrind_support = true; pub const sanitize_thread = false; pub const fuzz = false; pub const position_independent_code = false; pub const position_independent_executable = false; pub const strip_debug_info = false; pub const code_model: std.lang.CodeModel = .default; pub const omit_frame_pointer = false;"
      - paragraph [ref=e7927]: "See also:"
      - list [ref=e7928]:
        - listitem [ref=e7929]:
          - link "Build Mode" [ref=e7930] [cursor=pointer]:
            - /url: "#Build-Mode"
      - heading "Compilation Model" [level=2] [ref=e7931]:
        - link "Compilation Model" [ref=e7932] [cursor=pointer]:
          - /url: "#toc-Compilation-Model"
      - paragraph [ref=e7933]:
        - text: A Zig compilation is separated into
        - emphasis [ref=e7934]: modules
        - text: . Each module is a collection of Zig source files, one of which is the module's
        - emphasis [ref=e7935]: root source file
        - text: . Each module can
        - emphasis [ref=e7936]: depend
        - text: on any number of other modules, forming a directed graph (dependency loops between modules are allowed). If module A depends on module B, then any Zig source file in module A can import the
        - emphasis [ref=e7937]: root source file
        - text: of module B using
        - code [ref=e7938]: "@import"
        - text: with the module's name. In essence, a module acts as an alias to import a Zig source file (which might exist in a completely separate part of the filesystem).
      - paragraph [ref=e7939]:
        - text: A simple Zig program compiled with
        - code [ref=e7940]: zig build-exe
        - text: "has two key modules: the one containing your code, known as the \"main\" or \"root\" module, and the standard library. Your module"
        - emphasis [ref=e7941]: depends on
        - text: the standard library module under the name "std", which is what allows you to write
        - code [ref=e7942]: "@import(\"std\")"
        - text: "! In fact, every single module in a Zig compilation — including the standard library itself — implicitly depends on the standard library module under the name \"std\"."
      - paragraph [ref=e7943]:
        - text: The "root module" (the one provided by you in the
        - code [ref=e7944]: zig build-exe
        - text: example) has a special property. Like the standard library, it is implicitly made available to all modules (including itself), this time under the name "root". So,
        - code [ref=e7945]: "@import(\"root\")"
        - text: will always be equivalent to
        - code [ref=e7946]: "@import"
        - text: of your "main" source file (often, but not necessarily, named
        - code [ref=e7947]: main.zig
        - text: ).
      - heading "Source File Structs" [level=3] [ref=e7948]:
        - link "Source File Structs" [ref=e7949] [cursor=pointer]:
          - /url: "#toc-Source-File-Structs"
      - paragraph [ref=e7950]:
        - text: Every Zig source file is implicitly a
        - code [ref=e7951]: struct
        - text: declaration; you can imagine that the file's contents are literally surrounded by
        - code [ref=e7952]: "struct { ... }"
        - text: ". This means that as well as declarations, the top level of a file is permitted to contain fields:"
      - figure "TopLevelFields.zig" [ref=e7953]:
        - generic [ref=e7954]: TopLevelFields.zig
        - code [ref=e7956]: "//! Because this file contains fields, it is a type which is intended to be instantiated, and so //! is named in TitleCase instead of snake_case by convention. foo: u32, bar: u64, /// `@This()` can be used to refer to this struct type. In files with fields, it is quite common to /// name the type here, so it can be easily referenced by other declarations in this file. const TopLevelFields = @This(); pub fn init(val: u32) TopLevelFields { return .{ .foo = val, .bar = val * 10, }; }"
      - paragraph [ref=e7957]:
        - text: Such files can be instantiated just like any other
        - code [ref=e7958]: struct
        - text: type. A file's "root struct type" can be referred to within that file using
        - link "@This" [ref=e7959] [cursor=pointer]:
          - /url: "#This"
        - text: .
      - heading "File and Declaration Discovery" [level=3] [ref=e7960]:
        - link "File and Declaration Discovery" [ref=e7961] [cursor=pointer]:
          - /url: "#toc-File-and-Declaration-Discovery"
      - paragraph [ref=e7962]:
        - text: Zig places importance on the concept of whether any piece of code is
        - emphasis [ref=e7963]: semantically analyzed
        - text: "; in essence, whether the compiler \"looks at\" it. What code is analyzed is based on what files and declarations are \"discovered\" from a certain point. This process of \"discovery\" is based on a simple set of recursive rules:"
      - list [ref=e7964]:
        - listitem [ref=e7965]:
          - text: If a call to
          - code [ref=e7966]: "@import"
          - text: is analyzed, the file being imported is analyzed.
        - listitem [ref=e7967]:
          - text: If a type (including a file) is analyzed, all
          - code [ref=e7968]: comptime
          - text: and
          - code [ref=e7969]: export
          - text: declarations within it are analyzed.
        - listitem [ref=e7970]:
          - text: If a type (including a file) is analyzed, and the compilation is for a
          - link "test" [ref=e7971] [cursor=pointer]:
            - /url: "#Zig-Test"
          - text: ", and the module the type is within is the root module of the compilation, then all"
          - code [ref=e7972]: test
          - text: declarations within it are also analyzed.
        - listitem [ref=e7973]: If a reference to a named declaration (i.e. a usage of it) is analyzed, the declaration being referenced is analyzed. Declarations are order-independent, so this reference may be above or below the declaration being referenced, or even in another file entirely.
      - paragraph [ref=e7974]:
        - text: That's it! Those rules define how Zig files and declarations are discovered. All that remains is to understand where this process
        - emphasis [ref=e7975]: starts
        - text: .
      - paragraph [ref=e7976]:
        - text: "The answer to that is the root of the standard library: every Zig compilation begins by analyzing the file"
        - code [ref=e7977]: lib/std/std.zig
        - text: . This file contains a
        - code [ref=e7978]: comptime
        - text: declaration which imports
        - code [ref=e7979]: lib/std/start.zig
        - text: ", and that file in turn uses"
        - code [ref=e7980]: "@import(\"root\")"
        - text: to reference the "root module"; so, the file you provide as your main module's root source file is effectively also a root, because the standard library will always reference it.
      - paragraph [ref=e7981]:
        - text: It is often desirable to make sure that certain declarations — particularly
        - code [ref=e7982]: test
        - text: or
        - code [ref=e7983]: export
        - text: declarations — are discovered. Based on the above rules, a common strategy for this is to use
        - code [ref=e7984]: "@import"
        - text: within a
        - code [ref=e7985]: comptime
        - text: or
        - code [ref=e7986]: test
        - text: "block:"
      - figure "force_file_discovery.zig" [ref=e7987]:
        - generic [ref=e7988]: force_file_discovery.zig
        - code [ref=e7990]: "comptime { // This will ensure that the file 'api.zig' is always discovered (as long as this file is discovered). // It is useful if 'api.zig' contains important exported declarations. _ = @import(\"api.zig\"); // We could also have a file which contains declarations we only want to export depending on a comptime // condition. In that case, we can use an `if` statement here: if (builtin.os.tag == .windows) { _ = @import(\"windows_api.zig\"); } } test { // This will ensure that the file 'tests.zig' is always discovered (as long as this file is discovered), // if this compilation is a test. It is useful if 'tests.zig' contains tests we want to ensure are run. _ = @import(\"tests.zig\"); // We could also have a file which contains tests we only want to run depending on a comptime condition. // In that case, we can use an `if` statement here: if (builtin.os.tag == .windows) { _ = @import(\"windows_tests.zig\"); } } const builtin = @import(\"builtin\");"
      - heading "Special Root Declarations" [level=3] [ref=e7991]:
        - link "Special Root Declarations" [ref=e7992] [cursor=pointer]:
          - /url: "#toc-Special-Root-Declarations"
      - paragraph [ref=e7993]:
        - text: Because the root module's root source file is always accessible using
        - code [ref=e7994]: "@import(\"root\")"
        - text: ", is is sometimes used by libraries — including the Zig Standard Library — as a place for the program to expose some \"global\" information to that library. The Zig Standard Library will look for several declarations in this file."
      - heading "Entry Point" [level=4] [ref=e7995]:
        - link "Entry Point" [ref=e7996] [cursor=pointer]:
          - /url: "#toc-Entry-Point"
      - paragraph [ref=e7997]:
        - text: When building an executable, the most important thing to be looked up in this file is the program's
        - emphasis [ref=e7998]: entry point
        - text: . Most commonly, this is a function named
        - code [ref=e7999]: main
        - text: ", which"
        - code [ref=e8000]: std.start
        - text: will call just after performing important initialization work.
      - paragraph [ref=e8001]:
        - text: Alternatively, the presence of a declaration named
        - code [ref=e8002]: _start
        - text: (for instance,
        - code [ref=e8003]: "pub const _start = {};"
        - text: ) will disable the default
        - code [ref=e8004]: std.start
        - text: logic, allowing your root source file to export a low-level entry point as needed.
      - figure "entry_point.zig" [ref=e8005]:
        - generic [ref=e8006]: entry_point.zig
        - code [ref=e8008]: "/// `std.start` imports this file using `@import(\"root\")`, and uses this declaration as the program's /// user-provided entry point. It can return any of the following types: /// * `void` /// * `E!void`, for any error set `E` /// * `u8` /// * `E!u8`, for any error set `E` /// Returning a `void` value from this function will exit with code 0. /// Returning a `u8` value from this function will exit with the given status code. /// Returning an error value from this function will print an Error Return Trace and exit with code 1. pub fn main() void { std.debug.print(\"Hello, World!\\n\", .{}); } // If uncommented, this declaration would suppress the usual std.start logic, causing // the `main` declaration above to be ignored. //pub const _start = {}; const std = @import(\"std\");"
      - figure "Shell" [ref=e8009]:
        - generic [ref=e8010]: Shell
        - generic [ref=e8012]: $ zig build-exe entry_point.zig $ ./entry_point Hello, World!
      - paragraph [ref=e8013]:
        - text: If the Zig compilation links libc, the
        - code [ref=e8014]: main
        - text: function can optionally be an
        - code [ref=e8015]: export fn
        - text: which matches the signature of the C
        - code [ref=e8016]: main
        - text: "function:"
      - figure "libc_export_entry_point.zig" [ref=e8017]:
        - generic [ref=e8018]: libc_export_entry_point.zig
        - code [ref=e8020]: "pub export fn main(argc: c_int, argv: [*]const [*:0]const u8) c_int { const args = argv[0..@intCast(argc)]; std.debug.print(\"Hello! argv[0] is '{s}'\\n\", .{args[0]}); return 0; } const std = @import(\"std\");"
      - figure "Shell" [ref=e8021]:
        - generic [ref=e8022]: Shell
        - generic [ref=e8024]: $ zig build-exe libc_export_entry_point.zig -lc $ ./libc_export_entry_point Hello! argv[0] is './libc_export_entry_point'
      - paragraph [ref=e8025]:
        - code [ref=e8026]: std.start
        - text: may also use other entry point declarations in certain situations, such as
        - code [ref=e8027]: wWinMain
        - text: or
        - code [ref=e8028]: EfiMain
        - text: . Refer to the
        - code [ref=e8029]: lib/std/start.zig
        - text: logic for details of these declarations.
      - heading "Standard Library Options" [level=4] [ref=e8030]:
        - link "Standard Library Options" [ref=e8031] [cursor=pointer]:
          - /url: "#toc-Standard-Library-Options"
      - paragraph [ref=e8032]:
        - text: The standard library also looks for a declaration in the root module's root source file named
        - code [ref=e8033]: std_options
        - text: . If present, this declaration is expected to be a struct of type
        - code [ref=e8034]: std.Options
        - text: ", and allows the program to customize some standard library functionality, such as the"
        - code [ref=e8035]: std.log
        - text: implementation.
      - figure "std_options.zig" [ref=e8036]:
        - generic [ref=e8037]: std_options.zig
        - code [ref=e8039]: "/// The presence of this declaration allows the program to override certain behaviors of the standard library. /// For a full list of available options, see the documentation for `std.Options`. pub const std_options: std.Options = .{ // By default, in safe build modes, the standard library will attach a segfault handler to the program to // print a helpful stack trace if a segmentation fault occurs. Here, we can disable this, or even enable // it in unsafe build modes. .enable_segfault_handler = true, // This is the logging function used by `std.log`. .logFn = myLogFn, }; fn myLogFn( comptime level: std.log.Level, comptime scope: @EnumLiteral(), comptime format: []const u8, args: anytype, ) void { // We could do anything we want here! // ...but actually, let's just call the default implementation. std.log.defaultLog(level, scope, format, args); } const std = @import(\"std\");"
      - heading "Panic Handler" [level=4] [ref=e8040]:
        - link "Panic Handler" [ref=e8041] [cursor=pointer]:
          - /url: "#toc-Panic-Handler"
      - paragraph [ref=e8042]:
        - text: The Zig Standard Library looks for a declaration named
        - code [ref=e8043]: panic
        - text: in the root module's root source file. If present, it is expected to be a
        - link "Namespace" [ref=e8044] [cursor=pointer]:
          - /url: "#Namespace"
        - text: with declarations providing different panic handlers.
      - paragraph [ref=e8045]:
        - text: See
        - code [ref=e8046]: std.debug.simple_panic
        - text: for a basic implementation of this namespace.
      - paragraph [ref=e8047]:
        - text: Overriding how the panic handler actually outputs messages, but keeping the formatted safety panics which are enabled by default, can be easily achieved with
        - code [ref=e8048]: std.debug.FullPanic
        - text: ":"
      - figure "panic_handler.zig" [ref=e8049]:
        - generic [ref=e8050]: panic_handler.zig
        - code [ref=e8052]: "pub fn main() void { @setRuntimeSafety(true); var x: u8 = 255; // Let's overflow this integer! x += 1; } pub const panic = std.debug.FullPanic(myPanic); fn myPanic(msg: []const u8, first_trace_addr: ?usize) noreturn { _ = first_trace_addr; std.debug.print(\"Panic! {s}\\n\", .{msg}); std.process.exit(1); } const std = @import(\"std\");"
      - figure "Shell" [ref=e8053]:
        - generic [ref=e8054]: Shell
        - generic [ref=e8056]: $ zig build-exe panic_handler.zig $ ./panic_handler Panic! integer overflow
      - heading "Zig Build System" [level=2] [ref=e8057]:
        - link "Zig Build System" [ref=e8058] [cursor=pointer]:
          - /url: "#toc-Zig-Build-System"
      - paragraph [ref=e8059]: The Zig Build System provides a cross-platform, dependency-free way to declare the logic required to build a project. With this system, the logic to build a project is written in a build.zig file, using the Zig Build System API to declare and configure build artifacts and other tasks.
      - paragraph [ref=e8060]: "Some examples of tasks the build system can help with:"
      - list [ref=e8061]:
        - listitem [ref=e8062]: Performing tasks in parallel and caching the results.
        - listitem [ref=e8063]: Depending on other projects.
        - listitem [ref=e8064]: Providing a package for other projects to depend on.
        - listitem [ref=e8065]: Creating build artifacts by executing the Zig compiler. This includes building Zig source code as well as C and C++ source code.
        - listitem [ref=e8066]: Capturing user-configured options and using those options to configure the build.
        - listitem [ref=e8067]:
          - text: Surfacing build configuration as
          - link "comptime" [ref=e8068] [cursor=pointer]:
            - /url: "#comptime"
          - text: values by providing a file that can be
          - link "imported" [ref=e8069] [cursor=pointer]:
            - /url: "#import"
          - text: by Zig code.
        - listitem [ref=e8070]: Caching build artifacts to avoid unnecessarily repeating steps.
        - listitem [ref=e8071]: Executing build artifacts or system-installed tools.
        - listitem [ref=e8072]: Running tests and verifying the output of executing a build artifact matches the expected value.
        - listitem [ref=e8073]:
          - text: Running
          - code [ref=e8074]: zig fmt
          - text: on a codebase or a subset of it.
        - listitem [ref=e8075]: Custom tasks.
      - paragraph [ref=e8076]: To use the build system, run zig build --help to see a command-line usage help menu. This will include project-specific options that were declared in the build.zig script.
      - paragraph [ref=e8077]:
        - text: "For the time being, the build system documentation is hosted externally:"
        - link "Build System Documentation" [ref=e8078] [cursor=pointer]:
          - /url: https://ziglang.org/learn/build-system/
      - heading "C" [level=2] [ref=e8079]:
        - link "C" [ref=e8080] [cursor=pointer]:
          - /url: "#toc-C"
      - paragraph [ref=e8081]: Although Zig is independent of C, and, unlike most other languages, does not depend on libc, Zig acknowledges the importance of interacting with existing C code.
      - paragraph [ref=e8082]: There are a few ways that Zig facilitates C interop.
      - heading "C Type Primitives" [level=3] [ref=e8083]:
        - link "C Type Primitives" [ref=e8084] [cursor=pointer]:
          - /url: "#toc-C-Type-Primitives"
      - paragraph [ref=e8085]: These have guaranteed C ABI compatibility and can be used like any other type.
      - list [ref=e8086]:
        - listitem [ref=e8087]:
          - code [ref=e8088]: c_char
        - listitem [ref=e8089]:
          - code [ref=e8090]: c_short
        - listitem [ref=e8091]:
          - code [ref=e8092]: c_ushort
        - listitem [ref=e8093]:
          - code [ref=e8094]: c_int
        - listitem [ref=e8095]:
          - code [ref=e8096]: c_uint
        - listitem [ref=e8097]:
          - code [ref=e8098]: c_long
        - listitem [ref=e8099]:
          - code [ref=e8100]: c_ulong
        - listitem [ref=e8101]:
          - code [ref=e8102]: c_longlong
        - listitem [ref=e8103]:
          - code [ref=e8104]: c_ulonglong
        - listitem [ref=e8105]:
          - code [ref=e8106]: c_longdouble
      - paragraph [ref=e8107]:
        - text: To interop with the C
        - code [ref=e8108]: void
        - text: type, use
        - code [ref=e8109]: anyopaque
        - text: .
      - paragraph [ref=e8110]: "See also:"
      - list [ref=e8111]:
        - listitem [ref=e8112]:
          - link "Primitive Types" [ref=e8113] [cursor=pointer]:
            - /url: "#Primitive-Types"
      - heading "C Translation CLI" [level=3] [ref=e8114]:
        - link "C Translation CLI" [ref=e8115] [cursor=pointer]:
          - /url: "#toc-C-Translation-CLI"
      - paragraph [ref=e8116]: Zig's C translation capability is available as a CLI tool via zig translate-c. It requires a single filename as an argument. It may also take a set of optional flags that are forwarded to clang. It writes the translated file to stdout.
      - heading "Command line flags" [level=4] [ref=e8117]:
        - link "Command line flags" [ref=e8118] [cursor=pointer]:
          - /url: "#toc-Command-line-flags"
      - list [ref=e8119]:
        - listitem [ref=e8120]:
          - text: "-I: Specify a search directory for include files. May be used multiple times. Equivalent to"
          - link "clang's -I flag" [ref=e8121] [cursor=pointer]:
            - /url: https://releases.llvm.org/12.0.0/tools/clang/docs/ClangCommandLineReference.html#cmdoption-clang-i-dir
          - text: . The current directory is
          - emphasis [ref=e8122]: not
          - text: included by default; use -I. to include it.
        - listitem [ref=e8123]:
          - text: "-D: Define a preprocessor macro. Equivalent to"
          - link "clang's -D flag" [ref=e8124] [cursor=pointer]:
            - /url: https://releases.llvm.org/12.0.0/tools/clang/docs/ClangCommandLineReference.html#cmdoption-clang-d-macro
          - text: .
        - listitem [ref=e8125]:
          - text: "-cflags [flags] --: Pass arbitrary additional"
          - link "command line flags" [ref=e8126] [cursor=pointer]:
            - /url: https://releases.llvm.org/12.0.0/tools/clang/docs/ClangCommandLineReference.html
          - text: "to clang. Note: the list of flags must end with --"
        - listitem [ref=e8127]:
          - text: "-target: The"
          - link "target triple" [ref=e8128] [cursor=pointer]:
            - /url: "#Targets"
          - text: for the translated Zig code. If no target is specified, the current host target will be used.
      - heading "Using -target and -cflags" [level=4] [ref=e8129]:
        - link "Using -target and -cflags" [ref=e8130] [cursor=pointer]:
          - /url: "#toc-Using--target-and--cflags"
      - paragraph [ref=e8131]:
        - strong [ref=e8132]: Important!
        - text: When translating C code with zig translate-c, you
        - strong [ref=e8133]: must
        - text: use the same -target triple that you will use when compiling the translated code. In addition, you
        - strong [ref=e8134]: must
        - text: ensure that the -cflags used, if any, match the cflags used by code on the target system. Using the incorrect -target or -cflags could result in clang or Zig parse failures, or subtle ABI incompatibilities when linking with C code.
      - figure "varytarget.h" [ref=e8135]:
        - generic [ref=e8136]: varytarget.h
        - code [ref=e8138]: long FOO = __LONG_MAX__;
      - figure "Shell" [ref=e8139]:
        - generic [ref=e8140]: Shell
        - generic [ref=e8142]: "$ zig translate-c -target thumb-freestanding-gnueabihf varytarget.h|grep FOO pub export var FOO: c_long = 2147483647; $ zig translate-c -target x86_64-macos-gnu varytarget.h|grep FOO pub export var FOO: c_long = 9223372036854775807;"
      - figure "varycflags.h" [ref=e8143]:
        - generic [ref=e8144]: varycflags.h
        - code [ref=e8146]: "enum FOO { BAR }; int do_something(enum FOO foo);"
      - figure "Shell" [ref=e8147]:
        - generic [ref=e8148]: Shell
        - generic [ref=e8150]: "$ zig translate-c varycflags.h|grep -B1 do_something pub const enum_FOO = c_uint; pub extern fn do_something(foo: enum_FOO) c_int; $ zig translate-c -cflags -fshort-enums -- varycflags.h|grep -B1 do_something pub const enum_FOO = u8; pub extern fn do_something(foo: enum_FOO) c_int;"
      - heading "Translation failures" [level=3] [ref=e8151]:
        - link "Translation failures" [ref=e8152] [cursor=pointer]:
          - /url: "#toc-Translation-failures"
      - paragraph [ref=e8153]:
        - text: Some C constructs cannot be translated to Zig - for example,
        - emphasis [ref=e8154]: goto
        - text: ", structs with bitfields, and token-pasting macros. Zig employs"
        - emphasis [ref=e8155]: demotion
        - text: to allow translation to continue in the face of non-translatable entities.
      - paragraph [ref=e8156]:
        - text: Demotion comes in three varieties -
        - link "opaque" [ref=e8157] [cursor=pointer]:
          - /url: "#opaque"
        - text: ","
        - emphasis [ref=e8158]: extern
        - text: ", and"
        - code [ref=e8159]: "@compileError"
        - text: . C structs and unions that cannot be translated correctly will be translated as
        - code [ref=e8160]: "opaque{}"
        - text: . Functions that contain opaque types or code constructs that cannot be translated will be demoted to
        - code [ref=e8161]: extern
        - text: declarations. Thus, non-translatable types can still be used as pointers, and non-translatable functions can be called so long as the linker is aware of the compiled function.
      - paragraph [ref=e8162]:
        - code [ref=e8163]: "@compileError"
        - text: is used when top-level definitions (global variables, function prototypes, macros) cannot be translated or demoted. Since Zig uses lazy analysis for top-level declarations, untranslatable entities will not cause a compile error in your code unless you actually use them.
      - paragraph [ref=e8164]: "See also:"
      - list [ref=e8165]:
        - listitem [ref=e8166]:
          - link "opaque" [ref=e8167] [cursor=pointer]:
            - /url: "#opaque"
        - listitem [ref=e8168]:
          - link "extern" [ref=e8169] [cursor=pointer]:
            - /url: "#extern"
        - listitem [ref=e8170]:
          - link "@compileError" [ref=e8171] [cursor=pointer]:
            - /url: "#compileError"
      - heading "C Pointers" [level=3] [ref=e8172]:
        - link "C Pointers" [ref=e8173] [cursor=pointer]:
          - /url: "#toc-C-Pointers"
      - paragraph [ref=e8174]: This type is to be avoided whenever possible. The only valid reason for using a C pointer is in auto-generated code from translating C code.
      - paragraph [ref=e8175]:
        - text: When importing C header files, it is ambiguous whether pointers should be translated as single-item pointers (
        - code [ref=e8176]: "*T"
        - text: ) or many-item pointers (
        - code [ref=e8177]: "[*]T"
        - text: ). C pointers are a compromise so that Zig code can utilize translated header files directly.
      - paragraph [ref=e8178]:
        - code [ref=e8179]: "[*c]T"
        - text: "- C pointer."
      - list [ref=e8180]:
        - listitem [ref=e8181]:
          - text: Supports all the syntax of the other two pointer types (
          - code [ref=e8182]: "*T"
          - text: ) and (
          - code [ref=e8183]: "[*]T"
          - text: ).
        - listitem [ref=e8184]:
          - text: Coerces to other pointer types, as well as
          - link "Optional Pointers" [ref=e8185] [cursor=pointer]:
            - /url: "#Optional-Pointers"
          - text: . When a C pointer is coerced to a non-optional pointer, safety-checked
          - link "Illegal Behavior" [ref=e8186] [cursor=pointer]:
            - /url: "#Illegal-Behavior"
          - text: occurs if the address is 0.
        - listitem [ref=e8187]:
          - text: Allows address 0. On non-freestanding targets, dereferencing address 0 is safety-checked
          - link "Illegal Behavior" [ref=e8188] [cursor=pointer]:
            - /url: "#Illegal-Behavior"
          - text: . Optional C pointers introduce another bit to keep track of null, just like
          - code [ref=e8189]: "?usize"
          - text: . Note that creating an optional C pointer is unnecessary as one can use normal
          - link "Optional Pointers" [ref=e8190] [cursor=pointer]:
            - /url: "#Optional-Pointers"
          - text: .
        - listitem [ref=e8191]:
          - text: Supports
          - link "Type Coercion" [ref=e8192] [cursor=pointer]:
            - /url: "#Type-Coercion"
          - text: to and from integers.
        - listitem [ref=e8193]: Supports comparison with integers.
        - listitem [ref=e8194]:
          - text: Does not support Zig-only pointer attributes such as alignment. Use normal
          - link "Pointers" [ref=e8195] [cursor=pointer]:
            - /url: "#Pointers"
          - text: please!
      - paragraph [ref=e8196]: "When a C pointer is pointing to a single struct (not an array), dereference the C pointer to access the struct's fields or member data. That syntax looks like this:"
      - paragraph [ref=e8197]:
        - code [ref=e8198]: ptr_to_struct.*.struct_member
      - paragraph [ref=e8199]:
        - text: This is comparable to doing
        - code [ref=e8200]: "->"
        - text: in C.
      - paragraph [ref=e8201]: "When a C pointer is pointing to an array of structs, the syntax reverts to this:"
      - paragraph [ref=e8202]:
        - code [ref=e8203]: ptr_to_struct_array[index].struct_member
      - heading "C Variadic Functions" [level=3] [ref=e8204]:
        - link "C Variadic Functions" [ref=e8205] [cursor=pointer]:
          - /url: "#toc-C-Variadic-Functions"
      - paragraph [ref=e8206]: Zig supports extern variadic functions.
      - figure "test_variadic_function.zig" [ref=e8207]:
        - generic [ref=e8208]: test_variadic_function.zig
        - code [ref=e8210]: "const std = @import(\"std\"); const testing = std.testing; pub extern \"c\" fn printf(format: [*:0]const u8, ...) c_int; test \"variadic function\" { try testing.expectEqual(14, printf(\"Hello, world!\\n\")); try testing.expect(@typeInfo(@TypeOf(printf)).@\"fn\".attrs.varargs); }"
      - figure "Shell" [ref=e8211]:
        - generic [ref=e8212]: Shell
        - generic [ref=e8214]: $ zig test test_variadic_function.zig -lc 1/1 test_variadic_function.test.variadic function...OK All 1 tests passed. Hello, world!
      - paragraph [ref=e8215]:
        - text: Variadic functions can be implemented using
        - link "@cVaStart" [ref=e8216] [cursor=pointer]:
          - /url: "#cVaStart"
        - text: ","
        - link "@cVaEnd" [ref=e8217] [cursor=pointer]:
          - /url: "#cVaEnd"
        - text: ","
        - link "@cVaArg" [ref=e8218] [cursor=pointer]:
          - /url: "#cVaArg"
        - text: and
        - link "@cVaCopy" [ref=e8219] [cursor=pointer]:
          - /url: "#cVaCopy"
        - text: .
      - figure "test_defining_variadic_function.zig" [ref=e8220]:
        - generic [ref=e8221]: test_defining_variadic_function.zig
        - code [ref=e8223]: "const std = @import(\"std\"); const testing = std.testing; const builtin = @import(\"builtin\"); fn add(count: c_int, ...) callconv(.c) c_int { var ap = @cVaStart(); defer @cVaEnd(&ap); var i: usize = 0; var sum: c_int = 0; while (i < count) : (i += 1) { sum += @cVaArg(&ap, c_int); } return sum; } test \"defining a variadic function\" { if (builtin.cpu.arch == .aarch64 and builtin.os.tag != .macos) { // https://github.com/ziglang/zig/issues/14096 return error.SkipZigTest; } if (builtin.cpu.arch == .x86_64 and builtin.os.tag == .windows) { // https://github.com/ziglang/zig/issues/16961 return error.SkipZigTest; } if (builtin.cpu.arch == .s390x) { // https://github.com/ziglang/zig/issues/21350#issuecomment-3543006475 return error.SkipZigTest; } try std.testing.expectEqual(@as(c_int, 0), add(0)); try std.testing.expectEqual(@as(c_int, 1), add(1, @as(c_int, 1))); try std.testing.expectEqual(@as(c_int, 3), add(2, @as(c_int, 1), @as(c_int, 2))); }"
      - figure "Shell" [ref=e8224]:
        - generic [ref=e8225]: Shell
        - generic [ref=e8227]: $ zig test test_defining_variadic_function.zig 1/1 test_defining_variadic_function.test.defining a variadic function...OK All 1 tests passed.
      - heading "Exporting a C Library" [level=3] [ref=e8228]:
        - link "Exporting a C Library" [ref=e8229] [cursor=pointer]:
          - /url: "#toc-Exporting-a-C-Library"
      - paragraph [ref=e8230]:
        - text: One of the primary use cases for Zig is exporting a library with the C ABI for other programming languages to call into. The
        - code [ref=e8231]: export
        - text: "keyword in front of functions, variables, and types causes them to be part of the library API:"
      - figure "mathtest.zig" [ref=e8232]:
        - generic [ref=e8233]: mathtest.zig
        - code [ref=e8235]: "export fn add(a: i32, b: i32) i32 { return a + b; }"
      - paragraph [ref=e8236]: "To make a static library:"
      - figure "Shell" [ref=e8237]:
        - generic [ref=e8238]: Shell
        - generic [ref=e8240]: $ zig build-lib mathtest.zig
      - paragraph [ref=e8241]: "To make a shared library:"
      - figure "Shell" [ref=e8242]:
        - generic [ref=e8243]: Shell
        - generic [ref=e8245]: $ zig build-lib mathtest.zig -dynamic
      - paragraph [ref=e8246]:
        - text: Here is an example with the
        - link "Zig Build System" [ref=e8247] [cursor=pointer]:
          - /url: "#Zig-Build-System"
        - text: ":"
      - figure "test.c" [ref=e8248]:
        - generic [ref=e8249]: test.c
        - code [ref=e8251]: "// This header is generated by zig from mathtest.zig #include \"mathtest.h\" #include <stdio.h> int main(int argc, char **argv) { int32_t result = add(42, 1337); printf(\"%d\\n\", result); return 0; }"
      - figure "build_c.zig" [ref=e8252]:
        - generic [ref=e8253]: build_c.zig
        - code [ref=e8255]: "const std = @import(\"std\"); pub fn build(b: *std.Build) void { const lib = b.addLibrary(.{ .linkage = .dynamic, .name = \"mathtest\", .root_module = b.createModule(.{ .root_source_file = b.path(\"mathtest.zig\"), }), .version = .{ .major = 1, .minor = 0, .patch = 0 }, }); const exe = b.addExecutable(.{ .name = \"test\", .root_module = b.createModule(.{ .link_libc = true, }), }); exe.root_module.addCSourceFile(.{ .file = b.path(\"test.c\"), .flags = &.{\"-std=c99\"} }); exe.root_module.linkLibrary(lib); b.default_step.dependOn(&exe.step); const run_cmd = exe.run(); const test_step = b.step(\"test\", \"Test the program\"); test_step.dependOn(&run_cmd.step); }"
      - figure "Shell" [ref=e8256]:
        - generic [ref=e8257]: Shell
        - generic [ref=e8259]: $ zig build test 1379
      - paragraph [ref=e8260]: "See also:"
      - list [ref=e8261]:
        - listitem [ref=e8262]:
          - link "export" [ref=e8263] [cursor=pointer]:
            - /url: "#export"
      - heading "Mixing Object Files" [level=3] [ref=e8264]:
        - link "Mixing Object Files" [ref=e8265] [cursor=pointer]:
          - /url: "#toc-Mixing-Object-Files"
      - paragraph [ref=e8266]: "You can mix Zig object files with any other object files that respect the C ABI. Example:"
      - figure "base64.zig" [ref=e8267]:
        - generic [ref=e8268]: base64.zig
        - code [ref=e8270]: "const base64 = @import(\"std\").base64; export fn decode_base_64( dest_ptr: [*]u8, dest_len: usize, source_ptr: [*]const u8, source_len: usize, ) usize { const src = source_ptr[0..source_len]; const dest = dest_ptr[0..dest_len]; const base64_decoder = base64.standard.Decoder; const decoded_size = base64_decoder.calcSizeForSlice(src) catch unreachable; base64_decoder.decode(dest[0..decoded_size], src) catch unreachable; return decoded_size; }"
      - figure "test.c" [ref=e8271]:
        - generic [ref=e8272]: test.c
        - code [ref=e8274]: "// This header is generated by zig from base64.zig #include \"base64.h\" #include <string.h> #include <stdio.h> int main(int argc, char **argv) { const char *encoded = \"YWxsIHlvdXIgYmFzZSBhcmUgYmVsb25nIHRvIHVz\"; char buf[200]; size_t len = decode_base_64(buf, 200, encoded, strlen(encoded)); buf[len] = 0; puts(buf); return 0; }"
      - figure "build_object.zig" [ref=e8275]:
        - generic [ref=e8276]: build_object.zig
        - code [ref=e8278]: "const std = @import(\"std\"); pub fn build(b: *std.Build) void { const obj = b.addObject(.{ .name = \"base64\", .root_module = b.createModule(.{ .root_source_file = b.path(\"base64.zig\"), }), }); const exe = b.addExecutable(.{ .name = \"test\", .root_module = b.createModule(.{ .link_libc = true, }), }); exe.root_module.addCSourceFile(.{ .file = b.path(\"test.c\"), .flags = &.{\"-std=c99\"} }); exe.root_module.addObject(obj); b.installArtifact(exe); }"
      - figure "Shell" [ref=e8279]:
        - generic [ref=e8280]: Shell
        - generic [ref=e8282]: $ zig build $ ./zig-out/bin/test all your base are belong to us
      - paragraph [ref=e8283]: "See also:"
      - list [ref=e8284]:
        - listitem [ref=e8285]:
          - link "Targets" [ref=e8286] [cursor=pointer]:
            - /url: "#Targets"
        - listitem [ref=e8287]:
          - link "Zig Build System" [ref=e8288] [cursor=pointer]:
            - /url: "#Zig-Build-System"
      - heading "WebAssembly" [level=2] [ref=e8289]:
        - link "WebAssembly" [ref=e8290] [cursor=pointer]:
          - /url: "#toc-WebAssembly"
      - paragraph [ref=e8291]: Zig supports building for WebAssembly out of the box.
      - heading "Freestanding" [level=3] [ref=e8292]:
        - link "Freestanding" [ref=e8293] [cursor=pointer]:
          - /url: "#toc-Freestanding"
      - paragraph [ref=e8294]: For host environments like the web browser and nodejs, build as an executable using the freestanding OS target. Here's an example of running Zig code compiled to WebAssembly with nodejs.
      - figure "math.zig" [ref=e8295]:
        - generic [ref=e8296]: math.zig
        - code [ref=e8298]: "extern fn print(i32) void; export fn add(a: i32, b: i32) void { print(a + b); }"
      - figure "Shell" [ref=e8299]:
        - generic [ref=e8300]: Shell
        - generic [ref=e8302]: $ zig build-exe math.zig -target wasm32-freestanding -fno-entry --export=add
      - figure "test.js" [ref=e8303]:
        - generic [ref=e8304]: test.js
        - code [ref=e8306]: "const fs = require('fs'); const source = fs.readFileSync(\"./math.wasm\"); const typedArray = new Uint8Array(source); WebAssembly.instantiate(typedArray, { env: { print: (result) => { console.log(`The result is ${result}`); } }}).then(result => { const add = result.instance.exports.add; add(1, 2); });"
      - figure "Shell" [ref=e8307]:
        - generic [ref=e8308]: Shell
        - generic [ref=e8310]: $ node test.js The result is 3
      - heading "WASI" [level=3] [ref=e8311]:
        - link "WASI" [ref=e8312] [cursor=pointer]:
          - /url: "#toc-WASI"
      - paragraph [ref=e8313]: Zig standard library has first-class support for WebAssembly System Interface.
      - figure "wasi_args.zig" [ref=e8314]:
        - generic [ref=e8315]: wasi_args.zig
        - code [ref=e8317]: "const std = @import(\"std\"); pub fn main(init: std.process.Init) !void { const args = try init.minimal.args.toSlice(init.arena.allocator()); for (0.., args) |i, arg| { std.debug.print(\"{d}: {s}\\n\", .{ i, arg }); } }"
      - figure "Shell" [ref=e8318]:
        - generic [ref=e8319]: Shell
        - generic [ref=e8321]: $ zig build-exe wasi_args.zig -target wasm32-wasi
      - figure "Shell" [ref=e8322]:
        - generic [ref=e8323]: Shell
        - generic [ref=e8325]: "$ wasmtime wasi_args.wasm 123 hello 0: wasi_args.wasm 1: 123 2: hello"
      - paragraph [ref=e8326]:
        - text: A more interesting example would be extracting the list of preopens from the runtime. This is now supported in the standard library via
        - code [ref=e8327]: std.fs.wasi.Preopens
        - text: ":"
      - figure "wasi_preopens.zig" [ref=e8328]:
        - generic [ref=e8329]: wasi_preopens.zig
        - code [ref=e8331]: "const std = @import(\"std\"); pub fn main(init: std.process.Init) void { for (init.preopens.map.keys(), 0..) |preopen, i| { std.log.info(\"{d}: {s}\", .{ i, preopen }); } }"
      - figure "Shell" [ref=e8332]:
        - generic [ref=e8333]: Shell
        - generic [ref=e8335]: $ zig build-exe wasi_preopens.zig -target wasm32-wasi
      - figure "Shell" [ref=e8336]:
        - generic [ref=e8337]: Shell
        - generic [ref=e8339]: "$ wasmtime --dir=. wasi_preopens.wasm 0: stdin 1: stdout 2: stderr 3: ."
      - heading "Targets" [level=2] [ref=e8340]:
        - link "Targets" [ref=e8341] [cursor=pointer]:
          - /url: "#toc-Targets"
      - paragraph [ref=e8342]:
        - strong [ref=e8343]: Target
        - text: refers to the computer that will be used to run an executable. It is composed of the CPU architecture, the set of enabled CPU features, operating system, minimum and maximum operating system version, ABI, and ABI version.
      - paragraph [ref=e8344]:
        - text: Zig is a general-purpose programming language which means that it is designed to generate optimal code for a large set of targets. The command
        - code [ref=e8345]: zig targets
        - text: provides information about all of the targets the compiler is aware of.
      - paragraph [ref=e8346]:
        - text: When no target option is provided to the compiler, the default choice is to target the
        - strong [ref=e8347]: host computer
        - text: ", meaning that the resulting executable will be"
        - emphasis [ref=e8348]: unsuitable for copying to a different computer
        - text: . In order to copy an executable to another computer, the compiler needs to know about the target requirements via the
        - code [ref=e8349]: "-target"
        - text: option.
      - paragraph [ref=e8350]:
        - text: The Zig Standard Library (
        - code [ref=e8351]: "@import(\"std\")"
        - text: ) has cross-platform abstractions, making the same source code viable on many targets. Some code is more portable than other code. In general, Zig code is extremely portable compared to other programming languages.
      - paragraph [ref=e8352]: Each platform requires its own implementations to make Zig's cross-platform abstractions work. These implementations are at various degrees of completion. Each tagged release of the compiler comes with release notes that provide the full support table for each target.
      - heading "Style Guide" [level=2] [ref=e8353]:
        - link "Style Guide" [ref=e8354] [cursor=pointer]:
          - /url: "#toc-Style-Guide"
      - paragraph [ref=e8355]: These coding conventions are not enforced by the compiler, but they are shipped in this documentation along with the compiler in order to provide a point of reference, should anyone wish to point to an authority on agreed upon Zig coding style.
      - heading "Avoid Redundancy in Names" [level=3] [ref=e8356]:
        - link "Avoid Redundancy in Names" [ref=e8357] [cursor=pointer]:
          - /url: "#toc-Avoid-Redundancy-in-Names"
      - paragraph [ref=e8358]: "Avoid these words in type names:"
      - list [ref=e8359]:
        - listitem [ref=e8360]: Value
        - listitem [ref=e8361]: Data
        - listitem [ref=e8362]: Context
        - listitem [ref=e8363]: Manager
        - listitem [ref=e8364]: State
        - listitem [ref=e8365]: utils, misc, or somebody's initials
      - paragraph [ref=e8366]: Everything is a value, all types are data, everything is context, all logic manages state. Nothing is communicated by using a word that applies to all types.
      - paragraph [ref=e8367]: Temptation to use "utilities", "miscellaneous", or somebody's initials is a failure to categorize, or more commonly, overcategorization. Such declarations can live at the root of a module that needs them with no namespace needed.
      - heading "Avoid Redundant Names in Fully-Qualified Namespaces" [level=3] [ref=e8368]:
        - link "Avoid Redundant Names in Fully-Qualified Namespaces" [ref=e8369] [cursor=pointer]:
          - /url: "#toc-Avoid-Redundant-Names-in-Fully-Qualified-Namespaces"
      - paragraph [ref=e8370]:
        - text: Every declaration is assigned a
        - strong [ref=e8371]: fully qualified namespace
        - text: by the compiler, creating a tree structure. Choose names based on the fully-qualified namespace, and avoid redundant name segments.
      - figure "redundant_fqn.zig" [ref=e8372]:
        - generic [ref=e8373]: redundant_fqn.zig
        - code [ref=e8375]: "const std = @import(\"std\"); pub const json = struct { pub const JsonValue = union(enum) { number: f64, boolean: bool, // ... }; }; pub fn main() void { std.debug.print(\"{s}\\n\", .{@typeName(json.JsonValue)}); }"
      - figure "Shell" [ref=e8376]:
        - generic [ref=e8377]: Shell
        - generic [ref=e8379]: $ zig build-exe redundant_fqn.zig $ ./redundant_fqn redundant_fqn.json.JsonValue
      - paragraph [ref=e8380]:
        - text: In this example, "json" is repeated in the fully-qualified namespace. The solution is to delete
        - code [ref=e8381]: Json
        - text: from
        - code [ref=e8382]: JsonValue
        - text: . In this example we have an empty struct named
        - code [ref=e8383]: json
        - text: but remember that files also act as part of the fully-qualified namespace.
      - paragraph [ref=e8384]:
        - text: This example is an exception to the rule specified in
        - link "Avoid Redundancy in Names" [ref=e8385] [cursor=pointer]:
          - /url: "#Avoid-Redundancy-in-Names"
        - text: ". The meaning of the type has been reduced to its core: it is a json value. The name cannot be any more specific without being incorrect."
      - heading "Refrain from Underscore Prefixes" [level=3] [ref=e8386]:
        - link "Refrain from Underscore Prefixes" [ref=e8387] [cursor=pointer]:
          - /url: "#toc-Refrain-from-Underscore-Prefixes"
      - paragraph [ref=e8388]:
        - text: In some programming languages, it is common to prefix identifiers with underscores
        - code [ref=e8389]: _like_this
        - text: "to avoid keyword collisions, name collisions, or indicate additional metadata associated with usage of the identifier, such as: privacy, existence of complex data invariants, exclusion from semantic versioning, or context-specific type reflection meaning."
      - paragraph [ref=e8390]:
        - text: In Zig, there are no private fields, and this style guide recommends against pretending otherwise. Instead, fields should be named carefully based on their semantics and documentation should indicate how to use fields without violating data invariants. If a field is not subject to the same semantic versioning rules as everything else, the exception should be noted in the
        - link "Doc Comments" [ref=e8391] [cursor=pointer]:
          - /url: "#Doc-Comments"
        - text: .
      - paragraph [ref=e8392]:
        - text: As for
        - link "type reflection" [ref=e8393] [cursor=pointer]:
          - /url: "#typeInfo"
        - text: ", it is less error prone and more maintainable to use the type system than to make field names meaningful."
      - paragraph [ref=e8394]: Regarding name collisions, an underscore is insufficient to explain the difference between the two otherwise identical names. If there's no danger in getting them mixed up, then this guide recommends more verbose names at outer scopes and more abbreviated names at inner scopes.
      - paragraph [ref=e8395]:
        - text: Finally, keyword collisions are better avoided via
        - link "String Identifier Syntax" [ref=e8396] [cursor=pointer]:
          - /url: "#String-Identifier-Syntax"
        - text: .
      - heading "Whitespace" [level=3] [ref=e8397]:
        - link "Whitespace" [ref=e8398] [cursor=pointer]:
          - /url: "#toc-Whitespace"
      - list [ref=e8399]:
        - listitem [ref=e8400]: 4 space indentation
        - listitem [ref=e8401]: Open braces on same line, unless you need to wrap.
        - listitem [ref=e8402]: If a list of things is longer than 2, put each item on its own line and exercise the ability to put an extra comma at the end.
        - listitem [ref=e8403]: "Line length: aim for 100; use common sense."
      - heading "Names" [level=3] [ref=e8404]:
        - link "Names" [ref=e8405] [cursor=pointer]:
          - /url: "#toc-Names"
      - paragraph [ref=e8406]:
        - text: "Roughly speaking:"
        - code [ref=e8407]: camelCaseFunctionName
        - text: ","
        - code [ref=e8408]: TitleCaseTypeName
        - text: ","
        - code [ref=e8409]: snake_case_variable_name
        - text: ". More precisely:"
      - list [ref=e8410]:
        - listitem [ref=e8411]:
          - text: If
          - code [ref=e8412]: x
          - text: is a
          - code [ref=e8413]: struct
          - text: with 0 fields and is never meant to be instantiated then
          - code [ref=e8414]: x
          - text: is considered to be a "namespace" and should be
          - code [ref=e8415]: snake_case
          - text: .
        - listitem [ref=e8416]:
          - text: If
          - code [ref=e8417]: x
          - text: is a
          - code [ref=e8418]: type
          - text: or
          - code [ref=e8419]: type
          - text: alias then
          - code [ref=e8420]: x
          - text: should be
          - code [ref=e8421]: TitleCase
          - text: .
        - listitem [ref=e8422]:
          - text: If
          - code [ref=e8423]: x
          - text: is callable, and
          - code [ref=e8424]: x
          - text: "'s return type is"
          - code [ref=e8425]: type
          - text: ", then"
          - code [ref=e8426]: x
          - text: should be
          - code [ref=e8427]: TitleCase
          - text: .
        - listitem [ref=e8428]:
          - text: If
          - code [ref=e8429]: x
          - text: is otherwise callable, then
          - code [ref=e8430]: x
          - text: should be
          - code [ref=e8431]: camelCase
          - text: .
        - listitem [ref=e8432]:
          - text: Otherwise,
          - code [ref=e8433]: x
          - text: should be
          - code [ref=e8434]: snake_case
          - text: .
      - paragraph [ref=e8435]: Acronyms, initialisms, proper nouns, or any other word that has capitalization rules in written English are subject to naming conventions just like any other word. Even acronyms that are only 2 letters long are subject to these conventions.
      - paragraph [ref=e8436]:
        - text: "File names fall into two categories: types and namespaces. If the file (implicitly a struct) has top level fields, it should be named like any other struct with fields using"
        - code [ref=e8437]: TitleCase
        - text: . Otherwise, it should use
        - code [ref=e8438]: snake_case
        - text: . Directory names should be
        - code [ref=e8439]: snake_case
        - text: .
      - paragraph [ref=e8440]:
        - text: These are general rules of thumb; if it makes sense to do something different, do what makes sense. For example, if there is an established convention such as
        - code [ref=e8441]: ENOENT
        - text: ", follow the established convention."
      - heading "Examples" [level=3] [ref=e8442]:
        - link "Examples" [ref=e8443] [cursor=pointer]:
          - /url: "#toc-Examples"
      - figure "style_example.zig" [ref=e8444]:
        - generic [ref=e8445]: style_example.zig
        - code [ref=e8447]: "const namespace_name = @import(\"dir_name/file_name.zig\"); const TypeName = @import(\"dir_name/TypeName.zig\"); var global_var: i32 = undefined; const const_name = 42; const PrimitiveTypeAlias = f32; const StructName = struct { field: i32, }; const StructAlias = StructName; fn functionName(param_name: TypeName) void { var functionPointer = functionName; functionPointer(); functionPointer = otherFunction; functionPointer(); } const functionAlias = functionName; fn ListTemplateFunction(comptime ChildType: type, comptime fixed_size: usize) type { return List(ChildType, fixed_size); } fn ShortList(comptime T: type, comptime n: usize) type { return struct { field_name: [n]T, fn methodName() void {} }; } // The word XML loses its casing when used in Zig identifiers. const xml_document = \\\\<?xml version=\"1.0\" encoding=\"UTF-8\"?> \\\\<document> \\\\</document> ; const XmlParser = struct { field: i32, }; // The initials BE (Big Endian) are just another word in Zig identifier names. fn readU32Be() u32 {}"
      - paragraph [ref=e8448]:
        - text: See the
        - link "Zig Standard Library" [ref=e8449] [cursor=pointer]:
          - /url: "#Zig-Standard-Library"
        - text: for more examples.
      - heading "Doc Comment Guidance" [level=3] [ref=e8450]:
        - link "Doc Comment Guidance" [ref=e8451] [cursor=pointer]:
          - /url: "#toc-Doc-Comment-Guidance"
      - list [ref=e8452]:
        - listitem [ref=e8453]: Omit any information that is redundant based on the name of the thing being documented.
        - listitem [ref=e8454]: Duplicating information onto multiple similar functions is encouraged because it helps IDEs and other tools provide better help text.
        - listitem [ref=e8455]:
          - text: Use the word
          - strong [ref=e8456]: assume
          - text: to indicate invariants that cause
          - emphasis [ref=e8457]: unchecked
          - link "Illegal Behavior" [ref=e8458] [cursor=pointer]:
            - /url: "#Illegal-Behavior"
          - text: when violated.
        - listitem [ref=e8459]:
          - text: Use the word
          - strong [ref=e8460]: assert
          - text: to indicate invariants that cause
          - emphasis [ref=e8461]: safety-checked
          - link "Illegal Behavior" [ref=e8462] [cursor=pointer]:
            - /url: "#Illegal-Behavior"
          - text: when violated.
      - heading "Source Encoding" [level=2] [ref=e8463]:
        - link "Source Encoding" [ref=e8464] [cursor=pointer]:
          - /url: "#toc-Source-Encoding"
      - paragraph [ref=e8465]: Zig source code is encoded in UTF-8. An invalid UTF-8 byte sequence results in a compile error.
      - paragraph [ref=e8466]: "Throughout all zig source code (including in comments), some code points are never allowed:"
      - list [ref=e8467]:
        - listitem [ref=e8468]: "Ascii control characters, except for U+000a (LF), U+000d (CR), and U+0009 (HT): U+0000 - U+0008, U+000b - U+000c, U+000e - U+0001f, U+007f."
        - listitem [ref=e8469]: "Non-Ascii Unicode line endings: U+0085 (NEL), U+2028 (LS), U+2029 (PS)."
      - paragraph [ref=e8470]:
        - text: LF (byte value 0x0a, code point U+000a,
        - code [ref=e8471]: "'\\n'"
        - text: ) is the line terminator in Zig source code. This byte value terminates every line of zig source code except the last line of the file. It is recommended that non-empty source files end with an empty line, which means the last byte would be 0x0a (LF).
      - paragraph [ref=e8472]:
        - text: Each LF may be immediately preceded by a single CR (byte value 0x0d, code point U+000d,
        - code [ref=e8473]: "'\\r'"
        - text: ) to form a Windows style line ending, but this is discouraged. Note that in multiline strings, CRLF sequences will be encoded as LF when compiled into a zig program. A CR in any other context is not allowed.
      - paragraph [ref=e8474]:
        - text: HT hard tabs (byte value 0x09, code point U+0009,
        - code [ref=e8475]: "'\\t'"
        - text: ) are interchangeable with SP spaces (byte value 0x20, code point U+0020,
        - code [ref=e8476]: "' '"
        - text: ) as a token separator, but use of hard tabs is discouraged. See
        - link "Grammar" [ref=e8477] [cursor=pointer]:
          - /url: "#Grammar"
        - text: .
      - paragraph [ref=e8478]: For compatibility with other tools, the compiler ignores a UTF-8-encoded byte order mark (U+FEFF) if it is the first Unicode code point in the source text. A byte order mark is not allowed anywhere else in the source.
      - paragraph [ref=e8479]: Note that running zig fmt on a source file will implement all recommendations mentioned here.
      - paragraph [ref=e8480]:
        - text: Note that a tool reading Zig source code can make assumptions if the source code is assumed to be correct Zig code. For example, when identifying the ends of lines, a tool can use a naive search such as
        - code [ref=e8481]: /\n/
        - text: ", or an"
        - link "advanced" [ref=e8482] [cursor=pointer]:
          - /url: https://msdn.microsoft.com/en-us/library/dd409797.aspx
        - text: search such as
        - code [ref=e8483]: /\r\n?|[\n\u0085\u2028\u2029]/
        - text: ", and in either case line endings will be correctly identified. For another example, when identifying the whitespace before the first token on a line, a tool can either use a naive search such as"
        - code [ref=e8484]: /[ \t]/
        - text: ", or an"
        - link "advanced" [ref=e8485] [cursor=pointer]:
          - /url: https://tc39.es/ecma262/#sec-characterclassescape
        - text: search such as
        - code [ref=e8486]: /\s/
        - text: ", and in either case whitespace will be correctly identified."
