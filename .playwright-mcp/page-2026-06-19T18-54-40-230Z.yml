      - paragraph [ref=e5080]:
        - text: On the flip side, inside the function definition with the
        - code [ref=e5081]: comptime
        - text: "parameter, the value is known at compile-time. This means that we actually could make this work for the bool type if we wanted to:"
      - figure "test_comptime_max_with_bool.zig" [ref=e5082]:
