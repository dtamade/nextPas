        - listitem [ref=e4673]: Multiple break statements in a block
        - listitem [ref=e4674]:
          - text: Some
          - link "binary operations" [ref=e4675] [cursor=pointer]:
            - /url: "#Table-of-Operators"
      - paragraph [ref=e4676]: "This kind of type resolution chooses a type that all peer types can coerce into. Here are some examples:"
      - figure "test_peer_type_resolution.zig" [ref=e4677]:
        - generic [ref=e4678]: test_peer_type_resolution.zig
        - code [ref=e4680]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; const expectEqualStrings = std.testing.expectEqualStrings; test \"peer resolve int widening\" { const a: i8 = 12; const b: i16 = 34; const c = a + b; try expectEqual(46, c); try expectEqual(i16, @TypeOf(c)); } test \"peer resolve small int and float\" { // This only works for integer types that can coerce to the float type. // Larger integer types will cause a compiler error; no float widening occurs. var i: u8 = 12; var f: f32 = 34; _ = .{ &i, &f }; const x = i + f; try expectEqual(x, 46.0); try expectEqual(@TypeOf(x), f32); } test \"peer resolve arrays of different size to const slice\" { try expectEqualStrings(\"true\", boolToStr(true)); try expectEqualStrings(\"false\", boolToStr(false)); try comptime expectEqualStrings(\"true\", boolToStr(true)); try comptime expectEqualStrings(\"false\", boolToStr(false)); } fn boolToStr(b: bool) []const u8 { return if (b) \"true\" else \"false\"; } test \"peer resolve array and const slice\" { try testPeerResolveArrayConstSlice(true); try comptime testPeerResolveArrayConstSlice(true); } fn testPeerResolveArrayConstSlice(b: bool) !void { const value1 = if (b) \"aoeu\" else @as([]const u8, \"zz\"); const value2 = if (b) @as([]const u8, \"zz\") else \"aoeu\"; try expectEqualStrings(\"aoeu\", value1); try expectEqualStrings(\"zz\", value2); } test \"peer type resolution: ?T and T\" { try expectEqual(0, peerTypeTAndOptionalT(true, false).?); try expectEqual(3, peerTypeTAndOptionalT(false, false).?); comptime { try expectEqual(0, peerTypeTAndOptionalT(true, false).?); try expectEqual(3, peerTypeTAndOptionalT(false, false).?); } } fn peerTypeTAndOptionalT(c: bool, b: bool) ?usize { if (c) { return if (b) null else @as(usize, 0); } return @as(usize, 3); } test \"peer type resolution: *[0]u8 and []const u8\" { try expectEqual(0, peerTypeEmptyArrayAndSlice(true, \"hi\").len); try expectEqual(1, peerTypeEmptyArrayAndSlice(false, \"hi\").len); comptime { try expectEqual(0, peerTypeEmptyArrayAndSlice(true, \"hi\").len); try expectEqual(1, peerTypeEmptyArrayAndSlice(false, \"hi\").len); } } fn peerTypeEmptyArrayAndSlice(a: bool, slice: []const u8) []const u8 { if (a) { return &[_]u8{}; } return slice[0..1]; } test \"peer type resolution: *[0]u8, []const u8, and anyerror![]u8\" { { var data = \"hi\".*; const slice = data[0..]; try expectEqual(0, (try peerTypeEmptyArrayAndSliceAndError(true, slice)).len); try expectEqual(1, (try peerTypeEmptyArrayAndSliceAndError(false, slice)).len); } comptime { var data = \"hi\".*; const slice = data[0..]; try expectEqual(0, (try peerTypeEmptyArrayAndSliceAndError(true, slice)).len); try expectEqual(1, (try peerTypeEmptyArrayAndSliceAndError(false, slice)).len); } } fn peerTypeEmptyArrayAndSliceAndError(a: bool, slice: []u8) anyerror![]u8 { if (a) { return &[_]u8{}; } return slice[0..1]; } test \"peer type resolution: *const T and ?*T\" { const a: *const usize = @ptrFromInt(0x12345678); const b: ?*usize = @ptrFromInt(0x12345678); try expectEqual(a, b); try expectEqual(b, a); } test \"peer type resolution: error union switch\" { // The non-error and error cases are only peers if the error case is just a switch expression; // the pattern `if (x) {...} else |err| blk: { switch (err) {...} }` does not consider the // non-error and error case to be peers. var a: error{ A, B, C }!u32 = 0; _ = &a; const b = if (a) |x| x + 3 else |err| switch (err) { error.A => 0, error.B => 1, error.C => null, }; try expectEqual(?u32, @TypeOf(b)); // The non-error and error cases are only peers if the error case is just a switch expression; // the pattern `x catch |err| blk: { switch (err) {...} }` does not consider the unwrapped `x` // and error case to be peers. const c = a catch |err| switch (err) { error.A => 0, error.B => 1, error.C => null, }; try expectEqual(?u32, @TypeOf(c)); }"
      - figure "Shell" [ref=e4681]:
        - generic [ref=e4682]: Shell
        - generic [ref=e4684]: "$ zig test test_peer_type_resolution.zig 1/9 test_peer_type_resolution.test.peer resolve int widening...OK 2/9 test_peer_type_resolution.test.peer resolve small int and float...OK 3/9 test_peer_type_resolution.test.peer resolve arrays of different size to const slice...OK 4/9 test_peer_type_resolution.test.peer resolve array and const slice...OK 5/9 test_peer_type_resolution.test.peer type resolution: ?T and T...OK 6/9 test_peer_type_resolution.test.peer type resolution: *[0]u8 and []const u8...OK 7/9 test_peer_type_resolution.test.peer type resolution: *[0]u8, []const u8, and anyerror![]u8...OK 8/9 test_peer_type_resolution.test.peer type resolution: *const T and ?*T...OK 9/9 test_peer_type_resolution.test.peer type resolution: error union switch...OK All 9 tests passed."
      - heading "Zero Bit Types" [level=2] [ref=e4685]:
        - link "Zero Bit Types" [ref=e4686] [cursor=pointer]:
          - /url: "#toc-Zero-Bit-Types"
      - paragraph [ref=e4687]:
        - text: For some types,
        - link "@sizeOf" [ref=e4688] [cursor=pointer]:
          - /url: "#sizeOf"
        - text: "is 0:"
      - list [ref=e4689]:
        - listitem [ref=e4690]:
          - link "void" [ref=e4691] [cursor=pointer]:
            - /url: "#void"
        - listitem [ref=e4692]:
          - text: The
          - link "integer type" [ref=e4693] [cursor=pointer]:
            - /url: "#Integers"
          - code [ref=e4694]: u0
          - text: .
        - listitem [ref=e4695]:
          - link "Arrays" [ref=e4696] [cursor=pointer]:
            - /url: "#Arrays"
          - text: and
          - link "Vectors" [ref=e4697] [cursor=pointer]:
            - /url: "#Vectors"
          - text: with len 0, or with an element type that is a zero bit type.
        - listitem [ref=e4698]:
          - text: An
          - link "enum" [ref=e4699] [cursor=pointer]:
            - /url: "#enum"
          - text: with only 1 tag.
        - listitem [ref=e4700]:
          - text: A
          - link "struct" [ref=e4701] [cursor=pointer]:
            - /url: "#struct"
          - text: with all fields being zero bit types.
        - listitem [ref=e4702]:
          - text: A
          - link "union" [ref=e4703] [cursor=pointer]:
            - /url: "#union"
          - text: with only 1 field which is a zero bit type.
      - paragraph [ref=e4704]: "These types can only ever have one possible value, and thus require 0 bits to represent. Code that makes use of these types is not included in the final generated code:"
      - figure "zero_bit_types.zig" [ref=e4705]:
        - generic [ref=e4706]: zero_bit_types.zig
        - code [ref=e4708]: "export fn entry() void { var x: void = {}; var y: void = {}; x = y; y = x; }"
      - paragraph [ref=e4709]:
        - text: When this turns into machine code, there is no code generated in the body of
        - code [ref=e4710]: entry
        - text: ", even in"
        - link "Debug" [ref=e4711] [cursor=pointer]:
          - /url: "#Debug"
        - text: "mode. For example, on x86_64:"
      - code [ref=e4713]: "0000000000000010 <entry>: 10: 55 push %rbp 11: 48 89 e5 mov %rsp,%rbp 14: 5d pop %rbp 15: c3 retq"
      - paragraph [ref=e4714]: These assembly instructions do not have any code associated with the void values - they only perform the function call prologue and epilogue.
      - heading "void" [level=3] [ref=e4715]:
        - link "void" [ref=e4716] [cursor=pointer]:
          - /url: "#toc-void"
      - paragraph [ref=e4717]:
        - code [ref=e4718]: void
        - text: can be useful for instantiating generic types. For example, given a
        - code [ref=e4719]: Map(Key, Value)
        - text: ", one can pass"
        - code [ref=e4720]: void
        - text: for the
        - code [ref=e4721]: Value
        - text: type to make it into a
        - code [ref=e4722]: Set
        - text: ":"
      - figure "test_void_in_hashmap.zig" [ref=e4723]:
        - generic [ref=e4724]: test_void_in_hashmap.zig
        - code [ref=e4726]: "const std = @import(\"std\"); const expect = std.testing.expect; test \"turn HashMap into a set with void\" { var map = std.AutoHashMap(i32, void).init(std.testing.allocator); defer map.deinit(); try map.put(1, {}); try map.put(2, {}); try expect(map.contains(2)); try expect(!map.contains(3)); _ = map.remove(2); try expect(!map.contains(2)); }"
      - figure "Shell" [ref=e4727]:
        - generic [ref=e4728]: Shell
        - generic [ref=e4730]: $ zig test test_void_in_hashmap.zig 1/1 test_void_in_hashmap.test.turn HashMap into a set with void...OK All 1 tests passed.
      - paragraph [ref=e4731]:
        - text: Note that this is different from using a dummy value for the hash map value. By using
        - code [ref=e4732]: void
        - text: as the type of the value, the hash map entry type has no value field, and thus the hash map takes up less space. Further, all the code that deals with storing and loading the value is deleted, as seen above.
      - paragraph [ref=e4733]:
        - code [ref=e4734]: void
        - text: is distinct from
        - code [ref=e4735]: anyopaque
        - text: .
        - code [ref=e4736]: void
        - text: has a known size of 0 bytes, and
        - code [ref=e4737]: anyopaque
        - text: has an unknown, but non-zero, size.
      - paragraph [ref=e4738]:
        - text: Expressions of type
        - code [ref=e4739]: void
        - text: are the only ones whose value can be ignored. For example, ignoring a non-
        - code [ref=e4740]: void
        - text: "expression is a compile error:"
      - figure "test_expression_ignored.zig" [ref=e4741]:
        - generic [ref=e4742]: test_expression_ignored.zig
        - code [ref=e4744]: "test \"ignoring expression value\" { foo(); } fn foo() i32 { return 1234; }"
      - figure "Shell" [ref=e4745]:
        - generic [ref=e4746]: Shell
        - generic [ref=e4748]: "$ zig test test_expression_ignored.zig /home/ci/work/zig-bootstrap/zig/doc/langref/test_expression_ignored.zig:2:8: error: value of type 'i32' ignored foo(); ~~~^~ /home/ci/work/zig-bootstrap/zig/doc/langref/test_expression_ignored.zig:2:8: note: all non-void values must be used /home/ci/work/zig-bootstrap/zig/doc/langref/test_expression_ignored.zig:2:8: note: to discard the value, assign it to '_'"
      - paragraph [ref=e4749]:
        - text: However, if the expression has type
        - code [ref=e4750]: void
        - text: ", there will be no error. Expression results can be explicitly ignored by assigning them to"
        - code [ref=e4751]: _
        - text: .
      - figure "test_void_ignored.zig" [ref=e4752]:
        - generic [ref=e4753]: test_void_ignored.zig
        - code [ref=e4755]: "test \"void is ignored\" { returnsVoid(); } test \"explicitly ignoring expression value\" { _ = foo(); } fn returnsVoid() void {} fn foo() i32 { return 1234; }"
      - figure "Shell" [ref=e4756]:
        - generic [ref=e4757]: Shell
        - generic [ref=e4759]: $ zig test test_void_ignored.zig 1/2 test_void_ignored.test.void is ignored...OK 2/2 test_void_ignored.test.explicitly ignoring expression value...OK All 2 tests passed.
      - heading "Result Location Semantics" [level=2] [ref=e4760]:
        - link "Result Location Semantics" [ref=e4761] [cursor=pointer]:
          - /url: "#toc-Result-Location-Semantics"
      - paragraph [ref=e4762]:
        - text: "During compilation, every Zig expression and sub-expression is assigned optional result location information. This information dictates what type the expression should have (its result type), and where the resulting value should be placed in memory (its result location). The information is optional in the sense that not every expression has this information: assignment to"
        - code [ref=e4763]: _
        - text: ", for instance, does not provide any information about the type of an expression, nor does it provide a concrete memory location to place it in."
      - paragraph [ref=e4764]:
        - text: As a motivating example, consider the statement
        - code [ref=e4765]: "const x: u32 = 42;"
        - text: . The type annotation here provides a result type of
        - code [ref=e4766]: u32
        - text: to the initialization expression
        - code [ref=e4767]: "42"
        - text: ", instructing the compiler to coerce this integer (initially of type"
        - code [ref=e4768]: comptime_int
        - text: ) to this type. We will see more examples shortly.
      - paragraph [ref=e4769]: "This is not an implementation detail: the logic outlined above is codified into the Zig language specification, and is the primary mechanism of type inference in the language. This system is collectively referred to as \"Result Location Semantics\"."
      - heading "Result Types" [level=3] [ref=e4770]:
        - link "Result Types" [ref=e4771] [cursor=pointer]:
          - /url: "#toc-Result-Types"
      - paragraph [ref=e4772]:
        - text: Result types are propagated recursively through expressions where possible. For instance, if the expression
        - code [ref=e4773]: "&e"
        - text: has result type
        - code [ref=e4774]: "*u32"
        - text: ", then"
        - code [ref=e4775]: e
        - text: is given a result type of
        - code [ref=e4776]: u32
        - text: ", allowing the language to perform this coercion before taking a reference."
      - paragraph [ref=e4777]:
        - text: The result type mechanism is utilized by casting builtins such as
        - code [ref=e4778]: "@intCast"
        - text: . Rather than taking as an argument the type to cast to, these builtins use their result type to determine this information. The result type is often known from context; where it is not, the
        - code [ref=e4779]: "@as"
        - text: builtin can be used to explicitly provide a result type.
      - paragraph [ref=e4780]: "We can break down the result types for each component of a simple expression as follows:"
      - figure "result_type_propagation.zig" [ref=e4781]:
