      - paragraph [ref=e1522]:
        - text: The Zig Standard Library also contains functions to compare
        - link "Slices" [ref=e1523] [cursor=pointer]:
          - /url: "#Slices"
        - text: ", strings, and more. See the rest of the"
        - code [ref=e1524]: std.testing
        - text: namespace in the
        - link "Zig Standard Library" [ref=e1525] [cursor=pointer]:
          - /url: "#Zig-Standard-Library"
        - text: for more available functions.
      - heading "Test Tool Documentation" [level=3] [ref=e1526]:
        - link "Test Tool Documentation" [ref=e1527] [cursor=pointer]:
          - /url: "#toc-Test-Tool-Documentation"
      - paragraph [ref=e1528]: zig test has a few command line parameters which affect the compilation. See zig test --help for a full list.
      - heading "Variables" [level=2] [ref=e1529]:
        - link "Variables" [ref=e1530] [cursor=pointer]:
          - /url: "#toc-Variables"
      - paragraph [ref=e1531]:
        - text: A variable is a unit of
        - link "Memory" [ref=e1532] [cursor=pointer]:
          - /url: "#Memory"
        - text: storage.
      - paragraph [ref=e1533]:
        - text: It is generally preferable to use
        - code [ref=e1534]: const
        - text: rather than
        - code [ref=e1535]: var
        - text: when declaring a variable. This causes less work for both humans and computers to do when reading code, and creates more optimization opportunities.
      - paragraph [ref=e1536]:
        - text: Variables are never allowed to shadow
        - link "Identifiers" [ref=e1537] [cursor=pointer]:
          - /url: "#Identifiers"
        - text: from an outer scope.
      - paragraph [ref=e1538]:
        - text: The
        - code [ref=e1539]: extern
        - text: keyword or
        - link "@extern" [ref=e1540] [cursor=pointer]:
          - /url: "#extern"
        - text: builtin function can be used to link against a variable that is exported from another object. The
        - code [ref=e1541]: export
        - text: keyword or
        - link "@export" [ref=e1542] [cursor=pointer]:
          - /url: "#export"
        - text: builtin function can be used to make a variable available to other objects at link time. In both cases, the type of the variable must be C ABI compatible.
      - paragraph [ref=e1543]: "See also:"
      - list [ref=e1544]:
        - listitem [ref=e1545]:
          - link "Exporting a C Library" [ref=e1546] [cursor=pointer]:
            - /url: "#Exporting-a-C-Library"
      - heading "Namespace Level Variables" [level=3] [ref=e1547]:
        - link "Namespace Level Variables" [ref=e1548] [cursor=pointer]:
          - /url: "#toc-Namespace-Level-Variables"
      - paragraph [ref=e1549]:
        - link "Namespace" [ref=e1550] [cursor=pointer]:
          - /url: "#Namespace"
        - text: level variables have global lifetime and are order-independent and lazily analyzed. The initialization value of namespace level variables is implicitly
        - link "comptime" [ref=e1551] [cursor=pointer]:
          - /url: "#comptime"
        - text: . If a namespace level variable is
        - code [ref=e1552]: const
        - text: then its value is
        - code [ref=e1553]: comptime
        - text: "-known, otherwise it is runtime-known."
      - figure "test_namespace_level_variables.zig" [ref=e1554]:
        - generic [ref=e1555]: test_namespace_level_variables.zig
        - code [ref=e1557]: "var y: i32 = add(10, x); const x: i32 = add(12, 34); test \"container level variables\" { try expectEqual(46, x); try expectEqual(56, y); } fn add(a: i32, b: i32) i32 { return a + b; } const std = @import(\"std\"); const expectEqual = std.testing.expectEqual;"
      - figure "Shell" [ref=e1558]:
        - generic [ref=e1559]: Shell
        - generic [ref=e1561]: $ zig test test_namespace_level_variables.zig 1/1 test_namespace_level_variables.test.container level variables...OK All 1 tests passed.
      - paragraph [ref=e1562]:
        - text: Namespace level variables may be declared inside a
        - link "struct" [ref=e1563] [cursor=pointer]:
          - /url: "#struct"
        - text: ","
        - link "union" [ref=e1564] [cursor=pointer]:
          - /url: "#union"
        - text: ","
        - link "enum" [ref=e1565] [cursor=pointer]:
          - /url: "#enum"
        - text: ", or"
        - link "opaque" [ref=e1566] [cursor=pointer]:
          - /url: "#opaque"
        - text: ":"
      - figure "test_namespaced_variable.zig" [ref=e1567]:
        - generic [ref=e1568]: test_namespaced_variable.zig
        - code [ref=e1570]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"namespaced container level variable\" { try expectEqual(1235, foo()); try expectEqual(1236, foo()); } const S = struct { var x: i32 = 1234; }; fn foo() i32 { S.x += 1; return S.x; }"
      - figure "Shell" [ref=e1571]:
        - generic [ref=e1572]: Shell
        - generic [ref=e1574]: $ zig test test_namespaced_variable.zig 1/1 test_namespaced_variable.test.namespaced container level variable...OK All 1 tests passed.
      - heading "Locally-Scoped Global Variables" [level=3] [ref=e1575]:
        - link "Locally-Scoped Global Variables" [ref=e1576] [cursor=pointer]:
          - /url: "#toc-Locally-Scoped-Global-Variables"
      - paragraph [ref=e1577]:
        - text: It is also possible to have local variables with global lifetime by using
        - link "namespaces" [ref=e1578] [cursor=pointer]:
          - /url: "#Namespace"
        - text: inside functions.
      - figure "test_locally_scoped_global_variable.zig" [ref=e1579]:
        - generic [ref=e1580]: test_locally_scoped_global_variable.zig
        - code [ref=e1582]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"static local variable\" { try expectEqual(1235, foo()); try expectEqual(1236, foo()); } fn foo() i32 { const S = struct { var x: i32 = 1234; }; S.x += 1; return S.x; }"
