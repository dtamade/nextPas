          - /url: "#toc-Result-Locations"
      - paragraph [ref=e4906]: "In addition to result type information, every expression may be optionally assigned a result location: a pointer to which the value must be directly written. This system can be used to prevent intermediate copies when initializing data structures, which can be important for types which must have a fixed memory address (\"pinned\" types)."
      - paragraph [ref=e4907]:
        - text: When compiling the simple assignment expression
        - code [ref=e4908]: x = e
        - text: ", many languages would create the temporary value"
        - code [ref=e4909]: e
        - text: on the stack, and then assign it to
        - code [ref=e4910]: x
        - text: ", potentially performing a type coercion in the process. Zig approaches this differently. The expression"
        - code [ref=e4911]: e
        - text: is given a result type matching the type of
        - code [ref=e4912]: x
        - text: ", and a result location of"
        - code [ref=e4913]: "&x"
        - text: . For many syntactic forms of
        - code [ref=e4914]: e
        - text: ", this has no practical impact. However, it can have important semantic effects when working with more complex syntax forms."
      - paragraph [ref=e4915]:
        - text: For instance, if the expression
        - code [ref=e4916]: ".{ .a = x, .b = y }"
        - text: has a result location of
        - code [ref=e4917]: ptr
        - text: ", then"
        - code [ref=e4918]: x
        - text: is given a result location of
        - code [ref=e4919]: "&ptr.a"
        - text: ", and"
        - code [ref=e4920]: "y"
        - text: a result location of
        - code [ref=e4921]: "&ptr.b"
        - text: . Without this system, this expression would construct a temporary struct value entirely on the stack, and only then copy it to the destination address. In essence, Zig desugars the assignment
        - code [ref=e4922]: "foo = .{ .a = x, .b = y }"
        - text: to the two statements
        - code [ref=e4923]: foo.a = x; foo.b = y;
        - text: .
