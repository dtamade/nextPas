      - heading "String Literals and Unicode Code Point Literals" [level=3] [ref=e1200]:
        - link "String Literals and Unicode Code Point Literals" [ref=e1201] [cursor=pointer]:
          - /url: "#toc-String-Literals-and-Unicode-Code-Point-Literals"
      - paragraph [ref=e1202]:
        - text: String literals are constant single-item
        - link "Pointers" [ref=e1203] [cursor=pointer]:
          - /url: "#Pointers"
        - text: to null-terminated byte arrays. The type of string literals encodes both the length, and the fact that they are null-terminated, and thus they can be
        - link "coerced" [ref=e1204] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: to both
        - link "Slices" [ref=e1205] [cursor=pointer]:
          - /url: "#Slices"
        - text: and
        - link "Null-Terminated Pointers" [ref=e1206] [cursor=pointer]:
          - /url: "#Sentinel-Terminated-Pointers"
        - text: . Dereferencing string literals converts them to
        - link "Arrays" [ref=e1207] [cursor=pointer]:
          - /url: "#Arrays"
        - text: .
      - paragraph [ref=e1208]:
        - text: Because Zig source code is
        - link "UTF-8 encoded" [ref=e1209] [cursor=pointer]:
          - /url: "#Source-Encoding"
        - text: ", any non-ASCII bytes appearing within a string literal in source code carry their UTF-8 meaning into the content of the string in the Zig program; the bytes are not modified by the compiler. It is possible to embed non-UTF-8 bytes into a string literal using"
        - code [ref=e1210]: \xNN
        - text: notation.
      - paragraph [ref=e1211]: Indexing into a string containing non-ASCII bytes returns individual bytes, whether valid UTF-8 or not.
      - paragraph [ref=e1212]:
        - text: Unicode code point literals have type
        - code [ref=e1213]: comptime_int
        - text: ", the same as"
        - link "Integer Literals" [ref=e1214] [cursor=pointer]:
          - /url: "#Integer-Literals"
        - text: . All
        - link "Escape Sequences" [ref=e1215] [cursor=pointer]:
          - /url: "#Escape-Sequences"
        - text: are valid in both string literals and Unicode code point literals.
      - figure "string_literals.zig" [ref=e1216]:
        - generic [ref=e1217]: string_literals.zig
        - code [ref=e1219]: "const print = @import(\"std\").debug.print; const mem = @import(\"std\").mem; // will be used to compare bytes pub fn main() void { const bytes = \"hello\"; print(\"{}\\n\", .{@TypeOf(bytes)}); // *const [5:0]u8 print(\"{d}\\n\", .{bytes.len}); // 5 print(\"{c}\\n\", .{bytes[1]}); // 'e' print(\"{d}\\n\", .{bytes[5]}); // 0 print(\"{}\\n\", .{'e' == '\\x65'}); // true print(\"{d}\\n\", .{'\\u{1f4a9}'}); // 128169 print(\"{d}\\n\", .{'💯'}); // 128175 print(\"{u}\\n\", .{'⚡'}); print(\"{}\\n\", .{mem.eql(u8, \"hello\", \"h\\x65llo\")}); // true print(\"{}\\n\", .{mem.eql(u8, \"💯\", \"\\xf0\\x9f\\x92\\xaf\")}); // also true const invalid_utf8 = \"\\xff\\xfe\"; // non-UTF-8 strings are possible with \\xNN notation. print(\"0x{x}\\n\", .{invalid_utf8[1]}); // indexing them returns individual bytes... print(\"0x{x}\\n\", .{\"💯\"[1]}); // ...as does indexing part-way through non-ASCII characters }"
      - figure "Shell" [ref=e1220]:
        - generic [ref=e1221]: Shell
        - generic [ref=e1223]: $ zig build-exe string_literals.zig $ ./string_literals *const [5:0]u8 5 e 0 true 128169 128175 ⚡ true true 0xfe 0x9f
      - paragraph [ref=e1224]: "See also:"
