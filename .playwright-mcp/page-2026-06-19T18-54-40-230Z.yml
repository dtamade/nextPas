      - figure "Shell" [ref=e1483]:
        - generic [ref=e1484]: Shell
        - generic [ref=e1486]: "$ zig test testing_detect_leak.zig 1/1 testing_detect_leak.test.detect leak...OK [SafeAllocator] (err): leaked [addr: 7f5e01abc010, len: 132 (0x84) align: 4] allocated at: /home/ci/work/zig-bootstrap/out/host/lib/zig/std/array_list.zig:1232:56: 0x124c897 in ensureTotalCapacityPrecise (std.zig) const new_memory = try gpa.alignedAlloc(T, alignment, new_capacity); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/std/array_list.zig:1208:51: 0x124c4e9 in ensureTotalCapacity (std.zig) return self.ensureTotalCapacityPrecise(gpa, growCapacity(new_capacity)); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/std/array_list.zig:1262:41: 0x124bacd in addOne (std.zig) try self.ensureTotalCapacity(gpa, newlen); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/std/array_list.zig:901:49: 0x124b967 in append (std.zig) const new_item_ptr = try self.addOne(gpa); ^ /home/ci/work/zig-bootstrap/zig/doc/langref/testing_detect_leak.zig:7:20: 0x124b7c1 in test.detect leak (testing_detect_leak.zig) try list.append(gpa, '☔'); ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/compiler/test_runner.zig:296:25: 0x11ff831 in mainTerminal (test_runner.zig) if (test_fn.func()) |_| { ^ /home/ci/work/zig-bootstrap/out/host/lib/zig/compiler/test_runner.zig:73:28: 0x11ff002 in main (test_runner.zig) return mainTerminal(init); ^ (additional stack frames may have been skipped...) All 1 tests passed. 1 errors were logged. 1 tests leaked memory. error: the following test command failed with exit code 1: /home/ci/work/zig-bootstrap/out/zig-local-cache/o/08ed41426480de57be7e14bd72f7c5f8/test --seed=0xbac59d95"
      - paragraph [ref=e1487]: "See also:"
