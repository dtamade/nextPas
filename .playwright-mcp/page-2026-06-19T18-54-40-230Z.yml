          - /url: "#toc-Thread-Local-Variables"
      - paragraph [ref=e1589]:
        - text: A variable may be specified to be a thread-local variable using the
        - code [ref=e1590]: threadlocal
        - text: "keyword, which makes each thread work with a separate instance of the variable:"
      - figure "test_thread_local_variables.zig" [ref=e1591]:
        - generic [ref=e1592]: test_thread_local_variables.zig
        - code [ref=e1594]: "const std = @import(\"std\"); const assert = std.debug.assert; threadlocal var x: i32 = 1234; test \"thread local storage\" { const thread1 = try std.Thread.spawn(.{}, testTls, .{}); const thread2 = try std.Thread.spawn(.{}, testTls, .{}); testTls(); thread1.join(); thread2.join(); } fn testTls() void { assert(x == 1234); x += 1; assert(x == 1235); }"
      - figure "Shell" [ref=e1595]:
        - generic [ref=e1596]: Shell
        - generic [ref=e1598]: $ zig test test_thread_local_variables.zig 1/1 test_thread_local_variables.test.thread local storage...OK All 1 tests passed.
      - paragraph [ref=e1599]:
        - text: For
        - link "Single Threaded Builds" [ref=e1600] [cursor=pointer]:
          - /url: "#Single-Threaded-Builds"
        - text: ", all thread local variables are treated as regular"
        - link "Namespace Level Variables" [ref=e1601] [cursor=pointer]:
          - /url: "#Namespace-Level-Variables"
        - text: .
      - paragraph [ref=e1602]:
        - text: Thread local variables may not be
        - code [ref=e1603]: const
        - text: .
      - heading "Local Variables" [level=3] [ref=e1604]:
        - link "Local Variables" [ref=e1605] [cursor=pointer]:
          - /url: "#toc-Local-Variables"
      - paragraph [ref=e1606]:
        - text: Local variables occur inside
        - link "Functions" [ref=e1607] [cursor=pointer]:
          - /url: "#Functions"
        - text: ","
        - link "comptime" [ref=e1608] [cursor=pointer]:
          - /url: "#comptime"
        - text: blocks, and labeled
        - link "Blocks" [ref=e1609] [cursor=pointer]:
          - /url: "#Blocks"
        - text: .
      - paragraph [ref=e1610]:
        - text: When a local variable is
        - code [ref=e1611]: const
        - text: ", it means that after initialization, the variable's value will not change. If the initialization value of a"
        - code [ref=e1612]: const
        - text: variable is
        - link "comptime" [ref=e1613] [cursor=pointer]:
          - /url: "#comptime"
        - text: "-known, then the variable is also"
        - code [ref=e1614]: comptime
        - text: "-known."
      - paragraph [ref=e1615]:
        - text: A local variable may be qualified with the
        - code [ref=e1616]: comptime
        - text: keyword. This causes the variable's value to be
        - code [ref=e1617]: comptime
        - text: "-known, and all loads and stores of the variable to happen during semantic analysis of the program, rather than at runtime. All variables declared in a"
        - code [ref=e1618]: comptime
        - text: expression are implicitly
        - code [ref=e1619]: comptime
        - text: variables.
      - figure "test_comptime_variables.zig" [ref=e1620]:
        - generic [ref=e1621]: test_comptime_variables.zig
        - code [ref=e1623]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"comptime vars\" { var x: i32 = 1; comptime var y: i32 = 1; x += 1; y += 1; try expectEqual(2, x); try expectEqual(2, y); if (y != 2) { // This compile error never triggers because y is a comptime variable, // and so `y != 2` is a comptime value, and this if is statically evaluated. @compileError(\"wrong y value\"); } }"
      - figure "Shell" [ref=e1624]:
        - generic [ref=e1625]: Shell
        - generic [ref=e1627]: $ zig test test_comptime_variables.zig 1/1 test_comptime_variables.test.comptime vars...OK All 1 tests passed.
      - heading "Integers" [level=2] [ref=e1628]:
        - link "Integers" [ref=e1629] [cursor=pointer]:
          - /url: "#toc-Integers"
      - heading "Integer Literals" [level=3] [ref=e1630]:
        - link "Integer Literals" [ref=e1631] [cursor=pointer]:
          - /url: "#toc-Integer-Literals"
      - figure "integer_literals.zig" [ref=e1632]:
        - generic [ref=e1633]: integer_literals.zig
        - code [ref=e1635]: const decimal_int = 98222; const hex_int = 0xff; const another_hex_int = 0xFF; const octal_int = 0o755; const binary_int = 0b11110000; // underscores may be placed between two digits as a visual separator const one_billion = 1_000_000_000; const binary_mask = 0b1_1111_1111; const permissions = 0o7_5_5; const big_address = 0xFF80_0000_0000_0000;
      - heading "Runtime Integer Values" [level=3] [ref=e1636]:
        - link "Runtime Integer Values" [ref=e1637] [cursor=pointer]:
          - /url: "#toc-Runtime-Integer-Values"
      - paragraph [ref=e1638]: Integer literals have no size limitation, and if any Illegal Behavior occurs, the compiler catches it.
      - paragraph [ref=e1639]:
        - text: However, once an integer value is no longer known at compile-time, it must have a known size, and is vulnerable to safety-checked
        - link "Illegal Behavior" [ref=e1640] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: .
      - figure "runtime_vs_comptime.zig" [ref=e1641]:
        - generic [ref=e1642]: runtime_vs_comptime.zig
        - code [ref=e1644]: "fn divide(a: i32, b: i32) i32 { return a / b; }"
      - paragraph [ref=e1645]:
        - text: In this function, values
        - code [ref=e1646]: a
        - text: and
        - code [ref=e1647]: b
        - text: are known only at runtime, and thus this division operation is vulnerable to both
        - link "Integer Overflow" [ref=e1648] [cursor=pointer]:
          - /url: "#Integer-Overflow"
        - text: and
        - link "Division by Zero" [ref=e1649] [cursor=pointer]:
          - /url: "#Division-by-Zero"
        - text: .
      - paragraph [ref=e1650]:
        - text: Operators such as
        - code [ref=e1651]: +
        - text: and
        - code [ref=e1652]: "-"
        - text: cause
        - link "Illegal Behavior" [ref=e1653] [cursor=pointer]:
          - /url: "#Illegal-Behavior"
        - text: on integer overflow. Alternative operators are provided for wrapping and saturating arithmetic on all targets.
        - code [ref=e1654]: +%
        - text: and
        - code [ref=e1655]: "-%"
        - text: perform wrapping arithmetic while
        - code [ref=e1656]: +|
        - text: and
        - code [ref=e1657]: "-|"
        - text: perform saturating arithmetic.
      - paragraph [ref=e1658]:
        - text: Zig supports arbitrary bit-width integers, referenced by using an identifier of
        - code [ref=e1659]: i
        - text: or
        - code [ref=e1660]: u
        - text: followed by digits. For example, the identifier
        - code [ref=e1661]: i7
        - text: refers to a signed 7-bit integer. The maximum allowed bit-width of an integer type is
        - code [ref=e1662]: "65535"
        - text: . For signed integer types, Zig uses a
        - link "two's complement" [ref=e1663] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/Two's_complement
        - text: representation.
      - paragraph [ref=e1664]: "See also:"
      - list [ref=e1665]:
        - listitem [ref=e1666]:
          - link "Wrapping Operations" [ref=e1667] [cursor=pointer]:
            - /url: "#Wrapping-Operations"
      - heading "Floats" [level=2] [ref=e1668]:
        - link "Floats" [ref=e1669] [cursor=pointer]:
          - /url: "#toc-Floats"
      - paragraph [ref=e1670]: "Zig has the following floating point types:"
      - list [ref=e1671]:
        - listitem [ref=e1672]:
          - code [ref=e1673]: f16
          - text: "- IEEE-754-2008 binary16"
        - listitem [ref=e1674]:
          - code [ref=e1675]: f32
          - text: "- IEEE-754-2008 binary32"
        - listitem [ref=e1676]:
          - code [ref=e1677]: f64
          - text: "- IEEE-754-2008 binary64"
        - listitem [ref=e1678]:
          - code [ref=e1679]: f80
          - text: "- IEEE-754-2008 80-bit extended precision"
        - listitem [ref=e1680]:
          - code [ref=e1681]: f128
          - text: "- IEEE-754-2008 binary128"
        - listitem [ref=e1682]:
          - code [ref=e1683]: c_longdouble
          - text: "- matches"
          - code [ref=e1684]: long double
          - text: for the target C ABI
      - heading "Float Literals" [level=3] [ref=e1685]:
        - link "Float Literals" [ref=e1686] [cursor=pointer]:
          - /url: "#toc-Float-Literals"
      - paragraph [ref=e1687]:
        - text: Float literals have type
        - code [ref=e1688]: comptime_float
        - text: which is guaranteed to have the same precision and operations of the largest other floating point type, which is
        - code [ref=e1689]: f128
        - text: .
      - paragraph [ref=e1690]:
        - text: Float literals
        - link "coerce" [ref=e1691] [cursor=pointer]:
          - /url: "#Type-Coercion"
        - text: to any floating point type, and to any
        - link "integer" [ref=e1692] [cursor=pointer]:
          - /url: "#Integers"
        - text: type when there is no fractional component.
      - figure "float_literals.zig" [ref=e1693]:
        - generic [ref=e1694]: float_literals.zig
        - code [ref=e1696]: const floating_point = 123.0E+77; const another_float = 123.0; const yet_another = 123.0e+77; const hex_floating_point = 0x103.70p-5; const another_hex_float = 0x103.70; const yet_another_hex_float = 0x103.70P-5; // underscores may be placed between two digits as a visual separator const lightspeed = 299_792_458.000_000; const nanosecond = 0.000_000_001; const more_hex = 0x1234_5678.9ABC_CDEFp-10;
      - paragraph [ref=e1697]: "There is no syntax for NaN, infinity, or negative infinity. For these special values, one must use the standard library:"
      - figure "float_special_values.zig" [ref=e1698]:
        - generic [ref=e1699]: float_special_values.zig
        - code [ref=e1701]: const std = @import("std"); const inf = std.math.inf(f32); const negative_inf = -std.math.inf(f64); const nan = std.math.nan(f128);
      - heading "Floating Point Operations" [level=3] [ref=e1702]:
        - link "Floating Point Operations" [ref=e1703] [cursor=pointer]:
          - /url: "#toc-Floating-Point-Operations"
      - paragraph [ref=e1704]:
        - text: By default floating point operations use
        - code [ref=e1705]: .strict
        - text: mode, but you can switch to
        - code [ref=e1706]: .optimized
        - text: "mode on a per-block basis:"
      - figure "float_mode_obj.zig" [ref=e1707]:
        - generic [ref=e1708]: float_mode_obj.zig
        - code [ref=e1710]: "const std = @import(\"std\"); const big = @as(f64, 1 << 40); export fn foo_strict(x: f64) f64 { return x + big - big; } export fn foo_optimized(x: f64) f64 { @setFloatMode(.optimized); return x + big - big; }"
      - figure "Shell" [ref=e1711]:
        - generic [ref=e1712]: Shell
        - generic [ref=e1714]: $ zig build-obj float_mode_obj.zig -O ReleaseFast
      - paragraph [ref=e1715]: For this test we have to separate code into two object files - otherwise the optimizer figures out all the values at compile-time, which operates in strict mode.
      - figure "float_mode_exe.zig" [ref=e1716]:
        - generic [ref=e1717]: float_mode_exe.zig
        - code [ref=e1719]: "const print = @import(\"std\").debug.print; extern fn foo_strict(x: f64) f64; extern fn foo_optimized(x: f64) f64; pub fn main() void { const x = 0.001; print(\"optimized = {}\\n\", .{foo_optimized(x)}); print(\"strict = {}\\n\", .{foo_strict(x)}); }"
      - paragraph [ref=e1720]: "See also:"
      - list [ref=e1721]:
