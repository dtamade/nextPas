      - paragraph [ref=e4336]:
        - text: An optional is created by putting
        - code [ref=e4337]: "?"
        - text: "in front of a type. You can use compile-time reflection to access the child type of an optional:"
      - figure "test_optional_type.zig" [ref=e4338]:
        - generic [ref=e4339]: test_optional_type.zig
        - code [ref=e4341]: "const expectEqual = @import(\"std\").testing.expectEqual; test \"optional type\" { // Declare an optional and coerce from null: var foo: ?i32 = null; // Coerce from child type of an optional foo = 1234; // Use compile-time reflection to access the child type of the optional: try comptime expectEqual(i32, @typeInfo(@TypeOf(foo)).optional.child); }"
      - figure "Shell" [ref=e4342]:
