    - main [ref=e773]:
      - heading "Introduction" [level=2] [ref=e774]:
        - link "Introduction" [ref=e775] [cursor=pointer]:
          - /url: "#toc-Introduction"
      - paragraph [ref=e776]:
        - link "Zig" [ref=e777] [cursor=pointer]:
          - /url: https://ziglang.org
        - text: is a general-purpose programming language and toolchain for maintaining
        - strong [ref=e778]: robust
        - text: ","
        - strong [ref=e779]: optimal
        - text: ", and"
        - strong [ref=e780]: reusable
        - text: software.
      - generic [ref=e781]:
        - term [ref=e782]: Robust
        - definition [ref=e783]: Behavior is correct even for edge cases such as out of memory.
        - term [ref=e784]: Optimal
        - definition [ref=e785]: Write programs the best way they can behave and perform.
        - term [ref=e786]: Reusable
        - definition [ref=e787]: The same code works in many environments which have different constraints.
        - term [ref=e788]: Maintainable
        - definition [ref=e789]: Precisely communicate intent to the compiler and other programmers. The language imposes a low overhead to reading code and is resilient to changing requirements and environments.
      - paragraph [ref=e790]: Often the most efficient way to learn something new is to see examples, so this documentation shows how to use each of Zig's features. It is all on one page so you can search with your browser's search tool.
      - paragraph [ref=e791]: The code samples in this document are compiled and tested as part of the main test suite of Zig.
      - paragraph [ref=e792]: This HTML document depends on no external files, so you can use it offline.
      - heading "Zig Standard Library" [level=2] [ref=e793]:
        - link "Zig Standard Library" [ref=e794] [cursor=pointer]:
          - /url: "#toc-Zig-Standard-Library"
      - paragraph [ref=e795]:
        - text: The
        - link "Zig Standard Library" [ref=e796] [cursor=pointer]:
          - /url: https://ziglang.org/documentation/master/std/
        - text: has its own documentation.
      - paragraph [ref=e797]: Zig's Standard Library contains commonly used algorithms, data structures, and definitions to help you build programs or libraries. You will see many examples of Zig's Standard Library used in this documentation. To learn more about the Zig Standard Library, visit the link above.
      - paragraph [ref=e798]: "Alternatively, the Zig Standard Library documentation is provided with each Zig distribution. It can be rendered via a local webserver with:"
      - figure "Shell" [ref=e799]:
        - generic [ref=e800]: Shell
        - generic [ref=e802]: zig std
      - heading "Hello World" [level=2] [ref=e803]:
        - link "Hello World" [ref=e804] [cursor=pointer]:
          - /url: "#toc-Hello-World"
      - figure "hello.zig" [ref=e805]:
        - generic [ref=e806]: hello.zig
        - code [ref=e808]: "const std = @import(\"std\"); pub fn main(init: std.process.Init) !void { try std.Io.File.stdout().writeStreamingAll(init.io, \"Hello, World!\\n\"); }"
      - figure "Shell" [ref=e809]:
        - generic [ref=e810]: Shell
        - generic [ref=e812]: $ zig build-exe hello.zig $ ./hello Hello, World!
      - paragraph [ref=e813]: "Most of the time, it is more appropriate to write to stderr rather than stdout, and whether or not the message is successfully written to the stream is irrelevant. Also, formatted printing often comes in handy. For this common case, there is a simpler API:"
      - figure "hello_again.zig" [ref=e814]:
        - generic [ref=e815]: hello_again.zig
        - code [ref=e817]: "const std = @import(\"std\"); pub fn main() void { std.debug.print(\"Hello, {s}!\\n\", .{\"World\"}); }"
      - figure "Shell" [ref=e818]:
        - generic [ref=e819]: Shell
        - generic [ref=e821]: $ zig build-exe hello_again.zig $ ./hello_again Hello, World!
      - paragraph [ref=e822]:
        - text: In this case, the
        - code [ref=e823]: "!"
        - text: may be omitted from the return type of
        - code [ref=e824]: main
        - text: because no errors are returned from the function.
      - paragraph [ref=e825]: "See also:"
      - list [ref=e826]:
        - listitem [ref=e827]:
          - link "Values" [ref=e828] [cursor=pointer]:
            - /url: "#Values"
        - listitem [ref=e829]:
