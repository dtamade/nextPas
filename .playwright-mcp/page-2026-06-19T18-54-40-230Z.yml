      - paragraph [ref=e1384]:
        - text: Code written within one or more
        - code [ref=e1385]: test
        - text: "declarations can be used to ensure behavior meets expectations:"
      - figure "testing_introduction.zig" [ref=e1386]:
        - generic [ref=e1387]: testing_introduction.zig
        - code [ref=e1389]: "const std = @import(\"std\"); test \"expect addOne adds one to 41\" { // The Standard Library contains useful functions to help create tests. // `expect` is a function that verifies its argument is true. // It will return an error if its argument is false to indicate a failure. // `try` is used to return an error to the test runner to notify it that the test failed. try std.testing.expect(addOne(41) == 42); // However, in most cases it is more convenient to use a more specific function like `expectEqual`. // This gives you much clearer and more helpful error messages when a test fails. try std.testing.expectEqual(42, addOne(41)); } test addOne { // A test name can also be written using an identifier. // This is a doctest, and serves as documentation for `addOne`. try std.testing.expectEqual(42, addOne(41)); } /// The function `addOne` adds one to the number given as its argument. fn addOne(number: i32) i32 { return number + 1; }"
      - figure "Shell" [ref=e1390]:
        - generic [ref=e1391]: Shell
        - generic [ref=e1393]: $ zig test testing_introduction.zig 1/2 testing_introduction.test.expect addOne adds one to 41...OK 2/2 testing_introduction.decltest.addOne...OK All 2 tests passed.
      - paragraph [ref=e1394]:
        - text: The
        - code [ref=e1395]: testing_introduction.zig
        - text: code sample tests the
        - link "function" [ref=e1396] [cursor=pointer]:
          - /url: "#Functions"
        - code [ref=e1397]: addOne
        - text: to ensure that it returns
        - code [ref=e1398]: "42"
        - text: given the input
        - code [ref=e1399]: "41"
        - text: . From this test's perspective, the
        - code [ref=e1400]: addOne
        - text: function is said to be
        - emphasis [ref=e1401]: code under test
        - text: .
      - paragraph [ref=e1402]:
        - text: zig test is a tool that creates and runs a test build. By default, it builds and runs an executable program using the
        - emphasis [ref=e1403]: default test runner
        - text: provided by the
        - link "Zig Standard Library" [ref=e1404] [cursor=pointer]:
          - /url: "#Zig-Standard-Library"
        - text: as its main entry point. During the build,
        - code [ref=e1405]: test
        - text: declarations found while
        - link "resolving" [ref=e1406] [cursor=pointer]:
          - /url: "#File-and-Declaration-Discovery"
        - text: the given Zig source file are included for the default test runner to run and report on.
      - complementary [ref=e1407]:
        - text: This documentation discusses the features of the default test runner as provided by the Zig Standard Library. Its source code is located in
        - code [ref=e1408]: lib/compiler/test_runner.zig
        - text: .
      - paragraph [ref=e1409]: "The shell output shown above displays two lines after the zig test command. These lines are printed to standard error by the default test runner:"
      - generic [ref=e1410]:
        - term [ref=e1411]: 1/2 testing_introduction.test.expect addOne adds one to 41...
        - definition [ref=e1412]: Lines like this indicate which test, out of the total number of tests, is being run. In this case, 1/2 indicates that the first test, out of a total of two tests, is being run. Note that, when the test runner program's standard error is output to the terminal, these lines are cleared when a test succeeds.
        - term [ref=e1413]: 2/2 testing_introduction.decltest.addOne...
        - definition [ref=e1414]: When the test name is an identifier, the default test runner uses the text decltest instead of test.
        - term [ref=e1415]: All 2 tests passed.
        - definition [ref=e1416]: This line indicates the total number of tests that have passed.
      - heading "Test Declarations" [level=3] [ref=e1417]:
        - link "Test Declarations" [ref=e1418] [cursor=pointer]:
          - /url: "#toc-Test-Declarations"
      - paragraph [ref=e1419]:
        - text: Test declarations contain the
        - link "keyword" [ref=e1420] [cursor=pointer]:
          - /url: "#Keyword-Reference"
        - code [ref=e1421]: test
        - text: ", followed by an optional name written as a"
        - link "string literal" [ref=e1422] [cursor=pointer]:
          - /url: "#String-Literals-and-Unicode-Code-Point-Literals"
        - text: or an
        - link "identifier" [ref=e1423] [cursor=pointer]:
          - /url: "#Identifiers"
        - text: ", followed by a"
        - link "block" [ref=e1424] [cursor=pointer]:
          - /url: "#Blocks"
        - text: containing any valid Zig code that is allowed in a
        - link "function" [ref=e1425] [cursor=pointer]:
          - /url: "#Functions"
        - text: .
      - paragraph [ref=e1426]:
        - text: Non-named test blocks always run during test builds and are exempt from
        - link "Skip Tests" [ref=e1427] [cursor=pointer]:
          - /url: "#Skip-Tests"
        - text: .
      - paragraph [ref=e1428]:
        - text: Test declarations are similar to
        - link "Functions" [ref=e1429] [cursor=pointer]:
          - /url: "#Functions"
        - text: ": they have a return type and a block of code. The implicit return type of"
        - code [ref=e1430]: test
        - text: is the
        - link "Error Union Type" [ref=e1431] [cursor=pointer]:
          - /url: "#Error-Union-Type"
        - code [ref=e1432]: anyerror!void
        - text: ", and it cannot be changed. When a Zig source file is not built using the zig test tool, the test declarations are omitted from the build."
      - paragraph [ref=e1433]: Test declarations can be written in the same file, where code under test is written, or in a separate Zig source file. Since test declarations are top-level declarations, they are order-independent and can be written before or after the code under test.
      - paragraph [ref=e1434]: "See also:"
      - list [ref=e1435]:
        - listitem [ref=e1436]:
          - link "The Global Error Set" [ref=e1437] [cursor=pointer]:
            - /url: "#The-Global-Error-Set"
        - listitem [ref=e1438]:
          - link "Grammar" [ref=e1439] [cursor=pointer]:
            - /url: "#Grammar"
      - heading "Doctests" [level=4] [ref=e1440]:
        - link "Doctests" [ref=e1441] [cursor=pointer]:
          - /url: "#toc-Doctests"
      - paragraph [ref=e1442]:
        - text: Test declarations named using an identifier are
        - emphasis [ref=e1443]: doctests
        - text: . The identifier must refer to another declaration in scope. A doctest, like a
        - link "doc comment" [ref=e1444] [cursor=pointer]:
          - /url: "#Doc-Comments"
        - text: ", serves as documentation for the associated declaration, and will appear in the generated documentation for the declaration."
      - paragraph [ref=e1445]: An effective doctest should be self-contained and focused on the declaration being tested, answering questions a new user might have about its interface or intended usage, while avoiding unnecessary or confusing details. A doctest is not a substitute for a doc comment, but rather a supplement and companion providing a testable, code-driven example, verified by zig test.
      - heading "Test Failure" [level=3] [ref=e1446]:
        - link "Test Failure" [ref=e1447] [cursor=pointer]:
          - /url: "#toc-Test-Failure"
      - paragraph [ref=e1448]:
        - text: The default test runner checks for an
        - link "error" [ref=e1449] [cursor=pointer]:
          - /url: "#Errors"
        - text: returned from a test. When a test returns an error, the test is considered a failure and its
        - link "error return trace" [ref=e1450] [cursor=pointer]:
          - /url: "#Error-Return-Traces"
        - text: is output to standard error. The total number of failures will be reported after all tests have run.
      - figure "testing_failure.zig" [ref=e1451]:
