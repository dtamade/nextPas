      - heading "Vectors" [level=2] [ref=e2506]:
        - link "Vectors" [ref=e2507] [cursor=pointer]:
          - /url: "#toc-Vectors"
      - paragraph [ref=e2508]:
        - text: A vector is a group of booleans,
        - link "Integers" [ref=e2509] [cursor=pointer]:
          - /url: "#Integers"
        - text: ","
        - link "Floats" [ref=e2510] [cursor=pointer]:
          - /url: "#Floats"
        - text: ", or"
        - link "Pointers" [ref=e2511] [cursor=pointer]:
          - /url: "#Pointers"
        - text: which are operated on in parallel, using SIMD instructions if possible. Vector types are created with the builtin function
        - link "@Vector" [ref=e2512] [cursor=pointer]:
          - /url: "#Vector"
        - text: .
      - paragraph [ref=e2513]:
        - text: Vectors generally support the same builtin operators as their underlying base types. The only exception to this is the keywords
        - code [ref=e2514]: and
        - text: and
        - code [ref=e2515]: or
        - text: "on vectors of bools, since these operators affect control flow, which is not allowed for vectors. All other operations are performed element-wise, and return a vector of the same length as the input vectors. This includes:"
      - list [ref=e2516]:
        - listitem [ref=e2517]:
          - text: Arithmetic (
          - code [ref=e2518]: +
          - text: ","
          - code [ref=e2519]: "-"
          - text: ","
          - code [ref=e2520]: /
          - text: ","
          - code [ref=e2521]: "*"
          - text: ","
          - code [ref=e2522]: "@divFloor"
          - text: ","
          - code [ref=e2523]: "@sqrt"
          - text: ","
          - code [ref=e2524]: "@ceil"
          - text: ","
          - code [ref=e2525]: "@log"
          - text: ", etc.)"
        - listitem [ref=e2526]:
          - text: Bitwise operators (
          - code [ref=e2527]: ">>"
          - text: ","
          - code [ref=e2528]: <<
          - text: ","
          - code [ref=e2529]: "&"
          - text: ","
          - code [ref=e2530]: "|"
          - text: ","
          - code [ref=e2531]: ~
          - text: ", etc.)"
        - listitem [ref=e2532]:
          - text: Comparison operators (
          - code [ref=e2533]: <
          - text: ","
          - code [ref=e2534]: ">"
          - text: ","
          - code [ref=e2535]: ==
          - text: ", etc.)"
        - listitem [ref=e2536]:
          - text: Boolean not (
          - code [ref=e2537]: "!"
          - text: )
      - paragraph [ref=e2538]:
        - text: It is prohibited to use a math operator on a mixture of scalars (individual numbers) and vectors. Zig provides the
        - link "@splat" [ref=e2539] [cursor=pointer]:
          - /url: "#splat"
        - text: builtin to easily convert from scalars to vectors, and it supports
        - link "@reduce" [ref=e2540] [cursor=pointer]:
          - /url: "#reduce"
        - text: and array indexing syntax to convert from vectors to scalars. Vectors also support assignment to and from fixed-length arrays with comptime-known length.
      - paragraph [ref=e2541]:
        - text: For rearranging elements within and between vectors, Zig provides the
        - link "@shuffle" [ref=e2542] [cursor=pointer]:
          - /url: "#shuffle"
        - text: and
        - link "@select" [ref=e2543] [cursor=pointer]:
          - /url: "#select"
        - text: functions.
      - paragraph [ref=e2544]: Operations on vectors shorter than the target machine's native SIMD size will typically compile to single SIMD instructions, while vectors longer than the target machine's native SIMD size will compile to multiple SIMD instructions. If a given operation doesn't have SIMD support on the target architecture, the compiler will default to operating on each vector element one at a time. Zig supports any comptime-known vector length up to 2^32-1, although small powers of two (2-64) are most typical. Note that excessively long vector lengths (e.g. 2^20) may result in compiler crashes on current versions of Zig.
      - figure "test_vector.zig" [ref=e2545]:
        - generic [ref=e2546]: test_vector.zig
        - code [ref=e2548]: "const std = @import(\"std\"); const expectEqual = std.testing.expectEqual; test \"Basic vector usage\" { // Vectors have a compile-time known length and base type. const a = @Vector(4, i32){ 1, 2, 3, 4 }; const b = @Vector(4, i32){ 5, 6, 7, 8 }; // Math operations take place element-wise. const c = a + b; // Individual vector elements can be accessed using array indexing syntax. try expectEqual(6, c[0]); try expectEqual(8, c[1]); try expectEqual(10, c[2]); try expectEqual(12, c[3]); } test \"Conversion between vectors, arrays, and slices\" { // Vectors can be coerced to arrays, and vice versa. const arr1: [4]f32 = [_]f32{ 1.1, 3.2, 4.5, 5.6 }; const vec: @Vector(4, f32) = arr1; const arr2: [4]f32 = vec; try expectEqual(arr1, arr2); // You can also assign from a slice with comptime-known length to a vector using .* const vec2: @Vector(2, f32) = arr1[1..3].*; const slice: []const f32 = &arr1; var offset: u32 = 1; // var to make it runtime-known _ = &offset; // suppress 'var is never mutated' error // To extract a comptime-known length from a runtime-known offset, // first extract a new slice from the starting offset, then an array of // comptime-known length const vec3: @Vector(2, f32) = slice[offset..][0..2].*; try expectEqual(slice[offset], vec2[0]); try expectEqual(slice[offset + 1], vec2[1]); try expectEqual(vec2, vec3); }"
      - figure "Shell" [ref=e2549]:
        - generic [ref=e2550]: Shell
        - generic [ref=e2552]: $ zig test test_vector.zig 1/2 test_vector.test.Basic vector usage...OK 2/2 test_vector.test.Conversion between vectors, arrays, and slices...OK All 2 tests passed.
