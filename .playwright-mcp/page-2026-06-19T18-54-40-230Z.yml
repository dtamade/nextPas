      - paragraph [ref=e5040]: Zig places importance on the concept of whether an expression is known at compile-time. There are a few different places this concept is used, and these building blocks are used to keep the language small, readable, and powerful.
      - heading "Introducing the Compile-Time Concept" [level=3] [ref=e5041]:
        - link "Introducing the Compile-Time Concept" [ref=e5042] [cursor=pointer]:
          - /url: "#toc-Introducing-the-Compile-Time-Concept"
      - heading "Compile-Time Parameters" [level=4] [ref=e5043]:
        - link "Compile-Time Parameters" [ref=e5044] [cursor=pointer]:
          - /url: "#toc-Compile-Time-Parameters"
      - paragraph [ref=e5045]: Compile-time parameters is how Zig implements generics. It is compile-time duck typing.
      - figure "compile-time_duck_typing.zig" [ref=e5046]:
        - generic [ref=e5047]: compile-time_duck_typing.zig
        - code [ref=e5049]: "fn max(comptime T: type, a: T, b: T) T { return if (a > b) a else b; } fn gimmeTheBiggerFloat(a: f32, b: f32) f32 { return max(f32, a, b); } fn gimmeTheBiggerInteger(a: u64, b: u64) u64 { return max(u64, a, b); }"
      - paragraph [ref=e5050]:
        - text: In Zig, types are first-class citizens. They can be assigned to variables, passed as parameters to functions, and returned from functions. However, they can only be used in expressions which are known at
        - emphasis [ref=e5051]: compile-time
        - text: ", which is why the parameter"
        - code [ref=e5052]: T
        - text: in the above snippet must be marked with
        - code [ref=e5053]: comptime
        - text: .
      - paragraph [ref=e5054]:
        - text: A
        - code [ref=e5055]: comptime
        - text: "parameter means that:"
      - list [ref=e5056]:
        - listitem [ref=e5057]: At the callsite, the value must be known at compile-time, or it is a compile error.
        - listitem [ref=e5058]: In the function definition, the value is known at compile-time.
      - paragraph [ref=e5059]: "For example, if we were to introduce another function to the above snippet:"
      - figure "test_unresolved_comptime_value.zig" [ref=e5060]:
        - generic [ref=e5061]: test_unresolved_comptime_value.zig
        - code [ref=e5063]: "fn max(comptime T: type, a: T, b: T) T { return if (a > b) a else b; } test \"try to pass a runtime type\" { foo(false); } fn foo(condition: bool) void { const result = max(if (condition) f32 else u64, 1234, 5678); _ = result; }"
