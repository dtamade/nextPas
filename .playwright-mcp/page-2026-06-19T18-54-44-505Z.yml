              - generic [ref=e279]: First of all a union in zig has no defined memory layout. The compiler can for example add hidden fields in the background (this is for example done for untagged unions to detect a wrong field access). In order to get defined memory layout you'd need to use a packed or extern union. Secondly there is no library functionality for this.
