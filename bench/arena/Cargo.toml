[package]
name = "bench_arena"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "bench_arena"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
