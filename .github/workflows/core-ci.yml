name: Core CI

on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core-ci.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: core

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      - name: Cache FPC trunk
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: ~/fpc-trunk
          key: fpc-trunk-linux-x86_64-v4

      - name: Build FPC trunk from source
        if: steps.cache-fpc.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch main https://gitlab.com/freepascal.org/fpc/source.git fpc-src
          cd fpc-src
          make all FPCDIR=$(pwd) PP=$(which ppcx64) OPT="-O2"
          mkdir -p ~/fpc-trunk/bin ~/fpc-trunk/lib
          make install FPCDIR=$(pwd) PP=$(pwd)/compiler/ppcx64 PREFIX=~/fpc-trunk

      - name: Setup FPC config and PATH
        run: |
          $HOME/fpc-trunk/bin/fpcmkcfg -d "basepath=$HOME/fpc-trunk/lib/fpc/\$fpcversion" -o $HOME/fpc-trunk/bin/fpc.cfg
          cp $HOME/fpc-trunk/bin/fpc.cfg $HOME/fpc-trunk/lib/fpc/3.3.1/fpc.cfg
          sudo cp $HOME/fpc-trunk/bin/fpc.cfg /etc/fpc.cfg
          echo "$HOME/fpc-trunk/bin" >> $GITHUB_PATH
          echo "$HOME/fpc-trunk/lib/fpc/3.3.1" >> $GITHUB_PATH

      - name: Verify FPC
        run: fpc -iV

      - name: Run all tests
        run: make -C .. core-ci-test

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap FPC
        run: brew install fpc

      - name: Cache FPC trunk
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: ~/fpc-trunk
          key: fpc-trunk-macos-aarch64-v7

      - name: Build FPC trunk from source
        if: steps.cache-fpc.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch main https://gitlab.com/freepascal.org/fpc/source.git fpc-src
          cd fpc-src
          PP=$(find /usr/local/lib/fpc /opt/homebrew/lib/fpc -name 'ppca64' -o -name 'ppcaarch64' 2>/dev/null | head -1)
          if [ -z "$PP" ]; then PP=$(which ppca64 2>/dev/null || which ppcaarch64 2>/dev/null); fi
          SDK_PATH=$(xcrun --show-sdk-path)
          make all FPCDIR=$(pwd) PP="$PP" OPT="-O2 -XR$SDK_PATH"
          mkdir -p ~/fpc-trunk
          make install FPCDIR=$(pwd) PP=$(pwd)/compiler/ppca64 PREFIX=~/fpc-trunk

      - name: Setup FPC config and PATH
        run: |
          $HOME/fpc-trunk/bin/fpcmkcfg -d "basepath=$HOME/fpc-trunk/lib/fpc/\$fpcversion" -o $HOME/fpc-trunk/bin/fpc.cfg
          echo "-XR$(xcrun --show-sdk-path)" >> $HOME/fpc-trunk/bin/fpc.cfg
          # Ensure units are findable - hardcode the path since fpcmkcfg variables may not expand
          UNITS_DIR=$(find $HOME/fpc-trunk/lib/fpc -name "system.ppu" 2>/dev/null | head -1)
          if [ -n "$UNITS_DIR" ]; then
            UNITS_BASE=$(dirname "$UNITS_DIR")
            echo "-Fu$UNITS_BASE" >> $HOME/fpc-trunk/bin/fpc.cfg
            echo "-Fu$UNITS_BASE/*" >> $HOME/fpc-trunk/bin/fpc.cfg
            echo "Found units at: $UNITS_BASE"
          else
            echo "WARNING: system.ppu not found under ~/fpc-trunk"
            find $HOME/fpc-trunk -name "system.ppu" 2>/dev/null || echo "No system.ppu anywhere"
          fi
          echo "$HOME/fpc-trunk/bin" >> $GITHUB_PATH
          FPC_LIB=$(find $HOME/fpc-trunk/lib/fpc -maxdepth 1 -type d -name '3.*' | head -1)
          if [ -n "$FPC_LIB" ]; then echo "$FPC_LIB" >> $GITHUB_PATH; fi

      - name: Verify FPC
        run: |
          fpc -iV
          fpc -vt -Fu$(pwd)/src -Fi$(pwd)/src tests/nextpas.core.platform/test_platform_ctypes_abi/test_platform_ctypes_abi.lpr -FE/tmp 2>&1 | tail -5 || true

      - name: Run tests (best-effort)
        run: make -C .. core-ci-best-effort-test CORE_CI_HOST=macOS

  test-freebsd:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: freebsd
          version: "14.1"
          run: |
            sudo pkg install -y fpc
            fpc -iV
            make -C "$GITHUB_WORKSPACE" core-ci-best-effort-test CORE_CI_HOST=FreeBSD
