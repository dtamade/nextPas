name: Core CI

on:
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core-ci.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: core

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      - name: Cache FPC trunk
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: ~/fpc-trunk
          key: fpc-trunk-linux-x86_64-v4

      - name: Build FPC trunk from source
        if: steps.cache-fpc.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch main https://gitlab.com/freepascal.org/fpc/source.git fpc-src
          cd fpc-src
          make all FPCDIR=$(pwd) PP=$(which ppcx64) OPT="-O2"
          mkdir -p ~/fpc-trunk/bin ~/fpc-trunk/lib
          make install FPCDIR=$(pwd) PP=$(pwd)/compiler/ppcx64 PREFIX=~/fpc-trunk

      - name: Setup FPC config and PATH
        run: |
          $HOME/fpc-trunk/bin/fpcmkcfg -d "basepath=$HOME/fpc-trunk/lib/fpc/\$fpcversion" -o $HOME/fpc-trunk/bin/fpc.cfg
          cp $HOME/fpc-trunk/bin/fpc.cfg $HOME/fpc-trunk/lib/fpc/3.3.1/fpc.cfg
          sudo cp $HOME/fpc-trunk/bin/fpc.cfg /etc/fpc.cfg
          echo "$HOME/fpc-trunk/bin" >> $GITHUB_PATH
          echo "$HOME/fpc-trunk/lib/fpc/3.3.1" >> $GITHUB_PATH

      - name: Verify FPC
        run: fpc -iV

      - name: Run all tests
        run: make -C .. core-ci-test

      - name: Install wine for Windows cross-runtime smoke
        run: sudo apt-get install -y wine

      - name: Run Wine runtime smoke (not real Windows evidence)
        run: make wine-smoke

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap FPC
        run: brew install fpc

      - name: Cache FPC trunk
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: ~/fpc-trunk
          key: fpc-trunk-macos-aarch64-v7

      - name: Build FPC trunk from source
        if: steps.cache-fpc.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch main https://gitlab.com/freepascal.org/fpc/source.git fpc-src
          cd fpc-src
          PP=$(find /usr/local/lib/fpc /opt/homebrew/lib/fpc -name 'ppca64' -o -name 'ppcaarch64' 2>/dev/null | head -1)
          if [ -z "$PP" ]; then PP=$(which ppca64 2>/dev/null || which ppcaarch64 2>/dev/null); fi
          SDK_PATH=$(xcrun --show-sdk-path)
          make all FPCDIR=$(pwd) PP="$PP" OPT="-O2 -XR$SDK_PATH"
          mkdir -p ~/fpc-trunk
          make install FPCDIR=$(pwd) PP=$(pwd)/compiler/ppca64 PREFIX=~/fpc-trunk

      - name: Setup FPC config and PATH
        run: |
          $HOME/fpc-trunk/bin/fpcmkcfg -d "basepath=$HOME/fpc-trunk/lib/fpc/\$fpcversion" -o $HOME/fpc-trunk/bin/fpc.cfg
          echo "-XR$(xcrun --show-sdk-path)" >> $HOME/fpc-trunk/bin/fpc.cfg
          # Ensure units are findable - hardcode the path since fpcmkcfg variables may not expand
          UNITS_DIR=$(find $HOME/fpc-trunk/lib/fpc -name "system.ppu" 2>/dev/null | head -1)
          if [ -n "$UNITS_DIR" ]; then
            UNITS_BASE=$(dirname "$UNITS_DIR")
            echo "-Fu$UNITS_BASE" >> $HOME/fpc-trunk/bin/fpc.cfg
            echo "-Fu$UNITS_BASE/*" >> $HOME/fpc-trunk/bin/fpc.cfg
            echo "Found units at: $UNITS_BASE"
          else
            echo "WARNING: system.ppu not found under ~/fpc-trunk"
            find $HOME/fpc-trunk -name "system.ppu" 2>/dev/null || echo "No system.ppu anywhere"
          fi
          echo "$HOME/fpc-trunk/bin" >> $GITHUB_PATH
          FPC_LIB=$(find $HOME/fpc-trunk/lib/fpc -maxdepth 1 -type d -name '3.*' | head -1)
          if [ -n "$FPC_LIB" ]; then echo "$FPC_LIB" >> $GITHUB_PATH; fi

      - name: Verify FPC
        run: |
          fpc -iV
          fpc -vt -Fu$(pwd)/src -Fi$(pwd)/src tests/nextpas.core.platform/test_platform_ctypes_abi/test_platform_ctypes_abi.lpr -FE/tmp 2>&1 | tail -5 || true

      - name: Run tests (best-effort)
        run: make -C .. core-ci-best-effort-test CORE_CI_HOST=macOS

  test-windows-runtime:
    runs-on: windows-latest
    # nextpas.core needs FPC 3.3.1+ (functionreferences). Chocolatey freepascal is
    # i386 3.0.4; MSYS2 has no fpc package. Use official trunk x86_64-win64 snapshot
    # plus MSYS2 only for GNU make/bash.
    defaults:
      run:
        shell: msys2 {0}
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            tar
            curl

      - name: Cache FPC 3.3.1 x86_64-win64 snapshot
        id: cache-fpc-win64
        uses: actions/cache@v4
        with:
          path: ~/fpc-trunk
          # Bump when snapshot URL/filename changes.
          key: fpc-3.3.1-x86_64-win64-linuxbuilt-20260716

      - name: Install FPC 3.3.1 x86_64-win64 trunk snapshot
        run: |
          set -euo pipefail
          FPC_ROOT="${HOME}/fpc-trunk"
          BIN_DIR="${FPC_ROOT}/bin/x86_64-win64"
          UNITS_DIR="${FPC_ROOT}/units/x86_64-win64"
          # Official daily trunk snapshot (BUILDFULLNATIVE) with native fpc.exe/ppcx64.exe.
          FPC_URL='https://downloads.freepascal.org/fpc/snapshot/trunk/x86_64-win64/fpc-3.3.1.x86_64-win64.built.on.x86_64-linux.tar.gz'

          if [[ ! -f "${BIN_DIR}/fpc.exe" || ! -f "${UNITS_DIR}/rtl/system.ppu" ]]; then
            echo "Downloading FPC trunk win64 snapshot..."
            rm -rf "${FPC_ROOT}"
            mkdir -p "${FPC_ROOT}"
            curl -fL --retry 5 --retry-delay 5 -o /tmp/fpc-win64.tgz "${FPC_URL}"
            tar -xzf /tmp/fpc-win64.tgz -C "${FPC_ROOT}"
          else
            echo "Using cached FPC at ${FPC_ROOT}"
          fi

          test -f "${BIN_DIR}/fpc.exe"
          test -f "${BIN_DIR}/ppcx64.exe"
          test -f "${UNITS_DIR}/rtl/system.ppu"

          # fpc.exe resolves units via fpc.cfg beside itself.
          if command -v cygpath >/dev/null 2>&1; then
            UNITS_CFG="$(cygpath -m "${UNITS_DIR}")"
            BIN_CFG="$(cygpath -m "${BIN_DIR}")"
          else
            UNITS_CFG="${UNITS_DIR}"
            BIN_CFG="${BIN_DIR}"
          fi
          printf '%s\n' \
            "-Fu${UNITS_CFG}" \
            "-Fu${UNITS_CFG}/*" \
            "-FD${BIN_CFG}" \
            > "${BIN_DIR}/fpc.cfg"
          echo "--- fpc.cfg ---"
          cat "${BIN_DIR}/fpc.cfg"

          # Prefer snapshot bin over any leftover chocolatey/system fpc.
          export PATH="${BIN_DIR}:${FPC_ROOT}/bin:${PATH}"
          echo "PATH=${BIN_DIR}:${FPC_ROOT}/bin:${PATH}" >> "${GITHUB_ENV}"

          command -v fpc
          fpc -iV
          fpc -iTP
          fpc -iTO
          cpu="$(fpc -iTP)"
          os="$(fpc -iTO)"
          echo "fpc target cpu=${cpu} os=${os}"
          case "${cpu}" in
            x86_64|X86_64) ;;
            *) echo "error: need x86_64 FPC, got ${cpu}" >&2; exit 1 ;;
          esac
          case "${os}" in
            Win64|win64|Windows|windows) ;;
            *) echo "error: need Windows target, got ${os}" >&2; exit 1 ;;
          esac
          # Smoke-compile: prove units resolve and functionreferences work (3.3.1+).
          # Use a Windows-native path; fpc.exe does not understand MSYS /tmp.
          SMOKE_DIR="${FPC_ROOT}/smoke"
          mkdir -p "${SMOKE_DIR}"
          printf '%s\n' \
            'program t;' \
            '{$mode objfpc}{$H+}' \
            '{$modeswitch functionreferences}' \
            'type P = reference to procedure;' \
            'begin' \
            'end.' \
            > "${SMOKE_DIR}/fpc_ref_smoke.pas"
          if command -v cygpath >/dev/null 2>&1; then
            SMOKE_WIN="$(cygpath -m "${SMOKE_DIR}")"
          else
            SMOKE_WIN="${SMOKE_DIR}"
          fi
          fpc "-FE${SMOKE_WIN}" "${SMOKE_WIN}/fpc_ref_smoke.pas"
          make --version | head -n 1

      - name: Run Windows runtime matrix
        run: |
          set -euo pipefail
          # Real Windows host evidence (not Wine).
          # 14 suite dirs + 3 dedicated real gates.
          # truth=real-windows-runtime-ci only — not full ci-matrix until ROADMAP D1.d.
          bash scripts/platform-windows-ci-matrix.sh

  test-freebsd:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: freebsd
          version: "14.1"
          run: |
            sudo pkg install -y fpc
            fpc -iV
            make -C "$GITHUB_WORKSPACE" core-ci-best-effort-test CORE_CI_HOST=FreeBSD
