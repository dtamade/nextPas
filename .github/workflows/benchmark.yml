name: Performance Benchmark

on:
  push:
    branches: [ main, bench ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # nextpas.core needs FPC trunk (functionreferences); distro fpc is 3.2.2.
    # Same trunk-cache pattern (and cache key) as core-ci.yml test-linux.
    - name: Install bootstrap FPC
      run: |
        sudo apt-get update
        sudo apt-get install -y fpc

    - name: Cache FPC trunk
      id: cache-fpc
      uses: actions/cache@v4
      with:
        path: ~/fpc-trunk
        key: fpc-trunk-linux-x86_64-v4

    - name: Build FPC trunk from source
      if: steps.cache-fpc.outputs.cache-hit != 'true'
      working-directory: /tmp
      run: |
        git clone --depth 1 --branch main https://gitlab.com/freepascal.org/fpc/source.git fpc-src
        cd fpc-src
        make all FPCDIR=$(pwd) PP=$(which ppcx64) OPT="-O2"
        mkdir -p ~/fpc-trunk/bin ~/fpc-trunk/lib
        make install FPCDIR=$(pwd) PP=$(pwd)/compiler/ppcx64 PREFIX=~/fpc-trunk

    - name: Setup FPC config and PATH
      run: |
        $HOME/fpc-trunk/bin/fpcmkcfg -d "basepath=$HOME/fpc-trunk/lib/fpc/\$fpcversion" -o $HOME/fpc-trunk/bin/fpc.cfg
        cp $HOME/fpc-trunk/bin/fpc.cfg $HOME/fpc-trunk/lib/fpc/3.3.1/fpc.cfg
        sudo cp $HOME/fpc-trunk/bin/fpc.cfg /etc/fpc.cfg
        echo "$HOME/fpc-trunk/bin" >> $GITHUB_PATH
        echo "$HOME/fpc-trunk/lib/fpc/3.3.1" >> $GITHUB_PATH

    - name: Verify FPC
      run: fpc -iV

    - name: Run Benchmark Tests
      run: |
        chmod +x scripts/bench-ci.sh
        ./scripts/bench-ci.sh test

    - name: Generate Baseline (main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        ./scripts/bench-ci.sh baseline bench-baseline-main.json

    - name: Upload Baseline
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-baseline
        path: bench-baseline-main.json

    - name: Download Baseline (PR)
      if: github.event_name == 'pull_request'
      uses: actions/download-artifact@v4
      with:
        name: benchmark-baseline
      continue-on-error: true

    - name: Compare with Baseline (PR)
      if: github.event_name == 'pull_request'
      run: |
        if [ -f bench-baseline-main.json ]; then
          ./scripts/bench-ci.sh compare bench-baseline-main.json bench-ci-report.json
        else
          echo "No baseline found, skipping comparison"
        fi

    - name: Upload Benchmark Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: bench-ci-report.json
      continue-on-error: true

    - name: Comment PR with Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let report = '## Benchmark Results\n\n';

          if (fs.existsSync('bench-ci-report.json')) {
            const data = JSON.parse(fs.readFileSync('bench-ci-report.json', 'utf8'));

            report += `| Metric | Value |\n|--------|-------|\n`;
            report += `| Timestamp | ${data.timestamp || 'N/A'} |\n`;
            report += `| Entries | ${data.entries ? data.entries.length : 0} |\n\n`;

            if (data.entries && data.entries.length > 0) {
              report += `| Name | ns/op | stddev | P95 | P99 |\n`;
              report += `|------|-------|--------|-----|-----|\n`;

              data.entries.forEach(entry => {
                report += `| ${entry.name} | ${entry.mean_ns.toFixed(2)} | ${entry.stddev_ns.toFixed(2)} | ${entry.p95_ns.toFixed(2)} | ${entry.p99_ns.toFixed(2)} |\n`;
              });
            }
          } else {
            report += 'No benchmark report generated.\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
