# Template: copy to .github/workflows/bench-module.yml and adapt runner image.
#
# Real gates used by this repo's bench module (as of 2026-07-19):
#   make hygiene
#   make -C core/tests/nextpas.core.bench clean test
#   make -C core/benchmarks/nextpas.core.bench clean test   # optional smoke
#
# Requires: host with FPC 3.3.x on PATH (actions/setup-fpc may not match trunk).

name: Bench Module Gate

on:
  pull_request:
    paths:
      - 'core/src/nextpas.core.bench*'
      - 'core/tests/nextpas.core.bench/**'
      - 'core/docs/bench/**'
      - 'core/benchmarks/nextpas.core.bench/**'
  workflow_dispatch:

jobs:
  bench-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Note FPC requirement
        run: |
          echo "Install or cache FPC 3.3.x matching the project toolchain."
          echo "This template assumes fpc is already on PATH."
          fpc -iV || true

      - name: Hygiene
        run: make hygiene

      - name: Module tests
        run: make -C core/tests/nextpas.core.bench clean test

      - name: Module micro-benchmarks (optional smoke)
        run: make -C core/benchmarks/nextpas.core.bench clean test
