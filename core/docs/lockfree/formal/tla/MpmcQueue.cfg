\* MPMC Queue TLA+ 模型配置文件
\* 用于 TLC 模型检查器

SPECIFICATION Spec

CONSTANTS
  Capacity = 4
  MaxOps = 8
  Producers = {p1, p2}
  Consumers = {c1, c2}
  MaxRetries = 3

INVARIANTS
  TypeOK
  QueueBounds
  SequenceMonotonic

PROPERTIES
  NoDeadlock
  Progress
  FifoOrder
  ABASafety

CHECK_DEADLOCK TRUE

\* 状态空间限制
CONSTRAINT
  ops <= MaxOps

\* 对称性集合
SYMMETRY
  Permutations(Producers)
  Permutations(Consumers)
