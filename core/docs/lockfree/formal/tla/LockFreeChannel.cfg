\* Lock-Free Channel TLA+ 模型配置文件
\* 用于 TLC 模型检查器

SPECIFICATION Spec

CONSTANTS
  MaxCapacity = 4
  MaxOps = 6
  Producers = {p1}
  Consumers = {c1}
  TimeoutValue = 3

INVARIANTS
  TypeOK
  ChannelBounds

PROPERTIES
  NoDeadlock
  Progress
  NoSendAfterClose
  ReceiveAfterClose
  BlockedSenderWakeup
  BlockedReceiverWakeup
  SelectFairness
  ResizeSafety

CHECK_DEADLOCK TRUE

\* 状态空间限制
CONSTRAINT
  ops <= MaxOps

\* 对称性集合
SYMMETRY
  Permutations(Producers)
  Permutations(Consumers)
