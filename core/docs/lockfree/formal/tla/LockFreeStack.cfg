\* Lock-Free Stack TLA+ 模型配置文件
\* 用于 TLC 模型检查器（可选；无 TLC 时 model-only）

SPECIFICATION Spec

CONSTANTS
  Capacity = 3
  MaxOps = 8
  Producers = {p1}
  Consumers = {c1}

INVARIANTS
  TypeOK
  BoundedCapacity
  CloseRejectsPublish

PROPERTIES
  LifoAdjacent

CHECK_DEADLOCK TRUE

CONSTRAINT
  ops <= MaxOps

SYMMETRY
  Permutations(Producers)
  Permutations(Consumers)
