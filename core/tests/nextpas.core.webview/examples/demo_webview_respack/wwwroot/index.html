<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>nextPas WebView — respack</title>
<style>
:root{--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--txt:#e7ecf7;--dim:#8b95ad;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0f1d;color:var(--txt);padding:28px 32px}
h1{font-size:22px}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
button{appearance:none;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;background:linear-gradient(92deg,#6d8bff,#39c7ef);color:#081020}
.log{font-family:var(--mono);font-size:12px;line-height:1.7;max-height:160px;overflow:auto;color:#aab6cf;margin-top:8px}
.muted{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:6px}
footer{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--dim)}
</style></head><body>
<h1>nextPas WebView — respack assets</h1>
<div class="sub">npres://app/index.html via IVfs adapter · <span id="mode">…</span> · bridge v<span id="ver">…</span></div>
<div class="card">
  <div style="display:flex;gap:10px;align-items:center">
    <button id="pingBtn">invoke ping</button>
    <span id="pingOut" style="font-family:var(--mono);color:#9ff3e0">—</span>
  </div>
  <div class="muted">window.__npw.invoke("demo.ping")</div>
  <div class="log" id="log"></div>
</div>
<footer>close window to exit · dev: --dev (os vfs) / --dev-server http://localhost:5173 (http)</footer>
<script>
function $(id){return document.getElementById(id)}
function log(s){var d=document.createElement("div");d.textContent=s;$("log").prepend(d)}
log("booting…");
__npw.ready.then(function(){
  $("ver").textContent=__npw.version;
  log("bridge ready v"+__npw.version);
  var m=new URLSearchParams(location.search).get("mode")||"embedded";
  $("mode").textContent=m;
});
$("pingBtn").addEventListener("click",function(){
  __npw.invoke("demo.ping",{hello:"world"}).then(function(r){
    $("pingOut").textContent=JSON.stringify(r);
    log("ping → "+JSON.stringify(r));
  },function(e){ log("ping failed "+JSON.stringify(e)); });
});
__npw.listen("demo.event",function(p){ log("event ← "+JSON.stringify(p)); });
</script></body></html>
