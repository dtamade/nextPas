<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nextPas WebView — respack</title>
<style>
:root{--bg:#0b0f1d;--bg2:#0f1730;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.035);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);--txt:#e7ecf7;--dim:#8b95ad;--accent:#6d8bff;--accent2:#39c7ef;--ok:#43e5c8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--radius:16px;--shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06) inset}
[data-theme="light"]{--bg:#f6f7fb;--bg2:#eef1f8;--panel:rgba(255,255,255,.82);--panel2:rgba(255,255,255,.6);--line:rgba(16,22,40,.10);--line2:rgba(16,22,40,.06);--txt:#0f1a33;--dim:#6b7894;--shadow:0 8px 24px rgba(16,22,40,.08),0 1px 0 rgba(255,255,255,.9) inset}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark light}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:radial-gradient(1100px 620px at 12% -10%,#1c2749 0%,transparent 55%),radial-gradient(900px 520px at 100% 0%,#12304a 0%,transparent 50%),var(--bg);color:var(--txt);min-height:100vh;padding:34px 38px 74px;transition:background .35s ease,color .25s ease}
[data-theme="light"] body{background:radial-gradient(1100px 620px at 12% -10%,#dbe6ff 0%,transparent 55%),radial-gradient(900px 520px at 100% 0%,#d6f0ff 0%,transparent 50%),var(--bg)}
.wrap{max-width:780px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;letter-spacing:.2px;background:linear-gradient(92deg,var(--accent),var(--accent2) 60%,var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12px;margin-top:6px;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--panel2);border:1px solid var(--line2);padding:6px 10px;border-radius:999px;backdrop-filter:blur(10px)}
.pill b{color:var(--txt);font-weight:700}.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(67,229,200,.7);display:inline-block}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--txt);width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:16px;backdrop-filter:blur(12px) saturate(1.2);box-shadow:var(--shadow);transition:transform .15s ease,border-color .2s ease}
.icon-btn:hover{transform:translateY(-1px);border-color:rgba(109,139,255,.35)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow);overflow:hidden;transition:transform .18s ease,border-color .2s ease}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 55%);pointer-events:none}
.card:hover{transform:translateY(-1px);border-color:rgba(109,139,255,.22)}
.card h2{position:relative;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
button.primary{appearance:none;border:0;border-radius:11px;padding:9px 16px;font-size:13px;font-weight:700;color:#081020;cursor:pointer;background:linear-gradient(94deg,var(--accent),var(--accent2));transition:transform .12s ease,box-shadow .12s ease,filter .2s ease;box-shadow:0 2px 10px rgba(57,199,239,.22)}
button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(57,199,239,.32);filter:saturate(1.05)}
button.primary:active{transform:none}button.primary:disabled{opacity:.45;cursor:default;transform:none}
.val{font-family:var(--mono);font-size:13px;color:var(--ok);background:rgba(95,212,245,.08);border:1px solid rgba(95,212,245,.22);border-radius:10px;padding:7px 11px;min-width:140px;word-break:break-all;backdrop-filter:blur(6px)}
[data-theme="light"] .val{background:rgba(57,199,239,.08);border-color:rgba(57,199,239,.18);color:#0a7a6b}
.muted{color:var(--dim);font-size:12px;margin-top:10px;font-family:var(--mono)}
.log{font-family:var(--mono);font-size:12px;line-height:1.75;max-height:150px;overflow:auto;color:var(--dim);position:relative}
.log div{border-left:2px solid transparent;padding-left:8px;margin:2px 0;white-space:pre-wrap;word-break:break-all}
.log div:first-child{border-color:var(--accent2);color:var(--txt)}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,11,22,.72);backdrop-filter:blur(12px) saturate(1.2);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--dim)}
[data-theme="light"] footer{background:rgba(246,247,251,.78);border-top-color:rgba(16,22,40,.08)}
footer b{color:var(--ok);font-weight:700}[data-theme="light"] footer b{color:#0a7a6b}
@media(max-width:640px){body{padding:18px 16px 80px}.wrap{max-width:100%}h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.primary:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.skeleton{position:relative;overflow:hidden;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);background-size:400% 100%;animation:skeleton 1.2s ease-in-out infinite}
@keyframes skeleton{0%{background-position:100% 0}100%{background-position:-100% 0}}
.card.error{border-color:rgba(255,80,80,.35);background:rgba(255,80,80,.06)}[data-theme="light"] .card.error{background:rgba(255,80,80,.07)}
.card.error h2{color:#ff6b6b}
</style></head><body>
<div class="wrap">
<div class="top"><div><h1>nextPas WebView — respack</h1><div class="sub">npres://app/index.html via IVfs adapter · <span id="mode">…</span> · dev-server 惰性直通</div></div><div style="display:flex;gap:10px;align-items:center"><span class="pill"><i></i><b id="ver">…</b>&nbsp;bridge</span><button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">◐</button></div></div>
<div class="grid" id="grid">
<div class="card error" id="errCard" style="display:none" role="alert" aria-live="assertive"><h2>Load / Invoke error</h2><div class="muted" id="errMsg" style="margin-top:8px">—</div><div style="margin-top:12px"><button class="primary" id="errRetry">Dismiss</button></div></div>
<div class="card"><h2>Respack ping</h2>
<div class="row"><button class="primary" id="pingBtn" aria-label="invoke ping">invoke ping</button><span class="val" id="pingOut">—</span><span class="val" id="perf" style="min-width:90px">—</span></div>
<div class="muted" id="hint">window.__npw.invoke("demo.ping") · mode <span id="modeLabel">embedded</span></div></div>
<div class="card" style="grid-column:1/-1"><h2>Event log</h2>
<div class="log" id="log" role="log" aria-live="polite" aria-atomic="false"></div></div>
</div></div>
<footer role="status" aria-live="polite"><span>state <b id="state">booting</b></span><span>last op <b id="lastms">—</b></span><span>theme <b id="themeLabel">auto</b></span><span>close window to exit · --dev / --dev-server</span></footer>
<script>
function $(id){return document.getElementById(id)}
function lastOp(t0){var d=Math.round(performance.now()-t0);$("lastms").textContent=d+" ms";return d}
function log(s){var d=document.createElement("div");d.textContent=s;$("log").prepend(d)}
function showErr(m){var c=$("errCard"),e=$("errMsg");if(c&&e){e.textContent=m;c.style.display="";}}
(function(){var k="npw-theme";function apply(t){document.documentElement.setAttribute("data-theme",t);var l=$("themeLabel");if(l)l.textContent=t;var bb=$("themeBtn");if(bb)bb.setAttribute("aria-pressed",t==="light"?"true":"false");try{localStorage.setItem(k,t);}catch(e){}}var s=null;try{s=localStorage.getItem(k);}catch(e){}if(s==="light"||s==="dark")apply(s);else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)apply("light");else apply("dark");var b=$("themeBtn");if(b)b.addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme");apply(cur==="dark"?"light":"dark")});try{var mq=window.matchMedia("(prefers-color-scheme: light)");if(mq&&mq.addEventListener)mq.addEventListener("change",function(e){var cur=null;try{cur=localStorage.getItem(k);}catch(ex){}if(cur!=="light"&&cur!=="dark")apply(e.matches?"light":"dark")});}catch(e){}})();
var grid=$("grid");if(grid)grid.classList.add("skeleton");
var er=$("errRetry");if(er)er.addEventListener("click",function(){var c=$("errCard");if(c)c.style.display="none";});
__npw.ready.then(function(){$("ver").textContent="v"+__npw.version;var st=$("state");st.textContent="ready";st.style.color="#43e5c8";if(grid)grid.classList.remove("skeleton");log("bridge ready · protocol v"+__npw.version);var m=new URLSearchParams(location.search).get("mode")||$("mode").textContent;if(m&&m!=="…"){$("mode").textContent=m;$("modeLabel").textContent=m;}}).catch(function(e){showErr("bridge init: "+e);if(grid)grid.classList.remove("skeleton");})
__npw.listen("demo.event",function(p){log("event ← "+JSON.stringify(p));});
$("pingBtn").addEventListener("click",function(){var t0=performance.now();$("pingBtn").disabled=true;$("pingOut").textContent="…";__npw.invoke("demo.ping",{hello:"world"}).then(function(r){$("pingOut").textContent=JSON.stringify(r);lastOp(t0);log("ping → "+JSON.stringify(r)+" ("+Math.round(performance.now()-t0)+" ms)");},function(e){$("pingOut").textContent="ERR";log("ping failed "+JSON.stringify(e));showErr("ping: "+JSON.stringify(e));}).then(function(){$("pingBtn").disabled=false;})});
</script></body></html>
