[package]
name = "bench_http_server_hyper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench_http_server_hyper"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
